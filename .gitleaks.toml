# Shared gitleaks ruleset for serf.
#
# Used by `make secret-scan` (whole repo) and `make fuzz-corpus-scan` (the fuzz
# seed corpora the harvester writes). The harvester's write-time barrier shells
# out to the same engine, so the writer and the repo gate cannot drift.
#
# It extends gitleaks' built-in rules and allowlists the deliberately-planted
# FAKE secrets in the fuzz test fixtures (which prove the scrubber strips a real
# key) plus the shape-scrubbed seed corpora (all placeholders / structural enum
# values — never real secrets by construction).

title = "serf"

[extend]
useDefault = true

[allowlist]
description = "fuzz-toolkit test fixtures and shape-scrubbed seed corpora"

# Deliberately-planted fake keys in the sanitizer/harvester adversarial tests,
# plus pre-existing non-secret content the generic-api-key rule mis-flags: a
# domain-separation scope label in production code, a benign test phrase, and the
# fake "sk-LIVETEST…" key used in subagent test fixtures and design docs.
regexTarget = "match"
regexes = [
  '''sk-proj-PLANT3D[A-Za-z0-9]+''',
  '''sk-proj-abcdefABCDEF[A-Za-z0-9]+''',
  '''sk-ant-api03-abcdefABCDEF[A-Za-z0-9]+''',
  '''AIzaSyA1234567890123456789012345678901234''',
  '''FUZZ-OUT-OF-ROOT-SECRET[A-Za-z0-9-]+''',
  '''serf-continuation-scope-v1''', # domain-separation label in llm/continuation_secret.go, not a secret
  '''observation/drains''',         # benign phrase mis-flagged in agent/job_delegate_send_test.go
  '''sk-LIVETEST[0-9a-f]*''',       # fake illustrative key in subagent fixtures + design docs
  '''a\.eyJlbWFpbCI6ImpAZXhhbXBsZS5jb20ifQ\.sig''', # fake JWT ({"email":"j@example.com"}) in auth/openai fuzz seeds
  '''att_02wMz5TxuyedWwYBSOAa[0-9a-z]*''', # deterministic attempt-id fixtures in cmd/serf-doctor/main_test.go, not keys
]

# The seed corpora are deliberately NOT path-allowlisted: that would make
# `make fuzz-corpus-scan` (which points gitleaks AT testdata/fuzz) a no-op. The
# corpora are shape-scrubbed (placeholders / structural enums), and the regexes
# above allowlist the few deliberately-planted fake keys, so the corpus scan
# genuinely verifies no real secret was committed.
# docs/superpowers/** are internal design/planning docs that carry illustrative
# example keys (e.g. the package path "internal/hubapi" the generic rule trips on).
paths = [
  '''docs/superpowers/.*''',
  # The subagent-output redaction tests exist to PROVE the redactor strips
  # secrets: every "secret" in them is a deliberately-fake fixture (hunter2isweak,
  # ghp_ABCDEF…, a fake JWT, sk-EnvDump…) by construction. Path-allowlisted like
  # the design docs above rather than chasing a value-regex per fixture, since the
  # test suite grows new fixture shapes over time.
  '''agent/redact_test\.go''',
  '''agent/subagent_output_test\.go''',
  # This tracked frontend test uses a deterministic project identifier as a
  # fixture, not a credential; the generic API-key rule cannot distinguish it.
  '''cmd/serf-hub/frontend/src/shell/rail/Rail\.test\.tsx''',
  # inspo/ holds untracked vendored reference source (Pi, codex) whose test
  # fixtures carry deliberately-planted fake keys; it is gitignored and never
  # committed, but `make secret-scan` walks the whole working tree.
  '''inspo/.*''',
  # .claude/worktrees/ holds linked git worktrees — transient full checkouts
  # (gitignored, never committed, absent in CI) whose web-UI test fixtures
  # carry deliberately-fake secret-shaped strings; same class as inspo/.
  # Anchored to a path segment boundary (start-of-path or preceding '/') so it
  # cannot also match an unrelated path that merely contains the substring
  # "claude/worktrees/" mid-component; every real worktree path is one of
  # these two shapes, so this is marginally tighter with no behavior change.
  '''(^|/)\.claude/worktrees/.*''',
  # .superpowers/ holds local skill-run state and logs. It is gitignored and
  # never committed, so transient prompt fixtures must not fail repo scans.
  '''(^|/)\.superpowers/.*''',
  # .env is the local, gitignored credential file a dev checkout carries by
  # design. The regex matches the basename at ANY depth (root or any
  # subdirectory), not just the repo root: gitignore's own `.env` entry
  # (unanchored, no leading slash) is likewise depth-agnostic, so this
  # allowlist matches exactly what's already gitignored everywhere in the
  # tree. With gitleaks installed locally, the whole-tree walk flagged it on
  # every `make lint`. Allowlisted per Jesse (2026-07-22), reversing the
  # earlier scream-on-sight stance. Residual risk accepted: a deliberately
  # force-added .env would pass this scan — it stays gitignored, so
  # committing it requires explicit override.
  '''(^|/)\.env$''',
]
