<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>p6g8 layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  body {
    margin: 0;
    background: var(--surface-1);
    font-family: var(--font-sans);
  }
  /* Mirrors PaneScaffold's .pane (border+radius) and .body (space-4=16px
     padding), at the pane content width the real "Start an agent" form gets
     at 1440px with the sidebar expanded and no transcript tab open. */
  .page {
    width: 1116px;
    box-sizing: border-box;
    border: 1px solid var(--edge);
    border-radius: var(--radius-pane);
    padding: var(--space-4);
  }
  select.select {
    height: 32px;
    padding: 0 var(--space-3);
    border-radius: var(--radius-control);
    border: 1px solid var(--edge);
    background: var(--surface-1);
    color: var(--ink-hi);
    font-family: var(--font-sans);
    font-size: var(--font-size-ui);
  }
</style>
</head>
<body data-font-size="m">
<div class="page">
 <div class="form">
  <!-- Reproduces Spawn.tsx's .cfg row (cfgDir: PathField trigger + branch
       chip / cfgModel: ModelCatalog trigger / Effort FormRow) verbatim,
       against the REAL class names from formrow/spawn/pathfield/fieldTrigger
       .module.css - not a redrawn approximation. -->
  <div class="cfg">
    <div class="cfgDir">
      <div class="root" id="formrow-cwd">
        <label for="spawn-cwd" class="label">Working directory</label>
        <div class="control">
          <button id="spawn-cwd" class="trigger" type="button">
            <span class="triggerValue" id="cwd-value">/Users/jesse/prime-radiant/toil-suite/serf</span>
            <span class="chevron" aria-hidden="true">&#9662;</span>
          </button>
        </div>
      </div>
      <span class="branch" data-testid="spawn-branch" title="HEAD main" id="branch-chip">
        <span class="branchSeparator" aria-hidden="true">&middot;</span><span id="branch-text">main</span>
      </span>
    </div>

    <div class="cfgModel">
      <span class="fieldLabel" id="spawn-model-label">Model</span>
      <button class="trigger" type="button">
        <span class="triggerValue">anthropic/claude-sonnet-4-5-20250929</span>
        <span class="chevron" aria-hidden="true">&#9662;</span>
      </button>
    </div>

    <div class="root" id="formrow-effort">
      <label for="spawn-reasoning" class="label">Effort</label>
      <div class="control">
        <select id="spawn-reasoning" class="select">
          <option>(default)</option>
        </select>
      </div>
    </div>
  </div>
 </div>
</div>
<script>
window.measure = () => {
  const branch = document.querySelector('[data-testid="spawn-branch"]').getBoundingClientRect();
  const effort = document.querySelector('#formrow-effort .label').getBoundingClientRect();
  const cfgDir = document.querySelector('.cfgDir').getBoundingClientRect();
  const trigger = document.querySelector('#spawn-cwd').getBoundingClientRect();
  const overlapX = Math.min(branch.right, effort.right) - Math.max(branch.left, effort.left);
  const sameBand = branch.top < effort.bottom && branch.bottom > effort.top;
  return {
    branch: {left: branch.left, right: branch.right, top: branch.top, bottom: branch.bottom},
    effort: {left: effort.left, right: effort.right, top: effort.top, bottom: effort.bottom},
    cfgDir: {left: cfgDir.left, right: cfgDir.right, width: cfgDir.width},
    trigger: {left: trigger.left, right: trigger.right, width: trigger.width},
    // Positive = the trigger box has spilled out past its own flex
    // container's right edge - the actual mechanism p6g8's min-width:0 fix
    // prevents, and the most width-independent signal (doesn't depend on
    // reproducing the live app's exact pane/gap pixels to line up with a
    // neighbouring column).
    triggerOverflowsCfgDir: trigger.right - cfgDir.right,
    // The literal symptom from the kata: does the branch chip collide with
    // the Effort label in the same vertical band. Kept as secondary,
    // informational evidence - it depends on this harness's approximated
    // pane width lining up with the live app's, which is not guaranteed.
    overlapX: sameBand ? overlapX : 0,
    sameVerticalBand: sameBand,
  };
};
</script>
</body>
</html>
