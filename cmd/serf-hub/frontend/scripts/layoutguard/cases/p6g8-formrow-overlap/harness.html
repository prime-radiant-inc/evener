<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>p6g8 layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  body {
    margin: 0;
    background: var(--surface-1);
    font-family: var(--font-sans);
  }
  /* Mirrors PaneScaffold's .pane (border+radius) and .body (space-4=16px
     padding), at the width of a "Start an agent" pane DOCKED NARROW beside
     another panel on a desktop display. spawn.module.css designs for exactly
     that state - its .form is an inline-size container with a @container
     (max-width: 559px) rule for the Start button - so this is an ordinary
     configuration, not a contrived one.

     The width is what puts the config row under pressure, and pressure is the
     only condition under which min-width:0 does anything. It was 1116px, the
     pane content width at 1440px with the sidebar expanded, and at that size
     this fixture could not fail: .form's own max-width:720px capped the row
     long before 1116px, so the column never got tight and deleting
     min-width:0 still left the trigger fitting with 3.6px to spare. Anything
     above ~750px is the same fixture (kata e4sh, second review).

     640px gives a content box of 606px: below .form's 720px cap so the column
     is genuinely tight, and above the 559px container breakpoint so this case
     is not accidentally measuring the Start button's word collapse. Measured
     at 640px, with the plain repo-root cwd below: unmutated fits with 44.0px
     to spare, deleting min-width:0 overflows by 110.4px. Do not widen it.
     Do not narrow it past ~600px either - there the row wraps, and the
     branch-vs-effort overlap assertion stops meaning anything
     (sameVerticalBand goes false, overlapX 0). */
  .page {
    width: 640px;
    box-sizing: border-box;
    border: 1px solid var(--edge);
    border-radius: var(--radius-pane);
    padding: var(--space-4);
  }
  select.select {
    height: 32px;
    padding: 0 var(--space-3);
    border-radius: var(--radius-control);
    border: 1px solid var(--edge);
    background: var(--surface-1);
    color: var(--ink-hi);
    font-family: var(--font-sans);
    font-size: var(--font-size-ui);
  }
</style>
</head>
<body data-font-size="m">
<div class="page">
 <div class="form">
  <!-- Reproduces Spawn.tsx's .cfg row (cfgDir: PathField trigger + branch
       chip / cfgModel: ModelCatalog trigger / Effort FormRow) verbatim,
       against the REAL class names from formrow/spawn/pathfield/fieldTrigger
       .module.css - not a redrawn approximation. -->
  <div class="cfg">
    <div class="cfgDir">
      <div class="root" id="formrow-cwd">
        <label for="spawn-cwd" class="label">Working directory</label>
        <div class="control">
          <button id="spawn-cwd" class="trigger" type="button">
            <!-- The plain repo root: this project's most ordinary cwd, and the
                 value this fixture started with. The pressure that makes the
                 case falsifiable comes from .page's width above, NOT from this
                 string - see that comment.

                 An earlier revision of this fix inverted that: it kept .page
                 wide and stretched the path to a 74-character worktree path to
                 keep the mutation red. That worked, but it made the flagship
                 layoutguard case depend on a hand-tuned string, and quietly
                 stopped detecting a deleted min-width:0 for the commonest real
                 value there is - the repo root. Narrowing the column fixed the
                 precondition where it belonged.

                 What remains, stated rather than hidden: a fixture asserting
                 "content wider than column" cannot be wholly independent of
                 content length. Measured at 640px, the mutation is caught down
                 to roughly 28 characters (42 chars overflows by 110.4px; 26
                 chars fits with 14.4px to spare). The ordinary value clears
                 that floor by a wide margin, which is the property that was
                 missing before. -->
            <span class="triggerValue" id="cwd-value">/Users/jesse/prime-radiant/toil-suite/serf</span>
            <span class="chevron" aria-hidden="true">&#9662;</span>
          </button>
        </div>
      </div>
      <span class="branch" data-testid="spawn-branch" title="HEAD main" id="branch-chip">
        <span class="branchSeparator" aria-hidden="true">&middot;</span><span id="branch-text">main</span>
      </span>
    </div>

    <div class="cfgModel">
      <span class="fieldLabel" id="spawn-model-label">Model</span>
      <button class="trigger" type="button">
        <span class="triggerValue">anthropic/claude-sonnet-4-5-20250929</span>
        <span class="chevron" aria-hidden="true">&#9662;</span>
      </button>
    </div>

    <div class="root" id="formrow-effort">
      <label for="spawn-reasoning" class="label">Effort</label>
      <div class="control">
        <select id="spawn-reasoning" class="select">
          <option>(default)</option>
        </select>
      </div>
    </div>
  </div>
 </div>
</div>
<script>
window.measure = () => {
  const branch = document.querySelector('[data-testid="spawn-branch"]').getBoundingClientRect();
  const effort = document.querySelector('#formrow-effort .label').getBoundingClientRect();
  const cfgDir = document.querySelector('.cfgDir').getBoundingClientRect();
  const trigger = document.querySelector('#spawn-cwd').getBoundingClientRect();
  const overlapX = Math.min(branch.right, effort.right) - Math.max(branch.left, effort.left);
  const sameBand = branch.top < effort.bottom && branch.bottom > effort.top;
  return {
    branch: {left: branch.left, right: branch.right, top: branch.top, bottom: branch.bottom},
    effort: {left: effort.left, right: effort.right, top: effort.top, bottom: effort.bottom},
    cfgDir: {left: cfgDir.left, right: cfgDir.right, width: cfgDir.width},
    trigger: {left: trigger.left, right: trigger.right, width: trigger.width},
    // Positive = the trigger box has spilled out past its own flex
    // container's right edge - the actual mechanism p6g8's min-width:0 fix
    // prevents, and the most width-independent signal (doesn't depend on
    // reproducing the live app's exact pane/gap pixels to line up with a
    // neighbouring column).
    triggerOverflowsCfgDir: trigger.right - cfgDir.right,
    // The literal symptom from the kata: does the branch chip collide with
    // the Effort label in the same vertical band. Kept as secondary,
    // informational evidence - it depends on this harness's approximated
    // pane width lining up with the live app's, which is not guaranteed.
    overlapX: sameBand ? overlapX : 0,
    sameVerticalBand: sameBand,
  };
};
</script>
</body>
</html>
