<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>inline composer controls layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  * { transition: none !important; animation: none !important; }
  .fixtures { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; padding: 20px; }
  .fixture { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .fixtureLabel { color: var(--ink-low); font: var(--font-size-caption) var(--font-mono); }
  /* IconButton composes Button's classes at build time. The layout guard loads
     CSS modules directly, so this one declaration supplies only its production
     xs square override without introducing the raw `.xs` module-name collision. */
  .attachmentControl { width: 24px; height: 24px; padding: 0; flex: none; }
  /* SessionMenu's trigger is intentionally a stand-in: menu.module.css and
     modelswitch.module.css both own a local `.trigger` class that CSS Modules
     keeps distinct in production but a raw stylesheet harness cannot. Its size
     is fixed here; SessionChrome's real `.right` owns its placement and focus. */
  .sessionActionControl { appearance: none; width: 32px; height: 32px; padding: 0; border: 1px solid transparent; border-radius: var(--radius-control); background: transparent; color: inherit; font: var(--font-size-ui) var(--font-sans); }
</style>
</head>
<body>
<main class="fixtures"></main>

<template id="fixture-template">
  <section class="fixture">
    <div class="fixtureLabel"></div>
    <div class="card" data-card>
      <div class="controls" data-controls>
        <div class="leading" data-leading>
          <button class="button quiet xs attachmentControl focusAttach" data-attachment type="button" aria-label="Attach image">+</button>
          <div class="inline" data-session-chrome-inline>
            <div class="body" data-status-body>
              <div class="row" data-status>
                <span class="identity">
                  <span class="model"><button class="trigger focusModel" type="button"><span class="value" data-model-value></span><span class="chevron">⌄</span></button></span>
                  <span class="effortTrigger focusEffort" data-effort><span class="separator">·</span><span class="effortValue">high</span><span class="effortChevron">⌄</span><select class="effortSelect" aria-label="Reasoning effort"><option>high</option></select></span>
                </span>
                <meter class="srOnly" aria-label="Context: 67k of 100k tokens used, 67 percent" min="0" value="67000" max="100000"></meter><span class="context" aria-hidden="true"><span class="contextMeter" data-context-meter><span class="track"><span class="fill neutral" style="--fill: 67%"></span></span></span><span class="contextPercent mono" data-context-percent>67%</span></span>
                <span class="item mono workTime" data-work>12m 34s</span>
                <span class="item mono queue"><span class="queueFull" data-queue-full>12 queued</span><span class="queueCompact" data-queue-compact>Q12</span></span>
              </div>
            </div>
            <div class="right"><button class="sessionActionControl focusActions" data-session-actions type="button" aria-label="Session actions">⋯</button></div>
          </div>
        </div>
        <div class="actions" data-submit-actions><button class="button primary xs focusSend" data-send type="button">Send</button></div>
      </div>
    </div>
  </section>
</template>

<script>
const fixtures = [
  { width: 320 },
  { width: 400 },
  { width: 480 },
  { width: 560 },
  { width: 640 },
  { width: 720 },
  { width: 900 },
  { width: 900, shortModel: true },
];
const template = document.querySelector("#fixture-template");
const fixtureRoot = document.querySelector(".fixtures");
for (const spec of fixtures) {
  const fragment = template.content.cloneNode(true);
  const fixture = fragment.querySelector(".fixture");
  fixture.dataset.width = String(spec.width);
  if (spec.shortModel) fixture.dataset.shortModel = "true";
  fixture.querySelector(".fixtureLabel").textContent = `${spec.width}px composer${spec.shortModel ? ", short model label" : ""}`;
  fixture.querySelector("[data-card]").style.width = `${spec.width}px`;
  fixture.querySelector("[data-model-value]").textContent = spec.shortModel
    ? "gpt-5.2"
    : "openrouter/anthropic/claude-sonnet-4.5-extended-thinking";
  fixtureRoot.append(fragment);
}

function box(el) {
  const r = el.getBoundingClientRect();
  return {
    left: r.left,
    right: r.right,
    top: r.top,
    bottom: r.bottom,
    width: r.width,
    height: r.height,
    clientWidth: el.clientWidth,
    scrollWidth: el.scrollWidth,
  };
}

function visibleBox(el) {
  return getComputedStyle(el).display === "none"
    ? { left: 0, right: 0, top: 0, bottom: 0, width: 0, height: 0, clientWidth: 0, scrollWidth: 0 }
    : box(el);
}

window.measure = function () {
  // CDP forcePseudoState applies to the first matching node for each selector.
  // Focus is a style contract, not a per-width contract, so measure those four
  // deliberately forced controls once and attach the result to every fixture.
  const focusedAttachStyle = getComputedStyle(document.querySelector(".focusAttach"));
  const focusedModelStyle = getComputedStyle(document.querySelector(".focusModel"));
  const focusedEffortStyle = getComputedStyle(document.querySelector(".focusEffort"));
  const focusedActionsStyle = getComputedStyle(document.querySelector(".focusActions"));
  const focusedSendStyle = getComputedStyle(document.querySelector(".focusSend"));
  return [...document.querySelectorAll(".fixture")].map((fixture) => {
    const card = fixture.querySelector("[data-card]");
    const controls = fixture.querySelector("[data-controls]");
    const leading = fixture.querySelector("[data-leading]");
    const inlineChrome = fixture.querySelector("[data-session-chrome-inline]");
    const statusBody = fixture.querySelector("[data-status-body]");
    const status = fixture.querySelector("[data-status]");
    const attachment = fixture.querySelector("[data-attachment]");
    const effort = fixture.querySelector("[data-effort]");
    const contextSemantic = fixture.querySelector("meter.srOnly");
    const contextVisual = fixture.querySelector(".context");
    const contextMeter = fixture.querySelector("[data-context-meter]");
    const contextPercent = fixture.querySelector("[data-context-percent]");
    const work = fixture.querySelector("[data-work]");
    const queue = fixture.querySelector(".queue");
    const queueFull = fixture.querySelector("[data-queue-full]");
    const queueCompact = fixture.querySelector("[data-queue-compact]");
    const sessionActions = fixture.querySelector("[data-session-actions]");
    const submitActions = fixture.querySelector("[data-submit-actions]");
    const send = fixture.querySelector("[data-send]");
    const modelValue = fixture.querySelector(".value");
    const modelTrigger = fixture.querySelector(".trigger");
    return {
      width: Number(fixture.dataset.width),
      shortModel: fixture.dataset.shortModel === "true",
      card: box(card),
      controls: box(controls),
      leading: box(leading),
      inlineChrome: box(inlineChrome),
      statusBody: box(statusBody),
      status: box(status),
      attachment: box(attachment),
      modelTrigger: box(modelTrigger),
      identity: box(fixture.querySelector(".identity")),
      effort: visibleBox(effort),
      contextStructure: {
        semanticTag: contextSemantic.tagName,
        semanticChildren: contextSemantic.childElementCount,
        semanticBox: box(contextSemantic),
        semanticNextIsVisual: contextSemantic.nextElementSibling === contextVisual,
        visualTag: contextVisual.tagName,
        visualAriaHidden: contextVisual.getAttribute("aria-hidden"),
      },
      contextMeterDisplay: getComputedStyle(contextMeter).display,
      contextPercentDisplay: getComputedStyle(contextPercent).display,
      context: visibleBox(contextVisual),
      workDisplay: getComputedStyle(work).display,
      work: visibleBox(work),
      queueFullDisplay: getComputedStyle(queueFull).display,
      queueCompactDisplay: getComputedStyle(queueCompact).display,
      queue: visibleBox(queue),
      sessionActions: box(sessionActions),
      submitActions: box(submitActions),
      send: box(send),
      model: {
        triggerWidth: modelTrigger.getBoundingClientRect().width,
        clientWidth: modelValue.clientWidth,
        scrollWidth: modelValue.scrollWidth,
        textOverflow: getComputedStyle(modelValue).textOverflow,
        whiteSpace: getComputedStyle(modelValue).whiteSpace,
      },
      focus: {
        attachOutlineStyle: focusedAttachStyle.outlineStyle,
        attachOutlineWidth: focusedAttachStyle.outlineWidth,
        modelBoxShadow: focusedModelStyle.boxShadow,
        modelOutlineStyle: focusedModelStyle.outlineStyle,
        effortBoxShadow: focusedEffortStyle.boxShadow,
        actionsBoxShadow: focusedActionsStyle.boxShadow,
        actionsOutlineStyle: focusedActionsStyle.outlineStyle,
        sendOutlineStyle: focusedSendStyle.outlineStyle,
        sendOutlineWidth: focusedSendStyle.outlineWidth,
      },
    };
  });
};
</script>
</body>
</html>
