<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600, initial-scale=1">
<title>activity tree responsive layoutguard harness</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #10151C; }
  body { font: 14px/1.5 system-ui, sans-serif; }
  .fixtures {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 32px;
    padding: 32px;
  }
  .fixture {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .fixtureLabel {
    color: #93A3B5;
    font: 12px/1.5 ui-monospace, monospace;
  }
  .fixtureFrame {
    border: 1px solid #2A3542;
    background: #10151C;
  }
</style>
</head>
<body>
<main class="fixtures" data-role="fixtures"></main>
<script>
const LONG_COMMAND = "SERF_SESSION_MODE=retained /usr/bin/env bash -lc 'python3 tools/trace_activity.py --session 02wMz5Txv1C3Hut0M8GCeB --delegate 8 --emit jsonl --follow --with-ancestor-chain --full-command-width --explain-overflow-contract'";
const LONG_OUTPUT = "TRACE 2026-08-03T18:44:21Z delegate-8 retained-output path=/Users/jesse/.local/state/serf/projects/activity-tree-sidebar/logs/delegate-8/output tail=retained bytes wrap through CodeBlock exactly as production does, so this output line is intentionally long enough to wrap across multiple visual lines without ever creating a horizontal scroller in the inspector pane.";

function chevron(direction) {
  const pathByDirection = {
    right: "M6 3.5 L10.5 8 L6 12.5",
    down: "M3.5 6 L8 10.5 L12.5 6",
    left: "M10 3.5 L5.5 8 L10 12.5",
    up: "M3.5 10 L8 5.5 L12.5 10",
  };
  return `
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" style="display:block">
      <path d="${pathByDirection[direction]}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
    </svg>`;
}

function copyIcon() {
  return `
    <svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true" focusable="false" style="display:block">
      <rect x="4.5" y="1.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"></rect>
      <path d="M9.5 12.5H3A1.5 1.5 0 0 1 1.5 11V4.5" fill="none" stroke="currentColor" stroke-width="1.2"></path>
    </svg>`;
}

function statusDot(family, label) {
  return `<span role="img" aria-label="${label}" class="dot ${family}"></span>`;
}

function rowMarkup({
  label,
  detail,
  status,
  statusFamily,
  hasChildren = false,
  expanded = false,
  selected = false,
  branchError = "",
  continuation = "",
  continuationLabel = "Continue retained branch",
  labelRole = "",
  detailRole = "",
}) {
  return `
    <div role="treeitem" aria-label="${escapeHtml(label)}" aria-expanded="${hasChildren ? String(expanded) : "false"}" aria-selected="${selected ? "true" : "false"}" tabIndex="0" class="row${selected ? " rowSelected" : ""}">
      <div class="rowContent">
        ${hasChildren ? `
          <button type="button" tabIndex="-1" class="rowToggle" aria-label="Toggle branch">
            ${chevron(expanded ? "down" : "right")}
          </button>` : '<span class="rowToggle" aria-hidden="true"></span>'}
        ${statusDot(statusFamily, status)}
        <div class="rowMain">
          <span class="rowLabel"${labelRole ? ` data-role="${labelRole}"` : ""}>${escapeHtml(label)}</span>
          ${detail ? `<span class="rowDetail"${detailRole ? ` data-role="${detailRole}"` : ""}>${escapeHtml(detail)}</span>` : ""}
          ${branchError ? `<span class="rowDetail">${escapeHtml(branchError)}</span>` : ""}
        </div>
        <div class="rowMeta">
          <span class="rowStatusText">${escapeHtml(status)}</span>
        </div>
      </div>
      ${continuation ? `
        <div class="rowActions">
          <span class="rowContinuation">${escapeHtml(continuation)}</span>
          <button type="button" tabIndex="-1" class="button quiet buttonSizeXsHarness">${escapeHtml(continuationLabel)}</button>
        </div>` : ""}
    </div>`;
}

function deepTreeMarkup(kind) {
  let markup = rowMarkup({
    label: "activity-tree-sidebar session /Users/jesse/prime-radiant-toil-suite-serf/activity-tree-sidebar",
    detail: "4 active · 1 failed · 18 completed",
    status: "running",
    statusFamily: "alive",
    hasChildren: true,
    expanded: true,
  });
  markup += '<div class="group">';
  for (let depth = 1; depth <= 8; depth += 1) {
    const labelRole = depth === 8 ? `${kind}-deep-label` : "";
    markup += rowMarkup({
      label: `Delegate ${depth}: retained activity branch with an intentionally long mandate proving clipped deep labels at depth ${depth}`,
      detail: `child-session-${depth}-retained-activity-sidebar-branch-reference-that-cannot-fit-without-ellipsis`,
      status: depth < 8 ? "running" : "needs-you",
      statusFamily: depth < 8 ? "alive" : "attention",
      hasChildren: true,
      expanded: true,
      labelRole,
      continuation: depth === 6 ? "This branch is partially retained." : "",
    });
    markup += '<div class="group">';
    markup += rowMarkup({
      label: `session/${depth}/subtree/with/a/very/long/retained/path/segment/${depth}`,
      detail: `${Math.max(1, 9 - depth)} active · ${depth % 2} failed · ${depth + 3} completed`,
      status: depth < 8 ? "running" : "blocked",
      statusFamily: depth < 8 ? "alive" : "attention",
      hasChildren: true,
      expanded: true,
    });
    markup += '<div class="group">';
  }
  markup += rowMarkup({
    label: "shell command",
    detail: LONG_COMMAND,
    status: "running",
    statusFamily: "alive",
    selected: true,
    detailRole: `${kind}-deep-detail`,
  });
  markup += "</div>".repeat(17);
  return markup;
}

function frameDocument({ bodyMarkup, width }) {
  return `<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=${width}, initial-scale=1">
<base href="${location.href}">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  * { transition: none !important; animation: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--surface-0);
    color: var(--ink-hi);
    font-family: var(--font-sans);
    font-size: var(--font-size-body);
    line-height: var(--line-height-body);
  }
  /* layoutguard flattens module CSS into one resolved.css file, so several
     cross-module class names collide here. Keep the real loaded CSS files and
     alias only the collided contracts the harness must distinguish: sheet
     chassis/body/activity wrapper and CodeBlock's root/header/pre/code/copy
     layout. */
  .sheetPanelHarness {

</style>
</head>
<body data-font-size="m">
  <div class="scrim">
    <div class="sheetPanelHarness right" data-role="sheet">
      <header class="sheetHeaderHarness">
        <h2 class="sheetTitleHarness">Activity</h2>
      </header>
      <div class="sheetBodyHarness" data-role="sheet-body">
        <div class="activityPanelHarness" data-role="activity-panel">
          ${bodyMarkup}

}

function escapeHtml(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

const fixtures = [
  {
    name: "desktop-master-detail-1440",
    mode: "desktop",
    width: 1440,
    height: 900,
    label: "desktop 1440×900 — tree + inspector",
    bodyMarkup: `
      <div class="masterDetail" data-role="master-detail">
        <div class="panelColumn" data-role="tree-pane">
          <div class="tree" role="tree">${deepTreeMarkup("desktop")}</div>
        </div>
        <div class="panelColumn" data-role="inspector-pane">
          ${desktopInspectorMarkup()}
        </div>
      </div>`,
  },
  {
    name: "mobile-tree-390",
    mode: "mobile-tree",
    width: 390,
    height: 844,
    label: "mobile 390×844 — tree only",
    bodyMarkup: `
      <div class="masterDetail" data-role="master-detail">
        <div class="panelColumn" data-role="tree-pane">
          <div class="tree" role="tree">${deepTreeMarkup("mobile-tree")}</div>
        </div>
      </div>`,
  },
  {
    name: "mobile-inspector-390",
    mode: "mobile-inspector",
    width: 390,
    height: 844,
    label: "mobile 390×844 — inspector only",
    bodyMarkup: mobileInspectorMarkup(),
  },
];

const fixtureRoot = document.querySelector('[data-role="fixtures"]');
const frames = [];
for (const fixture of fixtures) {
  const section = document.createElement("section");
  section.className = "fixture";
  section.setAttribute("data-fixture", fixture.name);

  const label = document.createElement("div");
  label.className = "fixtureLabel";
  label.textContent = fixture.label;

  const frame = document.createElement("iframe");
  frame.className = "fixtureFrame";
  frame.width = String(fixture.width);
  frame.height = String(fixture.height);
  frame.style.width = `${fixture.width}px`;
  frame.style.height = `${fixture.height}px`;
  frame.srcdoc = frameDocument(fixture);

  section.append(label, frame);
  fixtureRoot.append(section);
  frames.push({ fixture, frame });
}

function waitForFrameReady(frame, fixture) {
  return new Promise((resolve, reject) => {
    const start = performance.now();
    const deadlineMs = 1500;
    const finish = () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!win || !doc) {
        reject(new Error("fixture frame missing contentWindow"));
        return;
      }
      const checkReady = () => {
        const primaryLayout = doc.querySelector('[data-role="master-detail"], [data-role="mobile-pane"]');
        const treePane = doc.querySelector('[data-role="tree-pane"]');
        const inspectorPane = doc.querySelector('[data-role="inspector-pane"]');
        const display = primaryLayout ? win.getComputedStyle(primaryLayout).display : null;
        const primaryWidth = primaryLayout?.getBoundingClientRect().width ?? 0;
        const treeWidth = treePane?.clientWidth ?? 0;
        const inspectorWidth = inspectorPane?.clientWidth ?? 0;
        const ready =
          fixture.mode === "desktop"
            ? display === "grid" && primaryWidth > 0 && treeWidth > 0 && inspectorWidth > 0
            : fixture.mode === "mobile-tree"
              ? display === "flex" && primaryWidth > 0 && treeWidth > 0
              : primaryWidth > 0 && inspectorWidth > 0;
        if (ready || performance.now() - start > deadlineMs) {
          resolve();
          return;
        }
        win.requestAnimationFrame(checkReady);
      };
      win.requestAnimationFrame(() => win.requestAnimationFrame(checkReady));
    };
    if (frame.contentDocument?.readyState === "complete") {
      finish();
      return;
    }
    frame.addEventListener("load", finish, { once: true });
  });
}

function rect(el) {
  const r = el.getBoundingClientRect();
  return { left: r.left, right: r.right, top: r.top, bottom: r.bottom, width: r.width, height: r.height };
}

function metrics(doc, el) {
  if (!el) return null;
  const style = doc.defaultView.getComputedStyle(el);
  return {
    ...rect(el),
    clientWidth: el.clientWidth,
    clientHeight: el.clientHeight,
    scrollWidth: el.scrollWidth,
    scrollHeight: el.scrollHeight,
    overflowX: style.overflowX,
    overflowY: style.overflowY,
    display: style.display,
    whiteSpace: style.whiteSpace,
    textOverflow: style.textOverflow,
  };
}

function isVisible(doc, el) {
  const style = doc.defaultView.getComputedStyle(el);
  const r = el.getBoundingClientRect();
  return style.display !== "none" && r.width > 1 && r.height > 1;
}

function elementHint(el) {
  if (!el) return null;
  const parts = [el.tagName.toLowerCase()];
  const role = el.getAttribute("data-role");
  if (role) parts.push(`[data-role="${role}"]`);
  const className = typeof el.className === "string" ? el.className.trim().replace(/\s+/g, ".") : "";
  if (className) parts.push(`.${className}`);
  return parts.join("");
}

function widestDescendant(doc, container) {
  if (!container) return null;
  const containerRect = container.getBoundingClientRect();
  let best = null;
  for (const el of [container, ...container.querySelectorAll('*')]) {
    const m = metrics(doc, el);
    const overflowRight = m.right - containerRect.left;
    const score = Math.max(overflowRight, m.scrollWidth, m.clientWidth);
    if (!best || score > best.score) {
      best = {
        score,
        hint: elementHint(el),
        clientWidth: m.clientWidth,
        scrollWidth: m.scrollWidth,
        width: m.width,
        rightFromContainerLeft: overflowRight,
      };
    }
  }
  return best;
}

function measureFrame({ fixture, frame }) {
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  if (!win || !doc) throw new Error(`fixture ${fixture.name} missing frame document`);

  const sheet = doc.querySelector('[data-role="sheet"]');
  const sheetBody = doc.querySelector('[data-role="sheet-body"]');
  const activityPanel = doc.querySelector('[data-role="activity-panel"]');
  const masterDetail = doc.querySelector('[data-role="master-detail"]');
  const mobilePane = doc.querySelector('[data-role="mobile-pane"]');
  const treePane = doc.querySelector('[data-role="tree-pane"]');
  const inspectorPane = doc.querySelector('[data-role="inspector-pane"]');
  const outputCodeBlock = doc.querySelector('[data-role="output-codeblock"]');
  const outputCodePre = doc.querySelector('[data-role="output-code-pre"]');
  const deepLabel = doc.querySelector('[data-role$="deep-label"]');
  const deepDetail = doc.querySelector('[data-role$="deep-detail"]');
  const backControl = doc.querySelector('[data-role="back-control"]');
  const visiblePanes = [...doc.querySelectorAll('[data-role="tree-pane"], [data-role="inspector-pane"]')].filter((pane) => isVisible(doc, pane));
  const primaryLayout = masterDetail || mobilePane;

  return {
    fixture: fixture.name,
    mode: fixture.mode,
    viewport: { width: win.innerWidth, height: win.innerHeight },
    structure: {
      sheetPresent: Boolean(sheet),
      sheetBodyPresent: Boolean(sheetBody),
      activityPanelPresent: Boolean(activityPanel),
      primaryLayoutPresent: Boolean(primaryLayout),
      sheetContainsBody: Boolean(sheet && sheetBody && sheet.contains(sheetBody)),
      bodyContainsActivity: Boolean(sheetBody && activityPanel && sheetBody.contains(activityPanel)),
      activityContainsPrimaryLayout: Boolean(activityPanel && primaryLayout && activityPanel.contains(primaryLayout)),
      outputCodeBlockPresent: Boolean(outputCodeBlock),
      outputCodePrePresent: Boolean(outputCodePre),
    },
    visiblePaneCount: visiblePanes.length,
    visiblePaneRoles: visiblePanes.map((pane) => pane.getAttribute("data-role")),
    sheet: metrics(doc, sheet),
    sheetBody: metrics(doc, sheetBody),
    activityPanel: metrics(doc, activityPanel),
    primaryLayout: metrics(doc, primaryLayout),
    treePane: metrics(doc, treePane),
    inspectorPane: metrics(doc, inspectorPane),
    sizing: {
      sheetPanelWidth: sheet ? rect(sheet).width : null,
      sheetBodyWidth: sheetBody ? rect(sheetBody).width : null,
      activityPanelWidth: activityPanel ? rect(activityPanel).width : null,
      primaryLayoutWidth: primaryLayout ? rect(primaryLayout).width : null,
      treePaneWidth: treePane ? rect(treePane).width : null,
      inspectorPaneWidth: inspectorPane ? rect(inspectorPane).width : null,
      masterDetailDisplay: primaryLayout ? win.getComputedStyle(primaryLayout).display : null,
      masterDetailGridColumns: primaryLayout ? win.getComputedStyle(primaryLayout).gridTemplateColumns : null,
      treePaneMinWidth: treePane ? win.getComputedStyle(treePane).minWidth : null,
      treePaneFlexBasis: treePane ? win.getComputedStyle(treePane).flexBasis : null,
      firstGroupPaddingLeft: doc.querySelector('.group') ? win.getComputedStyle(doc.querySelector('.group')).paddingLeft : null,
      rowActionsFlexWrap: doc.querySelector('.rowActions') ? win.getComputedStyle(doc.querySelector('.rowActions')).flexWrap : null,
      treeWidestDescendant: widestDescendant(doc, treePane),
    },
    outputCodeBlock: metrics(doc, outputCodeBlock),
    outputCodePre: metrics(doc, outputCodePre),
    deepLabel: metrics(doc, deepLabel),
    deepDetail: metrics(doc, deepDetail),
    mobileBack: metrics(doc, backControl),
  };
}

window.measure = async function () {
  await Promise.all(frames.map(({ frame, fixture }) => waitForFrameReady(frame, fixture)));
  return frames.map((frameInfo) => measureFrame(frameInfo));
};
</script>
