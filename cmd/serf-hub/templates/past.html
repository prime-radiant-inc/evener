{{define "body"}}
<section class="panel">
  <h2>past sessions</h2>
  <form method="get" action="/past" style="margin-bottom:12px">
    <input type="text" name="q" value="{{.Q}}" placeholder="search by task, id, working dir" style="width:60%">
    <input type="submit" value="search">
  </form>
  {{if .Past}}
    {{range .Past}}
    <a class="row" href="/past/{{.Meta.ID}}">
      <span>
        <span class="wd">{{.Meta.EnvInfo.WorkingDir}}</span>
        {{if .Meta.OriginalTask}}<div class="meta">{{.Meta.OriginalTask}}</div>{{end}}
      </span>
      <span class="meta">{{.Meta.Model}} · {{.Meta.UpdatedAt.Format "2006-01-02 15:04"}}</span>
    </a>
    {{end}}
  {{else}}
    <div class="empty">no matches</div>
  {{end}}
</section>
{{end}}
