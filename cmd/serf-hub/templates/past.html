{{define "body"}}
<section class="panel">
  <h2>past sessions</h2>
  <form style="margin-bottom:12px"
        hx-get="/past/results"
        hx-target="#past-results"
        hx-trigger="input changed delay:200ms from:input[name=q], submit"
        hx-push-url="true">
    <input type="text" name="q" value="{{.Q}}" placeholder="search by task, id, working dir" style="width:60%">
    <input type="submit" value="search">
  </form>
  <div id="past-results">
    {{template "past_results" .}}
  </div>
</section>
{{end}}
