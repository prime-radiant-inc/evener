{{define "body"}}
{{if .ForkedFrom}}
<div class="hint" style="padding:6px var(--pad); margin-bottom:8px">
  forked from <a href="/past/{{.ForkedFrom}}" style="color:var(--accent)">{{.ForkedFrom}}</a>
</div>
{{end}}
<div id="status-bar"
     hx-get="/live/{{.SessionID}}/status-bar"
     hx-trigger="load, every 2s"
     hx-swap="innerHTML">
  loading status…
</div>

<div id="transcript" data-session-id="{{.SessionID}}">
  <div class="empty">awaiting events…</div>
</div>

<div id="input-area">
  <textarea id="input-text" placeholder="message the agent…" autofocus></textarea>
  <div id="input-buttons">
    <button id="btn-send">send</button>
    <button id="btn-steer">steer</button>
    <button id="btn-interrupt">interrupt</button>
    <button id="btn-compact">compact</button>
    <button id="btn-clear">clear</button>
    <button id="btn-shutdown" class="danger">shutdown</button>
  </div>
  <div class="hint">⌘↵ to send</div>
</div>

<script src="/assets/marked.min.js"></script>
<script src="/assets/renderer.js"></script>
<script src="/assets/init-live.js"></script>
{{end}}
