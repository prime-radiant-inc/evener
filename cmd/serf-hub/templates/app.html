{{define "app"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>serf hub</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%237aa2f7'/></svg>">
  <script>
    (function () {
      var pref = localStorage.getItem("serf-hub.theme");
      if (pref === "light" || pref === "dark") {
        document.documentElement.setAttribute("data-theme", pref);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="app">
  <aside id="sidebar"
         hx-get="/_partials/sidebar"
         hx-trigger="load, every 5s, sidebar:refresh from:body"
         hx-swap="innerHTML">
    <div class="sidebar-loading">loading…</div>
  </aside>
  <main id="workspace"
        hx-get="{{.WorkspaceURL}}"
        hx-trigger="load"
        hx-swap="innerHTML">
  </main>
  <dialog id="search-dialog" class="search-dialog" aria-label="search and commands">
    <div class="search-dialog-inner">
      <header class="search-dialog-header">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search-input" type="text" autocomplete="off" placeholder="search live + past sessions"
               role="combobox" aria-expanded="true" aria-controls="search-results"
               aria-autocomplete="list" aria-label="search sessions or run a command">
        <span class="search-dialog-hint" aria-hidden="true">esc</span>
      </header>
      <div id="search-results" class="search-results" role="listbox" aria-label="results"></div>
      <footer class="search-dialog-footer" aria-hidden="true">
        <span>↑↓ nav</span>
        <span>↵ open</span>
        <span>⌘↵ new tab</span>
        <span>⇧↵ jump</span>
        <span>esc close</span>
      </footer>
    </div>
  </dialog>
  <div id="toast-region" aria-live="polite" aria-relevant="additions"></div>
  <script src="/assets/htmx.min.js"></script>
  <script src="/assets/toast.js"></script>
  <script src="/assets/appwire.js"></script>
  <script src="/assets/launchconfig.js"></script>
  <script src="/assets/focus-trap.js"></script>
  <script src="/assets/sidebar.js"></script>
  <script src="/assets/notifications.js"></script>
  <script src="/assets/theme.js"></script>
  <script src="/assets/search.js"></script>
  <script src="/assets/settings.js"></script>
  <script src="/assets/composer-attachments.js"></script>
  <script src="/assets/spawn.js"></script>
  <script src="/assets/settings-pickers.js"></script>
  <script src="/assets/marked.min.js"></script>
  <script src="/assets/diagnostics.js"></script>
  <script src="/assets/pending.js"></script>
  <script src="/assets/renderer.js"></script>
  <script>
    // Global htmx error → toast. Renderer-specific error handling continues
    // to win because htmx:responseError bubbles and we never preventDefault.
    document.body.addEventListener("htmx:responseError", function (e) {
      if (!window.SerfToast) return;
      var status = (e && e.detail && e.detail.xhr && e.detail.xhr.status) || 0;
      var msg = status ? ("Request failed (" + status + ")") : "Request failed";
      window.SerfToast.show(msg, "error");
    });
    document.body.addEventListener("htmx:sendError", function () {
      if (window.SerfToast) window.SerfToast.show("Network error", "error");
    });
  </script>
</body>
</html>
{{end}}
