{{define "app"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>serf hub</title>
  <!-- Run full-screen with no browser chrome when launched from the home screen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="serf">
  <meta name="theme-color" content="#0a0a0e">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="/assets/icon-192.png{{assetv}}">
  <link rel="icon" type="image/png" href="/assets/icon-192.png{{assetv}}">
  <script>
    (function () {
      var pref = localStorage.getItem("serf-hub.theme");
      if (pref === "light" || pref === "dark") {
        document.documentElement.setAttribute("data-theme", pref);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css{{assetv}}">
</head>
<body class="app">
  <!-- Persistent mobile nav: lives in the app shell (not a per-page header) so
       every page swapped into #workspace — session, new, settings, welcome —
       can always reach the off-canvas sidebar. Hidden on desktop where the
       sidebar is always visible. -->
  <button type="button" class="app-nav-toggle" data-sidebar-toggle title="open sidebar" aria-label="open sidebar">☰</button>
  <aside id="sidebar" aria-label="Sessions"></aside>
  <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-controls="sidebar" aria-label="resize sidebar"></div>
  <main id="workspace"
        hx-get="{{.WorkspaceURL}}"
        hx-trigger="load"
        hx-swap="innerHTML">
  </main>
  <div id="pane-splitter" class="pane-splitter" role="separator" aria-orientation="vertical" hidden></div>
  <aside id="side-panes" class="side-panes" aria-label="Side panes" hidden></aside>
  <dialog id="search-dialog" class="search-dialog" aria-label="search and commands">
    <div class="search-dialog-inner">
      <header class="search-dialog-header">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search-input" type="text" autocomplete="off" placeholder="search live + past sessions"
               role="combobox" aria-expanded="true" aria-controls="search-results"
               aria-autocomplete="list" aria-label="search sessions or run a command">
        <span class="search-dialog-hint" aria-hidden="true">esc</span>
      </header>
      <div id="search-results" class="search-results" role="listbox" aria-label="results"></div>
      <footer class="search-dialog-footer" aria-hidden="true">
        <span>↑↓ nav</span>
        <span>↵ open</span>
        <span>⌘↵ new tab</span>
        <span>⇧↵ jump</span>
        <span>esc close</span>
      </footer>
    </div>
  </dialog>
  <div id="toast-region" aria-live="polite" aria-relevant="additions"></div>
  <script src="/assets/htmx.min.js{{assetv}}"></script>
  <script src="/assets/toast.js{{assetv}}"></script>
  <script src="/assets/skeleton.js{{assetv}}"></script>
  <script src="/assets/appwire.js{{assetv}}"></script>
  <script src="/assets/launchconfig.js{{assetv}}"></script>
  <script src="/assets/focus-trap.js{{assetv}}"></script>
  <script src="/assets/sidebar.js{{assetv}}"></script>
  <script src="/assets/panes.js{{assetv}}" defer></script>
  <script src="/assets/notifications.js{{assetv}}"></script>
  <script src="/assets/theme.js{{assetv}}"></script>
  <script src="/assets/search.js{{assetv}}"></script>
  <script src="/assets/settings.js{{assetv}}"></script>
  <script src="/assets/composer-attachments.js{{assetv}}"></script>
  <script src="/assets/dir-picker.js{{assetv}}"></script>
  <script src="/assets/spawn.js{{assetv}}"></script>
  <script src="/assets/settings-pickers.js{{assetv}}"></script>
  <script src="/assets/marked.min.js{{assetv}}"></script>
  <script src="/assets/diagnostics.js{{assetv}}"></script>
  <script src="/assets/pending.js{{assetv}}"></script>
  <script src="/assets/renderer-format.js{{assetv}}"></script>
  <script src="/assets/renderer-tools.js{{assetv}}"></script>
  <script src="/assets/renderer-panels.js{{assetv}}"></script>
  <script src="/assets/renderer.js{{assetv}}"></script>
  <script>
    // Global htmx error → toast. Renderer-specific error handling continues
    // to win because htmx:responseError bubbles and we never preventDefault.
    document.body.addEventListener("htmx:responseError", function (e) {
      if (!window.SerfToast) return;
      var status = (e && e.detail && e.detail.xhr && e.detail.xhr.status) || 0;
      var msg = status ? ("Request failed (" + status + ")") : "Request failed";
      window.SerfToast.show(msg, "error");
    });
    document.body.addEventListener("htmx:sendError", function () {
      if (window.SerfToast) window.SerfToast.show("Network error", "error");
    });
  </script>
</body>
</html>
{{end}}
