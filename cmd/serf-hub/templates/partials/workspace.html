{{define "workspace"}}
<header class="workspace-header" data-session-id="{{.ID}}">
  <div class="workspace-title-row">
    <div class="workspace-title">
      <span class="title">{{.Title}}</span>
      <button class="title-action" type="button" data-copy-id="{{.ID}}" title="copy session ID">⧉</button>
    </div>
    <div class="workspace-actions">
      <button type="button" class="panel-toggle" data-tasks-trigger title="task list">
        <span class="panel-toggle-icon">☑</span><span class="panel-toggle-label">tasks</span>
      </button>
      <button type="button" class="panel-toggle" data-details-trigger title="session details">
        <span class="panel-toggle-icon">ⓘ</span><span class="panel-toggle-label">details</span>
      </button>
    </div>
  </div>
  <div class="workspace-meta"
       hx-get="/s/{{.ID}}/meta"
       hx-trigger="load, every 2s"
       hx-swap="innerHTML">
    {{template "workspace_meta" .}}
  </div>
</header>

<div class="conversation"
     id="conversation"
     data-session-id="{{.ID}}"
     data-replay-url="{{.ReplayURL}}"
     data-events-url="{{.EventsURL}}"
     data-state="{{.State}}">
  <div class="conversation-empty" data-empty-placeholder>no messages yet — type below to start the conversation</div>
</div>

<form class="workspace-input" data-input-form data-session-id="{{.ID}}">
  <textarea class="message-input" placeholder="message the agent…" autofocus></textarea>
  <div id="input-strip"
       class="input-strip"
       hx-get="/s/{{.ID}}/state"
       hx-trigger="load, every 2s"
       hx-swap="innerHTML">
    <span class="model">{{.Model}}</span>
  </div>
</form>
{{end}}

{{define "workspace_meta"}}{{if .Branch}}<span class="branch">{{.Branch}}</span><span class="rule-dot">·</span>{{end}}<span class="status-pill" data-state="{{.State}}"><span class="status-dot" data-state="{{.State}}"></span> {{.StateLabel}}</span><span class="rule-dot">·</span><span class="turn-count">{{.TurnCount}} turn{{if ne .TurnCount 1}}s{{end}}</span>{{end}}
