{{define "settings-content"}}
<h2 class="settings-h2">Providers</h2>
{{if .Providers}}
<div class="settings-rows">
  {{range .Providers}}
  <div class="settings-row">
    <div class="settings-row-title">{{.Name}}</div>
    <div class="settings-row-meta">{{len .Models}} model{{if ne (len .Models) 1}}s{{end}}</div>
    <div class="settings-row-detail">{{range .Models}}<span class="model-chip">{{.}}</span>{{end}}</div>
  </div>
  {{end}}
</div>
{{else}}
<p class="settings-help">No providers configured. Add <code>[[providers]]</code> blocks to <code>~/.serf/hub.toml</code>.</p>
{{end}}
{{end}}
