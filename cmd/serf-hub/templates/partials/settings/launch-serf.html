{{define "settings-content"}}
<h2 class="settings-h2">Serf launch defaults</h2>
<p class="settings-help">
  These values are applied to every serf spawn unless overridden by a project
  layer or per-launch.
</p>
<form id="launch-form" class="settings-launch-form" data-loaded="false">
  <label>Model
    <div class="sp-model-wrap">
      <input type="hidden" name="model" id="lf-model-hidden">
      <button class="sp-model-btn" type="button" data-settings-model-picker>
        <span class="sp-model-display" id="lf-model-display">(none set)</span>
        <span class="sp-model-caret">▾</span>
      </button>
      <button class="sp-clear-btn" type="button" id="lf-model-clear" title="clear">✕</button>
    </div>
  </label>
  <label>Agent
    <input type="text" name="agent" placeholder="default">
  </label>
  <label>Reasoning effort
    <select name="reasoningEffort">
      <option value="">(default)</option>
      <option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>none</option>
    </select>
  </label>
  <label>Context strategy
    <select name="contextStrategy">
      <option value="">(default)</option>
      <option>compact</option><option>recall</option><option>session-log</option><option>ooda</option>
    </select>
  </label>
  <label>Max rounds
    <input type="number" name="maxRounds" min="0" step="1">
  </label>
  <label>Max subagent depth
    <input type="number" name="maxSubagentDepth" min="0" step="1">
  </label>
  <label class="checkbox-label">
    <input type="checkbox" name="noProjectPrompts"> Suppress .serf/prompts loading
  </label>
  <div class="form-actions">
    <button type="submit">Save launch defaults</button>
    <p id="launch-form-status" class="settings-help" style="margin:0"></p>
  </div>
</form>
<script>
  (async function () {
    const form = document.getElementById("launch-form");
    const status = document.getElementById("launch-form-status");
    const modelHidden = document.getElementById("lf-model-hidden");
    const modelDisplay = document.getElementById("lf-model-display");
    const modelClear = document.getElementById("lf-model-clear");

    function setModel(v) {
      modelHidden.value = v || "";
      modelDisplay.textContent = v || "(none set)";
    }

    modelClear.addEventListener("click", () => setModel(""));

    // Re-init picker after DOM is ready (settings-pickers.js may have run before this block)
    if (window.SettingsPickers) window.SettingsPickers.init(form);

    try {
      const current = await launchconfig.getLayer("/", "global");
      setModel(current.model || "");
      form.agent.value = current.agent || "";
      form.reasoningEffort.value = current.reasoningEffort || "";
      form.contextStrategy.value = current.contextStrategy || "";
      form.maxRounds.value = current.maxRounds ?? "";
      form.maxSubagentDepth.value = current.maxSubagentDepth ?? "";
      form.noProjectPrompts.checked = !!current.noProjectPrompts;
      form.dataset.loaded = "true";
      let statusClearTimer = 0;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const out = { ...current,
          model: modelHidden.value.trim() || undefined,
          agent: form.agent.value.trim() || undefined,
          reasoningEffort: form.reasoningEffort.value || undefined,
          contextStrategy: form.contextStrategy.value || undefined,
          maxRounds: form.maxRounds.value === "" ? undefined : +form.maxRounds.value,
          maxSubagentDepth: form.maxSubagentDepth.value === "" ? undefined : +form.maxSubagentDepth.value,
          noProjectPrompts: form.noProjectPrompts.checked || undefined,
        };
        try {
          await launchconfig.setLayer("/", "global", out);
          if (statusClearTimer) clearTimeout(statusClearTimer);
          const savedMessage = "Saved at " + new Date().toLocaleTimeString();
          status.textContent = savedMessage;
          statusClearTimer = setTimeout(() => {
            if (status.textContent === savedMessage) status.textContent = "";
            statusClearTimer = 0;
          }, 5000);
        } catch (err) {
          if (statusClearTimer) {
            clearTimeout(statusClearTimer);
            statusClearTimer = 0;
          }
          status.textContent = "Error: " + err.message;
        }
      });
    } catch (err) {
      status.textContent = "Failed to load: " + (err && err.message ? err.message : err);
    }
  })();
</script>
{{end}}
