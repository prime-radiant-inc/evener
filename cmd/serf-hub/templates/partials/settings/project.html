{{define "settings-content"}}
<h2 class="settings-h2">Project settings</h2>
{{if .ProjectCWD}}
<p class="settings-help"><code>{{.ProjectCWD}}</code></p>
<div id="project-settings-root" data-cwd="{{.ProjectCWD}}" data-loaded="false">
  <p>Loading…</p>
</div>
<script>
  (async function () {
    const root = document.getElementById("project-settings-root");
    const cwd = root.dataset.cwd;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    }

    let current = {};
    try {
      current = await launchconfig.getLayer(cwd, "project");
    } catch (err) {
      root.innerHTML = `<p class="settings-error">Failed to load: ${err && err.message ? err.message : err}</p>`;
      return;
    }

    function getField(name) { return root.querySelector(`[name="${name}"]`); }
    function statusEl() { return root.querySelector("#proj-status"); }

    function render() {
      const launch = current;
      const pluginDirs = launch.pluginDirs || [];
      const skillsDirs = launch.skillsDirs || [];
      const mcps = launch.mcps || [];
      const mcpConfigPaths = launch.mcpConfigPaths || [];
      const systemPromptAppendPaths = launch.systemPromptAppendPaths || [];
      const env = launch.env || {};
      const modelVal = escapeHtml(launch.model || "");

      root.innerHTML = `
        <h3 class="settings-h3">Launch defaults</h3>
        <form id="proj-launch-form" class="settings-launch-form">
          <label>Model
            <div class="sp-model-wrap">
              <input type="hidden" name="model" id="proj-model-hidden" value="${modelVal}">
              <button class="sp-model-btn" type="button" data-settings-model-picker>
                <span class="sp-model-display" id="proj-model-display">${modelVal || "(inherit global)"}</span>
                <span class="sp-model-caret">▾</span>
              </button>
              <button class="sp-clear-btn" type="button" id="proj-model-clear" title="clear">✕</button>
            </div>
          </label>
          <label>Agent
            <input type="text" name="agent" value="${escapeHtml(launch.agent || "")}" placeholder="(inherit global)">
          </label>
          <label>Reasoning effort
            <select name="reasoningEffort">
              <option value="">(use global default)</option>
              <option ${launch.reasoningEffort === "low" ? "selected" : ""}>low</option>
              <option ${launch.reasoningEffort === "medium" ? "selected" : ""}>medium</option>
              <option ${launch.reasoningEffort === "high" ? "selected" : ""}>high</option>
              <option ${launch.reasoningEffort === "xhigh" ? "selected" : ""}>xhigh</option>
              <option ${launch.reasoningEffort === "none" ? "selected" : ""}>none</option>
            </select>
          </label>
          <label>Context strategy
            <select name="contextStrategy">
              <option value="">(use global default)</option>
              <option ${launch.contextStrategy === "compact" ? "selected" : ""}>compact</option>
              <option ${launch.contextStrategy === "recall" ? "selected" : ""}>recall</option>
              <option ${launch.contextStrategy === "session-log" ? "selected" : ""}>session-log</option>
              <option ${launch.contextStrategy === "ooda" ? "selected" : ""}>ooda</option>
            </select>
          </label>
          <label>Max rounds
            <input type="number" name="maxRounds" min="0" step="1" value="${launch.maxRounds ?? ""}">
          </label>
          <label>Max subagent depth
            <input type="number" name="maxSubagentDepth" min="0" step="1" value="${launch.maxSubagentDepth ?? ""}">
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="noProjectPrompts" ${launch.noProjectPrompts ? "checked" : ""}> Suppress .serf/prompts loading
          </label>
          <div class="form-actions">
            <button type="submit">Save launch defaults</button>
            <p id="proj-status" class="settings-help" style="margin:0"></p>
          </div>
        </form>

        <h3 class="settings-h3">Plugin directories</h3>
        <ul class="settings-items-list" id="proj-plugin-dirs">
          ${pluginDirs.map((d, i) => `
            <li><code>${escapeHtml(d)}</code> <button data-i="${i}" data-action="rm-plugin" class="danger">remove</button></li>
          `).join("")}
        </ul>
        <form id="proj-plugins-add" class="settings-add-row">
          <div class="sp-dir-wrap" style="flex:1;min-width:200px;">
            <input type="text" name="dir" placeholder="/absolute/path" required style="flex:1;min-width:0;">
            <button type="button" class="sp-dir-btn" data-settings-dir-picker>
              <span class="sp-dir-caret">📁</span>
            </button>
          </div>
          <button type="submit">Add plugin dir</button>
        </form>

        <h3 class="settings-h3">Skill directories</h3>
        <ul class="settings-items-list" id="proj-skill-dirs">
          ${skillsDirs.map((d, i) => `
            <li><code>${escapeHtml(d)}</code> <button data-i="${i}" data-action="rm-skill" class="danger">remove</button></li>
          `).join("")}
        </ul>
        <form id="proj-skills-add" class="settings-add-row">
          <div class="sp-dir-wrap" style="flex:1;min-width:200px;">
            <input type="text" name="dir" placeholder="/absolute/path" required style="flex:1;min-width:0;">
            <button type="button" class="sp-dir-btn" data-settings-dir-picker>
              <span class="sp-dir-caret">📁</span>
            </button>
          </div>
          <button type="submit">Add skill dir</button>
        </form>

        <h3 class="settings-h3">MCP servers</h3>
        <ul class="settings-items-list" id="proj-mcps">
          ${mcps.map((m, i) => `
            <li>
              <code>${escapeHtml(m.name)}</code>
              <code>${escapeHtml(m.command)} ${(m.args || []).map(escapeHtml).join(" ")}</code>
              <button data-i="${i}" data-action="rm-mcp" class="danger">remove</button>
            </li>
          `).join("")}
        </ul>
        <form id="proj-mcps-add" class="settings-add-row" style="flex-wrap:wrap;">
          <input type="text" name="name" placeholder="name" required style="width:120px;">
          <input type="text" name="command" placeholder="command" required style="flex:1;min-width:120px;">
          <input type="text" name="args" placeholder="args (space-separated)" style="flex:1;min-width:120px;">
          <button type="submit">Add MCP server</button>
        </form>

        <h3 class="settings-h3">MCP config paths</h3>
        <ul class="settings-items-list" id="proj-mcp-paths">
          ${mcpConfigPaths.map((p, i) => `
            <li><code>${escapeHtml(p)}</code> <button data-i="${i}" data-action="rm-mcp-path" class="danger">remove</button></li>
          `).join("")}
        </ul>
        <form id="proj-mcp-paths-add" class="settings-add-row">
          <div class="sp-dir-wrap" style="flex:1;min-width:200px;">
            <input type="text" name="path" placeholder="/path/to/mcp.json" required style="flex:1;min-width:0;">
            <button type="button" class="sp-dir-btn" data-settings-dir-picker>
              <span class="sp-dir-caret">📁</span>
            </button>
          </div>
          <button type="submit">Add MCP config path</button>
        </form>

        <h3 class="settings-h3">System prompt append paths</h3>
        <ul class="settings-items-list" id="proj-prompt-paths">
          ${systemPromptAppendPaths.map((p, i) => `
            <li><code>${escapeHtml(p)}</code> <button data-i="${i}" data-action="rm-prompt-path" class="danger">remove</button></li>
          `).join("")}
        </ul>
        <form id="proj-prompt-paths-add" class="settings-add-row">
          <div class="sp-dir-wrap" style="flex:1;min-width:200px;">
            <input type="text" name="path" placeholder="/path/to/prompt.txt" required style="flex:1;min-width:0;">
            <button type="button" class="sp-dir-btn" data-settings-dir-picker>
              <span class="sp-dir-caret">📁</span>
            </button>
          </div>
          <button type="submit">Add prompt path</button>
        </form>

        <h3 class="settings-h3">Environment variables</h3>
        <ul class="settings-items-list" id="proj-env">
          ${Object.entries(env).map(([k, v], i) => `
            <li><code>${escapeHtml(k)}</code><span style="color:var(--text-muted);padding:0 4px;">=</span><code>${escapeHtml(v)}</code> <button data-k="${escapeHtml(k)}" data-action="rm-env" class="danger">remove</button></li>
          `).join("")}
        </ul>
        <form id="proj-env-add" class="settings-add-row">
          <input type="text" name="key" placeholder="KEY" required style="width:140px;">
          <input type="text" name="value" placeholder="value" style="flex:1;min-width:120px;">
          <button type="submit">Add env var</button>
        </form>
      `;

      // Wire up model picker clear button
      const modelHidden = root.querySelector("#proj-model-hidden");
      const modelDisplay = root.querySelector("#proj-model-display");
      root.querySelector("#proj-model-clear").addEventListener("click", () => {
        modelHidden.value = "";
        modelDisplay.textContent = "(inherit global)";
      });

      // Init settings pickers (model + dir) for this render
      if (window.SettingsPickers) window.SettingsPickers.init(root);

      // Launch form save
      root.querySelector("#proj-launch-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        const out = { ...current,
          model: modelHidden.value.trim() || undefined,
          agent: form.agent.value.trim() || undefined,
          reasoningEffort: form.reasoningEffort.value || undefined,
          contextStrategy: form.contextStrategy.value || undefined,
          maxRounds: form.maxRounds.value === "" ? undefined : +form.maxRounds.value,
          maxSubagentDepth: form.maxSubagentDepth.value === "" ? undefined : +form.maxSubagentDepth.value,
          noProjectPrompts: form.noProjectPrompts.checked || undefined,
        };
        try {
          current = await launchconfig.setLayer(cwd, "project", out);
          statusEl().textContent = "Saved at " + new Date().toLocaleTimeString();
        } catch (err) {
          statusEl().textContent = "Error: " + (err && err.message ? err.message : err);
        }
      });

      // Plugin dirs
      root.querySelectorAll("button[data-action=rm-plugin]").forEach(b => {
        b.addEventListener("click", async () => {
          const dirs = (current.pluginDirs || []);
          dirs.splice(+b.dataset.i, 1);
          current = await launchconfig.setLayer(cwd, "project", { ...current, pluginDirs: dirs });
          render();
        });
      });
      root.querySelector("#proj-plugins-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const v = e.target.dir.value.trim();
        if (!v) return;
        const dirs = (current.pluginDirs || []);
        dirs.push(v);
        current = await launchconfig.setLayer(cwd, "project", { ...current, pluginDirs: dirs });
        e.target.dir.value = "";
        render();
      });

      // Skill dirs
      root.querySelectorAll("button[data-action=rm-skill]").forEach(b => {
        b.addEventListener("click", async () => {
          const dirs = (current.skillsDirs || []);
          dirs.splice(+b.dataset.i, 1);
          current = await launchconfig.setLayer(cwd, "project", { ...current, skillsDirs: dirs });
          render();
        });
      });
      root.querySelector("#proj-skills-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const v = e.target.dir.value.trim();
        if (!v) return;
        const dirs = (current.skillsDirs || []);
        dirs.push(v);
        current = await launchconfig.setLayer(cwd, "project", { ...current, skillsDirs: dirs });
        e.target.dir.value = "";
        render();
      });

      // MCP servers
      root.querySelectorAll("button[data-action=rm-mcp]").forEach(b => {
        b.addEventListener("click", async () => {
          const mcps = (current.mcps || []);
          mcps.splice(+b.dataset.i, 1);
          current = await launchconfig.setLayer(cwd, "project", { ...current, mcps });
          render();
        });
      });
      root.querySelector("#proj-mcps-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = e.target.name.value.trim();
        const command = e.target.command.value.trim();
        const args = e.target.args.value.trim().split(/\s+/).filter(Boolean);
        const mcps = (current.mcps || []);
        mcps.push({ name, command, args });
        current = await launchconfig.setLayer(cwd, "project", { ...current, mcps });
        e.target.reset();
        render();
      });

      // MCP config paths
      root.querySelectorAll("button[data-action=rm-mcp-path]").forEach(b => {
        b.addEventListener("click", async () => {
          const paths = (current.mcpConfigPaths || []);
          paths.splice(+b.dataset.i, 1);
          current = await launchconfig.setLayer(cwd, "project", { ...current, mcpConfigPaths: paths });
          render();
        });
      });
      root.querySelector("#proj-mcp-paths-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const v = e.target.path.value.trim();
        if (!v) return;
        const paths = (current.mcpConfigPaths || []);
        paths.push(v);
        current = await launchconfig.setLayer(cwd, "project", { ...current, mcpConfigPaths: paths });
        e.target.path.value = "";
        render();
      });

      // System prompt append paths
      root.querySelectorAll("button[data-action=rm-prompt-path]").forEach(b => {
        b.addEventListener("click", async () => {
          const paths = (current.systemPromptAppendPaths || []);
          paths.splice(+b.dataset.i, 1);
          current = await launchconfig.setLayer(cwd, "project", { ...current, systemPromptAppendPaths: paths });
          render();
        });
      });
      root.querySelector("#proj-prompt-paths-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const v = e.target.path.value.trim();
        if (!v) return;
        const paths = (current.systemPromptAppendPaths || []);
        paths.push(v);
        current = await launchconfig.setLayer(cwd, "project", { ...current, systemPromptAppendPaths: paths });
        e.target.path.value = "";
        render();
      });

      // Env vars
      root.querySelectorAll("button[data-action=rm-env]").forEach(b => {
        b.addEventListener("click", async () => {
          const env = { ...(current.env || {}) };
          delete env[b.dataset.k];
          current = await launchconfig.setLayer(cwd, "project", { ...current, env });
          render();
        });
      });
      root.querySelector("#proj-env-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const k = e.target.key.value.trim();
        const v = e.target.value.value;
        if (!k) return;
        const env = { ...(current.env || {}), [k]: v };
        current = await launchconfig.setLayer(cwd, "project", { ...current, env });
        e.target.reset();
        render();
      });

      root.dataset.loaded = "true";
    }

    render();
  })();
</script>
{{else}}
<p class="settings-help">No project selected. Open this page via the ⚙ icon next to a project in the sidebar.</p>
{{end}}
{{end}}
