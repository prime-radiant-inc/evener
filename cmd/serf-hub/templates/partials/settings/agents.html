{{define "settings-content"}}
<h2 class="settings-h2">Agents</h2>
<div class="settings-rows">
  {{range .Agents}}
  <div class="settings-row">
    <div class="settings-row-title">{{.Name}}</div>
    <div class="settings-row-detail">
      {{if .EditPath}}<a class="settings-open-link" href="{{.EditPath}}" target="_blank" rel="noopener">open in editor ↗</a>{{else}}<span class="settings-row-meta">built-in</span>{{end}}
    </div>
  </div>
  {{end}}
</div>
{{end}}
