{{define "settings-content"}}
<h2 class="settings-h2">Skill directories</h2>
<p class="settings-help">
  Directories serf scans for skills at launch. Applied to every spawn.
</p>
<div id="skills-form" data-loaded="false">
  <p>Loading…</p>
</div>
<script>
  (async function () {
    const root = document.getElementById("skills-form");
    const current = await launchconfig.getLayer("/", "global");
    const dirs = current.skillsDirs || [];
    function render() {
      root.innerHTML = `
        <ul class="settings-list">
          ${dirs.map((d, i) => `
            <li><code>${d}</code> <button data-i="${i}" data-action="rm">remove</button></li>
          `).join("")}
        </ul>
        <form id="skills-add">
          <input type="text" name="dir" placeholder="/absolute/path" required>
          <button type="submit">Add</button>
        </form>
      `;
      root.querySelectorAll("button[data-action=rm]").forEach(b => {
        b.addEventListener("click", async () => {
          dirs.splice(+b.dataset.i, 1);
          await launchconfig.setLayer("/", "global", { ...current, skillsDirs: dirs });
          render();
        });
      });
      root.querySelector("#skills-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const v = e.target.dir.value.trim();
        if (!v) return;
        dirs.push(v);
        await launchconfig.setLayer("/", "global", { ...current, skillsDirs: dirs });
        e.target.dir.value = "";
        render();
      });
    }
    render();
    root.dataset.loaded = "true";
  })();
</script>
<h3 class="settings-h3">Project overrides</h3>
<label>Working dir <input type="text" id="proj-skills-cwd" placeholder="/path/to/project"></label>
<div id="project-skills-form" data-loaded="false"><p>Enter a working dir above.</p></div>
<script>
  (function () {
    const cwdIn = document.getElementById("proj-skills-cwd");
    const root = document.getElementById("project-skills-form");
    cwdIn.value = localStorage.getItem("lastCwd") || "";
    let current = null;
    let dirs = [];
    async function refresh() {
      const cwd = cwdIn.value.trim();
      if (!cwd) { root.innerHTML = "<p>Enter a working dir above.</p>"; return; }
      current = await launchconfig.getLayer(cwd, "project");
      dirs = current.skillsDirs || [];
      render(cwd);
    }
    function render(cwd) {
      root.innerHTML = `
        <ul class="settings-list">
          ${dirs.map((d, i) => `
            <li><code>${d}</code> <button data-i="${i}" data-action="rm">remove</button></li>
          `).join("")}
        </ul>
        <form id="proj-skills-add">
          <input type="text" name="dir" placeholder="/absolute/path" required>
          <button type="submit">Add</button>
        </form>
      `;
      root.querySelectorAll("button[data-action=rm]").forEach(b => {
        b.addEventListener("click", async () => {
          dirs.splice(+b.dataset.i, 1);
          await launchconfig.setLayer(cwd, "project", { ...current, skillsDirs: dirs });
          await refresh();
        });
      });
      root.querySelector("#proj-skills-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const v = e.target.dir.value.trim();
        if (!v) return;
        dirs.push(v);
        await launchconfig.setLayer(cwd, "project", { ...current, skillsDirs: dirs });
        e.target.dir.value = "";
        await refresh();
      });
      root.dataset.loaded = "true";
    }
    cwdIn.addEventListener("change", refresh);
    refresh();
  })();
</script>
{{end}}
