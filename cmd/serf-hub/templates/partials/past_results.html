{{define "past_results"}}
{{if .Past}}
  {{range .Past}}
  <a class="row" href="/past/{{.Meta.ID}}">
    <span>
      <span class="wd">{{.Meta.EnvInfo.WorkingDir}}</span>
      {{if .Meta.OriginalTask}}<div class="meta">{{.Meta.OriginalTask}}</div>{{end}}
    </span>
    <span class="meta">{{.Meta.Model}} · {{.Meta.UpdatedAt.Format "2006-01-02 15:04"}}</span>
  </a>
  {{end}}
{{else}}
  <div class="empty">no matches</div>
{{end}}
{{end}}
