{{define "settings-content"}}
<div class="credentials-pane">
  <div class="credentials-header-row">
    <p class="credentials-help">
    Provider instances and their credentials. Keys are stored in <code>~/.serf/credentials.toml</code>
    (chmod 600). Env vars in the hub process take precedence only when no file
    entry exists. The UI never displays stored values.
  </p>
  <button type="button" class="btn btn-primary" id="btn-add-provider-instance">+ Add provider instance</button>
  </div>
  <section id="instances-root" class="settings-collection" data-loaded="false">
    <ul class="settings-collection-list" role="list">
      <li class="settings-collection-empty">Loading…</li>
    </ul>
  </section>
</div>
<script>
  (async function () {
    const root = document.getElementById("instances-root");
    const list = root.querySelector(".settings-collection-list");

    // openEditor tracks the currently open inline form:
    //   { name, kind } where kind is "set" | "device" | "oauth-redirect" | "edit" | "add"
    // plus flow state for device kind.
    let openEditor = null;
    let devicePollTimer = null;

    function stopDevicePolling() {
      if (devicePollTimer) { clearTimeout(devicePollTimer); devicePollTimer = null; }
    }

    // copyText copies via the async Clipboard API when available (secure
    // contexts: https / localhost) and falls back to execCommand("copy") for
    // plain-http remote hubs where navigator.clipboard is undefined.
    async function copyText(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) { /* fall through to the legacy path */ }
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "-1000px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand && document.execCommand("copy");
        document.body.removeChild(ta);
        return !!ok;
      } catch (e) {
        return false;
      }
    }

    async function startDeviceLogin(instanceName) {
      stopDevicePolling();
      try {
        const r = await launchconfig.authDeviceStart(instanceName);
        if (r && r.fallback) {
          const lr = await launchconfig.authLoginStart(instanceName);
          window.open(lr.url, "_blank", "noopener");
          openEditor = { name: instanceName, kind: "oauth-redirect", flowId: lr.flowId, authUrl: lr.url };
          await refresh();
          return;
        }
        openEditor = { name: instanceName, kind: "device", flowId: r.flowId, userCode: r.userCode, verificationUrl: r.verificationUrl };
        await refresh();
        startDevicePolling(instanceName, r.flowId, Math.max(1, r.intervalSeconds || 5) * 1000);
      } catch (err) {
        if (window.SerfToast) window.SerfToast.show("Sign-in failed: " + (err && err.message ? err.message : err), "error");
      }
    }

    function startDevicePolling(instanceName, flowId, intervalMs) {
      stopDevicePolling();
      const tick = async () => {
        let resp;
        try {
          resp = await launchconfig.authDevicePoll(instanceName, flowId);
        } catch (err) {
          if (openEditor && openEditor.kind === "device" && openEditor.flowId === flowId) {
            openEditor.error = (err && err.message) ? err.message : String(err);
            await refresh();
          }
          return;
        }
        if (!openEditor || openEditor.kind !== "device" || openEditor.flowId !== flowId) return;
        if (resp.state === "authorized") {
          stopDevicePolling();
          openEditor = null;
          await refresh();
          if (window.SerfToast) window.SerfToast.show("Signed in to " + instanceName, "success");
          return;
        }
        if (resp.state === "expired") {
          stopDevicePolling();
          openEditor.expired = true;
          openEditor.error = "Code expired — start again.";
          await refresh();
          return;
        }
        devicePollTimer = setTimeout(tick, intervalMs);
      };
      devicePollTimer = setTimeout(tick, intervalMs);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    }

    function sourceLabel(inst) {
      return {
        file: "Configured via stored API key",
        env:  "Configured via environment variable",
        oauth: "Configured via OAuth",
        absent: "Not configured",
        none: "No credentials required",
      }[inst.activeSource] || escapeHtml(inst.activeSource);
    }

    function badgeState(source) {
      switch (source) {
        case "file": case "oauth": case "env": return "idle";
        case "absent": case "none": return "ended";
        default: return "ended";
      }
    }

    function sourceLayers(inst) {
      // Collect every present credential layer in precedence order
      // (oauth > file > env) so shadowed layers stay visible, not just the
      // effective one. OpenAI can carry an OAuth sign-in shadowing a stored key.
      const layers = [];
      if (inst.hasStoredOAuth) {
        layers.push({ key: "oauth", label: "oauth: signed in" + (inst.storedEmail ? " (" + escapeHtml(inst.storedEmail) + ")" : "") });
      }
      if (inst.hasStoredFile) {
        layers.push({ key: "file", label: "file: stored key" });
      }
      if (inst.envVar) {
        layers.push({ key: "env", label: "env: " + escapeHtml(inst.envVar) });
      }
      if (layers.length <= 1) {
        return `<div class="row-meta">${sourceLabel(inst)}</div>`;
      }
      return layers.map(l => {
        const effective = inst.activeSource === l.key;
        const badge = effective
          ? ' <span class="status-badge" data-state="idle">effective</span>'
          : ' <span class="status-badge" data-state="ended">shadowed</span>';
        return `<div class="credentials-source-layer">↳ ${l.label}${badge}</div>`;
      }).join("");
    }

    function renderInstanceRow(inst) {
      const supportsApiKey = (inst.authModes || []).includes("apiKey");
      const supportsOAuth = (inst.authModes || []).includes("oauth");
      const showClear = inst.activeSource === "file" || inst.activeSource === "oauth";
      const isEditorOpen = openEditor && openEditor.name === inst.name;
      const editor = isEditorOpen ? renderEditor(inst, openEditor) : "";
      const styleInfo = inst.apiStyle
        ? `<span class="dim">${escapeHtml(inst.apiStyle)}${inst.baseUrl ? " · base " + escapeHtml(inst.baseUrl) : ""}</span>`
        : (inst.baseUrl ? `<span class="dim">base ${escapeHtml(inst.baseUrl)}</span>` : "");
      return `
        <li class="settings-collection-row credentials-row" data-instance="${escapeHtml(inst.name)}">
          <div>
            <div class="row-text">
              <span class="status-dot" data-state="${badgeState(inst.activeSource)}"></span>
              ${escapeHtml(inst.name)}
              ${inst.isDefault ? '<span class="status-badge" data-state="idle">★ default</span>' : ""}
              ${styleInfo}
            </div>
            ${sourceLayers(inst)}
            ${editor}
          </div>
          <div class="row-actions">
            ${supportsApiKey ? `<button type="button" class="btn btn-secondary" data-action="set">${inst.hasStoredFile ? "Replace key" : "Set key"}</button>` : ""}
            ${supportsOAuth ? `<button type="button" class="btn btn-secondary" data-action="oauth">${inst.activeSource === "oauth" ? "Refresh OAuth" : "Sign in…"}</button>` : ""}
            ${showClear ? `<button type="button" class="btn btn-danger" data-action="clear">Clear</button>` : ""}
            <button type="button" class="btn btn-secondary" data-action="edit">Edit</button>
            <button type="button" class="btn btn-danger" data-action="remove">Remove</button>
            ${!inst.isDefault ? `<button type="button" class="btn btn-secondary" data-action="set-default">★ make default</button>` : ""}
          </div>
        </li>
      `;
    }

    function renderEditor(inst, e) {
      if (e.kind === "set") {
        return `
          <form class="credentials-editor surface-inset" data-editor="set">
            <label class="credentials-editor-label" for="cred-key-${escapeHtml(inst.name)}">API key for ${escapeHtml(inst.name)}</label>
            <input id="cred-key-${escapeHtml(inst.name)}" type="password" autocomplete="off" placeholder="paste key" class="val-input">
            <div class="credentials-editor-actions">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancel</button>
            </div>
          </form>`;
      }
      if (e.kind === "oauth-redirect") {
        return `
          <form class="credentials-editor surface-inset" data-editor="oauth-redirect" data-flow-id="${escapeHtml(e.flowId)}">
            <label class="credentials-editor-label" for="cred-redirect-${escapeHtml(inst.name)}">
              Authorize in browser, then paste the full redirect URL back here.
              <a href="${escapeHtml(e.authUrl)}" target="_blank" rel="noopener">Re-open authorize URL</a>
            </label>
            <input id="cred-redirect-${escapeHtml(inst.name)}" type="text" autocomplete="off" placeholder="https://…" class="val-input">
            <div class="credentials-editor-actions">
              <button type="submit" class="btn btn-primary">Finish</button>
              <button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancel</button>
            </div>
          </form>`;
      }
      if (e.kind === "device") {
        const done = e.expired || e.error;
        return `
          <div class="credentials-editor surface-inset" data-editor="device">
            <div class="credentials-editor-label">Copy this code, then continue to OpenAI and paste it to authorize:</div>
            <div class="credentials-device-code">${escapeHtml(e.userCode)}</div>
            <p class="credentials-device-status">${e.error ? escapeHtml(e.error) : (e.copyFailed ? "Couldn't copy automatically — select the code above and copy it, then continue." : "Waiting for you to authorize…")}</p>
            <div class="credentials-editor-actions">
              ${done ? `<button type="button" class="btn btn-primary" data-action="device-retry">Start again</button>` :
                `<button type="button" class="btn btn-secondary" data-action="device-copy">${e.copied ? "Copied ✓" : "Copy code"}</button>
                 <button type="button" class="btn btn-primary" data-action="device-open"${e.copied ? "" : " disabled"}>Send me to OpenAI</button>`}
              <button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancel</button>
            </div>
          </div>`;
      }
      if (e.kind === "edit") {
        const showApiStyle = inst.type === "openai";
        return `
          <form class="credentials-editor surface-inset" data-editor="edit">
            <label class="credentials-editor-label">Edit ${escapeHtml(inst.name)}</label>
            ${showApiStyle ? `
            <div class="credentials-editor-field">
              <span class="credentials-editor-field-label">API style</span>
              <div class="val-radio-group">
                <label class="val-radio"><input type="radio" name="apiStyle-${escapeHtml(inst.name)}" value="responses"${inst.apiStyle === "responses" ? " checked" : ""}> responses</label>
                <label class="val-radio"><input type="radio" name="apiStyle-${escapeHtml(inst.name)}" value="chat-completions"${inst.apiStyle === "chat-completions" ? " checked" : ""}> chat-completions</label>
              </div>
            </div>` : ""}
            <div class="credentials-editor-field">
              <label class="credentials-editor-field-label" for="edit-baseurl-${escapeHtml(inst.name)}">Base URL (optional)</label>
              <input id="edit-baseurl-${escapeHtml(inst.name)}" type="text" autocomplete="off" placeholder="https://…" class="val-input" value="${escapeHtml(inst.baseUrl || "")}">
            </div>
            <div class="credentials-editor-actions">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" class="btn btn-ghost" data-action="cancel-edit">Cancel</button>
            </div>
          </form>`;
      }
      return "";
    }

    function renderGlobalAddForm(availableTypes) {
      const typeOptions = (availableTypes || []).map(t =>
        `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`
      ).join("");
      return `
        <li class="settings-collection-row credentials-add-row" id="global-add-form-row">
          <form class="credentials-editor surface-inset" data-editor="add" id="global-add-form">
            <label class="credentials-editor-label">Add provider instance</label>
            <div class="credentials-editor-field">
              <label class="credentials-editor-field-label" for="add-type-select">Type</label>
              <select id="add-type-select" class="val-input" required>
                ${typeOptions}
              </select>
            </div>
            <div class="credentials-editor-field">
              <label class="credentials-editor-field-label" for="add-name-input">Name</label>
              <input id="add-name-input" type="text" autocomplete="off" placeholder="e.g. work" class="val-input" required>
            </div>
            <div class="credentials-editor-field" id="add-apistyle-field" hidden>
              <span class="credentials-editor-field-label">API style</span>
              <div class="val-radio-group">
                <label class="val-radio"><input type="radio" name="add-apiStyle" value="responses" checked> responses</label>
                <label class="val-radio"><input type="radio" name="add-apiStyle" value="chat-completions"> chat-completions</label>
              </div>
            </div>
            <div class="credentials-editor-field">
              <label class="credentials-editor-field-label" for="add-baseurl-input">Base URL (optional)</label>
              <input id="add-baseurl-input" type="text" autocomplete="off" placeholder="https://…" class="val-input">
            </div>
            <div class="credentials-editor-actions">
              <button type="submit" class="btn btn-primary">Create</button>
              <button type="button" class="btn btn-ghost" data-action="cancel-add">Cancel</button>
            </div>
          </form>
        </li>`;
    }

    function renderTypeGroup(type, instances) {
      return `
        <li class="credentials-type-group" data-type="${escapeHtml(type)}">
          <div class="credentials-type-header">
            <span class="credentials-type-name">${escapeHtml(type)}</span>
          </div>
          <ul class="credentials-instance-list">
            ${instances.map(renderInstanceRow).join("")}
          </ul>
        </li>`;
    }

    function render(data) {
      const instances = data.instances || [];
      const availableTypes = data.availableTypes || [];

      // Group by type, preserving type order from sorted list.
      const typeOrder = [];
      const byType = {};
      for (const inst of instances) {
        if (!byType[inst.type]) {
          byType[inst.type] = [];
          typeOrder.push(inst.type);
        }
        byType[inst.type].push(inst);
      }

      let html = typeOrder.length
        ? typeOrder.map(type => renderTypeGroup(type, byType[type])).join("")
        : `<li class="settings-collection-empty">No provider instances configured.</li>`;

      if (openEditor && openEditor.kind === "add") {
        html += renderGlobalAddForm(availableTypes);
      }

      list.innerHTML = html;
      root.dataset.loaded = "true";

      // Wire up API-style visibility toggle on the type select.
      if (openEditor && openEditor.kind === "add") {
        const typeSelect = list.querySelector("#add-type-select");
        const apiStyleField = list.querySelector("#add-apistyle-field");
        if (typeSelect && apiStyleField) {
          const updateApiStyle = () => {
            apiStyleField.hidden = typeSelect.value !== "openai";
          };
          typeSelect.addEventListener("change", updateApiStyle);
          updateApiStyle();
        }
      }

      // Restore focus to the right input after re-render.
      if (openEditor) {
        let sel = null;
        if (openEditor.kind === "set") {
          sel = `[data-instance="${openEditor.name}"] .credentials-editor input[type=password]`;
        } else if (openEditor.kind === "oauth-redirect") {
          sel = `[data-instance="${openEditor.name}"] .credentials-editor input[type=text]`;
        } else if (openEditor.kind === "edit") {
          sel = `[data-instance="${openEditor.name}"] .credentials-editor [id^="edit-baseurl-"]`;
        } else if (openEditor.kind === "add") {
          sel = `#global-add-form #add-name-input`;
        }
        if (sel) {
          const input = list.querySelector(sel);
          if (input) input.focus();
        }
      }
    }

    async function refresh() {
      const data = await launchconfig.instanceList();
      render(data);
    }

    // Global "Add provider instance" button (outside the list).
    document.getElementById("btn-add-provider-instance").addEventListener("click", async () => {
      openEditor = { kind: "add" };
      await refresh();
    });

    // Delegate click handling on the instance list.
    list.addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === "cancel-add") {
        openEditor = null;
        await refresh();
        return;
      }

      // Instance-level actions — find the row.
      const row = btn.closest(".credentials-row");
      if (!row) return;
      const instanceName = row.dataset.instance;

      if (action === "set") {
        openEditor = { name: instanceName, kind: "set" };
        await refresh();
      } else if (action === "cancel-edit") {
        stopDevicePolling();
        openEditor = null;
        await refresh();
      } else if (action === "oauth") {
        await startDeviceLogin(instanceName);
      } else if (action === "device-retry") {
        await startDeviceLogin(instanceName);
      } else if (action === "device-copy") {
        if (openEditor && openEditor.kind === "device") {
          const ok = await copyText(openEditor.userCode);
          openEditor.copied = true;
          openEditor.copyFailed = !ok;
          await refresh();
        }
      } else if (action === "device-open") {
        if (openEditor && openEditor.kind === "device" && openEditor.verificationUrl) {
          window.open(openEditor.verificationUrl, "_blank", "noopener");
        }
      } else if (action === "clear") {
        if (!confirm(`Clear stored credentials for ${instanceName}?`)) return;
        stopDevicePolling();
        try {
          await launchconfig.authLogout(instanceName);
          openEditor = null;
          await refresh();
          if (window.SerfToast) window.SerfToast.show("Credentials cleared for " + instanceName, "success");
        } catch (err) {
          if (window.SerfToast) window.SerfToast.show("Clear failed: " + (err && err.message ? err.message : err), "error");
        }
      } else if (action === "edit") {
        openEditor = { name: instanceName, kind: "edit" };
        await refresh();
      } else if (action === "remove") {
        if (!confirm(`Remove instance "${instanceName}"? This will also clear its stored credentials.`)) return;
        stopDevicePolling();
        try {
          await launchconfig.instanceRemove(instanceName);
          openEditor = null;
          await refresh();
          if (window.SerfToast) window.SerfToast.show("Removed instance " + instanceName, "success");
        } catch (err) {
          if (window.SerfToast) window.SerfToast.show("Remove failed: " + (err && err.message ? err.message : err), "error");
        }
      } else if (action === "set-default") {
        try {
          await launchconfig.instanceSetDefault(instanceName);
          await refresh();
        } catch (err) {
          if (window.SerfToast) window.SerfToast.show("Set default failed: " + (err && err.message ? err.message : err), "error");
        }
      }
    });

    // Delegate form submit handling.
    list.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const form = ev.target.closest("form[data-editor]");
      if (!form) return;
      const kind = form.dataset.editor;

      function showInlineError(msg) {
        let errEl = form.querySelector(".credentials-editor-error");
        if (!errEl) {
          errEl = document.createElement("p");
          errEl.className = "credentials-editor-error";
          form.querySelector(".credentials-editor-label").after(errEl);
        }
        errEl.textContent = msg;
      }

      if (kind === "set") {
        const row = form.closest(".credentials-row");
        const instanceName = row.dataset.instance;
        const value = form.querySelector("input[type=password]").value.trim();
        if (!value) {
          openEditor = null;
          await refresh();
          return;
        }
        try {
          await launchconfig.authApiKeySet(instanceName, value);
          openEditor = null;
          await refresh();
          if (window.SerfToast) window.SerfToast.show("API key saved for " + instanceName, "success");
        } catch (err) {
          showInlineError(err && err.message ? err.message : String(err));
          if (window.SerfToast) window.SerfToast.show("Save failed: " + (err && err.message ? err.message : err), "error");
        }
      } else if (kind === "oauth-redirect") {
        const row = form.closest(".credentials-row");
        const instanceName = row.dataset.instance;
        const flowId = form.dataset.flowId;
        const redirectUrl = form.querySelector("input[type=text]").value.trim();
        if (!redirectUrl) {
          openEditor = null;
          await refresh();
          return;
        }
        try {
          await launchconfig.authLoginComplete(instanceName, flowId, redirectUrl);
          openEditor = null;
          await refresh();
          if (window.SerfToast) window.SerfToast.show("Signed in to " + instanceName, "success");
        } catch (err) {
          showInlineError(err && err.message ? err.message : String(err));
          if (window.SerfToast) window.SerfToast.show("Sign-in failed: " + (err && err.message ? err.message : err), "error");
        }
      } else if (kind === "edit") {
        const row = form.closest(".credentials-row");
        const instanceName = row.dataset.instance;
        const baseurlInput = form.querySelector("[id^='edit-baseurl-']");
        const baseUrl = baseurlInput ? baseurlInput.value.trim() : "";
        const apiStyleInput = form.querySelector("input[type=radio][name^='apiStyle-']:checked");
        const apiStyle = apiStyleInput ? apiStyleInput.value : "";
        try {
          await launchconfig.instanceEdit({ name: instanceName, apiStyle, baseUrl });
          openEditor = null;
          await refresh();
          if (window.SerfToast) window.SerfToast.show("Saved " + instanceName, "success");
        } catch (err) {
          showInlineError(err && err.message ? err.message : String(err));
          if (window.SerfToast) window.SerfToast.show("Edit failed: " + (err && err.message ? err.message : err), "error");
        }
      } else if (kind === "add") {
        const typeSelect = form.querySelector("#add-type-select");
        const type = typeSelect ? typeSelect.value : "";
        if (!type) {
          showInlineError("Type is required.");
          return;
        }
        const nameInput = form.querySelector("#add-name-input");
        const name = nameInput ? nameInput.value.trim() : "";
        if (!name) {
          showInlineError("Name is required.");
          return;
        }
        const baseurlInput = form.querySelector("#add-baseurl-input");
        const baseUrl = baseurlInput ? baseurlInput.value.trim() : "";
        // apiStyle only applies to type openai; for other types the field is
        // hidden and must not be sent (the backend rejects api_style on
        // non-openai types).
        const apiStyleInput = form.querySelector("input[type=radio][name='add-apiStyle']:checked");
        const apiStyle = type === "openai" && apiStyleInput ? apiStyleInput.value : "";
        try {
          await launchconfig.instanceCreate({ type, name, apiStyle, baseUrl });
          openEditor = null;
          await refresh();
          if (window.SerfToast) window.SerfToast.show("Created instance " + name, "success");
        } catch (err) {
          showInlineError(err && err.message ? err.message : String(err));
          if (window.SerfToast) window.SerfToast.show("Create failed: " + (err && err.message ? err.message : err), "error");
        }
      }
    });

    refresh();
  })();
</script>
{{end}}
