{{define "live_roster"}}
{{if .Live}}
  {{range .Live}}
  <a class="row" href="/live/{{.SessionID}}">
    <span class="wd">{{.WorkingDir}}</span>
    <span class="meta">{{.Model}} · pid {{.PID}} · {{.SpawnedBy}}</span>
  </a>
  {{end}}
{{else}}
  <div class="empty">no live daemons</div>
{{end}}
{{end}}
