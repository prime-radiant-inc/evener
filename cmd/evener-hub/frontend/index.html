<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Touch screens never zoom this app (Jesse 2026-11-15): every editable
         control is at least 16px on phones and on any coarse pointer
         (tokens.css's touch block, beside --tap-min, floors
         --font-size-control; display-gates.test.ts scans every control
         rule), so iOS Safari has nothing to auto-zoom into; global.css's
         (any-pointer: coarse) touch-action: pan-x pan-y drops double-tap
         and pinch zoom where touch-action carries the viewport (Chromium),
         and pinchVeto prevents Safari's gesturestart under the same coarse
         gate (main.tsx), which is what iOS respects for pinch;
         viewport-fit=cover makes
         the env(safe-area-inset-*) paddings in the mobile shell nonzero.
         interactive-widget=resizes-content
         makes browsers that honor it (Chromium/Android, Safari 27.3+) shrink
         the layout viewport when the on-screen keyboard opens, so the fixed
         mobile shell (and the composer docked in its footer) rides up instead
         of sliding under the keyboard; browsers that ignore the key get the
         same result from useKeyboardInset's visualViewport-driven
         --keyboard-inset. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Mirrors tokens.css's dark --surface-0 and the PWA manifest's
         background_color/theme_color; src/styles/pwa-manifest-colors.test.ts
         locks all three together. -->
    <meta name="theme-color" content="#111214" />
    <title>evener</title>
    <!-- crossorigin="use-credentials" so the manifest fetch carries the auth
         cookie (floor §4.5 REQUIRED). -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  </head>
  <body>
    <!-- Presence means this workspace can report the iPhone host ready capabilities. -->
    <div id="root" data-iphone-host-capabilities="v1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
