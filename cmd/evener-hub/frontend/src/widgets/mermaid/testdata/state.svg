<svg id="fixture" width="100%" xmlns="http://www.w3.org/2000/svg" class="statediagram" style="max-width: 66px;" viewBox="-8 -8 66 36" role="graphics-document document" aria-roledescription="stateDiagram"><style>#fixture{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture .error-icon{fill:#552222;}#fixture .error-text{fill:#552222;stroke:#552222;}#fixture .edge-thickness-normal{stroke-width:1px;}#fixture .edge-thickness-thick{stroke-width:3.5px;}#fixture .edge-pattern-solid{stroke-dasharray:0;}#fixture .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture .edge-pattern-dashed{stroke-dasharray:3;}#fixture .edge-pattern-dotted{stroke-dasharray:2;}#fixture .marker{fill:#333333;stroke:#333333;}#fixture .marker.cross{stroke:#333333;}#fixture svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture p{margin:0;}#fixture defs [id$="-barbEnd"]{fill:#333333;stroke:#333333;}#fixture g.stateGroup text{fill:#9370DB;stroke:none;font-size:10px;}#fixture g.stateGroup text{fill:#333;stroke:none;font-size:10px;}#fixture g.stateGroup .state-title{font-weight:bolder;fill:#131300;}#fixture g.stateGroup rect{fill:#ECECFF;stroke:#9370DB;}#fixture g.stateGroup line{stroke:#333333;stroke-width:1;}#fixture .transition{stroke:#333333;stroke-width:1;fill:none;}#fixture .stateGroup .composit{fill:white;border-bottom:1px;}#fixture .stateGroup .alt-composit{fill:#e0e0e0;border-bottom:1px;}#fixture .state-note{stroke:#aaaa33;fill:#fff5ad;}#fixture .state-note text{fill:black;stroke:none;font-size:10px;}#fixture .stateLabel .box{stroke:none;stroke-width:0;fill:#ECECFF;opacity:0.5;}#fixture .edgeLabel .label rect{fill:#ECECFF;opacity:0.5;}#fixture .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#fixture .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#fixture .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#fixture .edgeLabel .label text{fill:#333;}#fixture .label div .edgeLabel{color:#333;}#fixture .stateLabel text{fill:#131300;font-size:10px;font-weight:bold;}#fixture .node circle.state-start{fill:#333333;stroke:#333333;}#fixture .node .fork-join{fill:#333333;stroke:#333333;}#fixture .node circle.state-end{fill:#9370DB;stroke:white;stroke-width:1.5;}#fixture .end-state-inner{fill:white;stroke-width:1.5;}#fixture .node rect{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#fixture .node polygon{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#fixture [id$="-barbEnd"]{fill:#333333;}#fixture .statediagram-cluster rect{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#fixture .cluster-label,#fixture .nodeLabel{color:#131300;}#fixture .statediagram-cluster rect.outer{rx:5px;ry:5px;}#fixture .statediagram-state .divider{stroke:#9370DB;}#fixture .statediagram-state .title-state{rx:5px;ry:5px;}#fixture .statediagram-cluster.statediagram-cluster .inner{fill:white;}#fixture .statediagram-cluster.statediagram-cluster-alt .inner{fill:#f0f0f0;}#fixture .statediagram-cluster .inner{rx:0;ry:0;}#fixture .statediagram-state rect.basic{rx:5px;ry:5px;}#fixture .statediagram-state rect.divider{stroke-dasharray:10,10;fill:#f0f0f0;}#fixture .note-edge{stroke-dasharray:5;}#fixture .statediagram-note rect{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;rx:0;ry:0;}#fixture .statediagram-note rect{fill:#fff5ad;stroke:#aaaa33;stroke-width:1px;rx:0;ry:0;}#fixture .statediagram-note text{fill:black;}#fixture .statediagram-note .nodeLabel{color:black;}#fixture .statediagram .edgeLabel{color:red;}#fixture [id$="-dependencyStart"],#fixture [id$="-dependencyEnd"]{fill:#333333;stroke:#333333;stroke-width:1;}#fixture .statediagramTitleText{text-anchor:middle;font-size:18px;fill:#333;}#fixture [data-look="neo"].statediagram-cluster rect{fill:#ECECFF;stroke:#9370DB;stroke-width:1;}#fixture [data-look="neo"].statediagram-cluster rect.outer{rx:5px;ry:5px;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture .node .neo-node{stroke:#9370DB;}#fixture [data-look="neo"].node rect,#fixture [data-look="neo"].cluster rect,#fixture [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].swimlane.cluster rect{filter:none;}#fixture [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].node circle .state-start{fill:#000000;}#fixture [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><defs><marker id="fixture_stateDiagram-barbEnd" refX="19" refY="7" markerWidth="20" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M 19,7 L9,13 L14,7 L9,1 Z"></path></marker></defs><g class="root"><g class="clusters"></g><g class="edgePaths"><path d="M33,43L33,44.667C33,46.333,33,49.667,33,55.5C33,61.333,33,69.667,33,73.833L33,78" id="fixture-edge0" class="edge-thickness-normal edge-pattern-solid transition" style="fill:none;;;fill:none" data-edge="true" data-et="edge" data-id="edge0" data-points="W3sieCI6MzMsInkiOjQzfSx7IngiOjMzLCJ5Ijo1M30seyJ4IjozMywieSI6Nzh9XQ==" data-look="classic" marker-end="url(#fixture_