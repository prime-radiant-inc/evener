<svg id="fixture" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 0 148" style="max-width: 0px;" role="graphics-document document" aria-roledescription="gantt"><style>#fixture{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture .error-icon{fill:#552222;}#fixture .error-text{fill:#552222;stroke:#552222;}#fixture .edge-thickness-normal{stroke-width:1px;}#fixture .edge-thickness-thick{stroke-width:3.5px;}#fixture .edge-pattern-solid{stroke-dasharray:0;}#fixture .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture .edge-pattern-dashed{stroke-dasharray:3;}#fixture .edge-pattern-dotted{stroke-dasharray:2;}#fixture .marker{fill:#333333;stroke:#333333;}#fixture .marker.cross{stroke:#333333;}#fixture svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture p{margin:0;}#fixture .mermaid-main-font{font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture .exclude-range{fill:#eeeeee;}#fixture .section{stroke:none;opacity:0.2;}#fixture .section0{fill:rgba(102, 102, 255, 0.49);}#fixture .section2{fill:#fff400;}#fixture .section1,#fixture .section3{fill:white;opacity:0.2;}#fixture .sectionTitle0{fill:#333;}#fixture .sectionTitle1{fill:#333;}#fixture .sectionTitle2{fill:#333;}#fixture .sectionTitle3{fill:#333;}#fixture .sectionTitle{text-anchor:start;font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture .grid .tick{stroke:lightgrey;opacity:0.8;shape-rendering:crispEdges;}#fixture .grid .tick text{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;}#fixture .grid path{stroke-width:0;}#fixture .today{fill:none;stroke:red;stroke-width:2px;}#fixture .task{stroke-width:2;}#fixture .taskText{text-anchor:middle;font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture .taskTextOutsideRight{fill:black;text-anchor:start;font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture .taskTextOutsideLeft{fill:black;text-anchor:end;}#fixture .task.clickable{cursor:pointer;}#fixture .taskText.clickable{cursor:pointer;fill:#003163!important;font-weight:bold;}#fixture .taskTextOutsideLeft.clickable{cursor:pointer;fill:#003163!important;font-weight:bold;}#fixture .taskTextOutsideRight.clickable{cursor:pointer;fill:#003163!important;font-weight:bold;}#fixture .taskText0,#fixture .taskText1,#fixture .taskText2,#fixture .taskText3{fill:white;}#fixture .task0,#fixture .task1,#fixture .task2,#fixture .task3{fill:#8a90dd;stroke:#534fbc;}#fixture .taskTextOutside0,#fixture .taskTextOutside2{fill:black;}#fixture .taskTextOutside1,#fixture .taskTextOutside3{fill:black;}#fixture .active0,#fixture .active1,#fixture .active2,#fixture .active3{fill:#bfc7ff;stroke:#534fbc;}#fixture .activeText0,#fixture .activeText1,#fixture .activeText2,#fixture .activeText3{fill:black!important;}#fixture .done0,#fixture .done1,#fixture .done2,#fixture .done3{stroke:grey;fill:lightgrey;stroke-width:2;}#fixture .doneText0,#fixture .doneText1,#fixture .doneText2,#fixture .doneText3{fill:black!important;}#fixture .doneText0.taskTextOutsideLeft,#fixture .doneText0.taskTextOutsideRight,#fixture .doneText1.taskTextOutsideLeft,#fixture .doneText1.taskTextOutsideRight,#fixture .doneText2.taskTextOutsideLeft,#fixture .doneText2.taskTextOutsideRight,#fixture .doneText3.taskTextOutsideLeft,#fixture .doneText3.taskTextOutsideRight{fill:black!important;}#fixture .crit0,#fixture .crit1,#fixture .crit2,#fixture .crit3{stroke:#ff8888;fill:red;stroke-width:2;}#fixture .activeCrit0,#fixture .activeCrit1,#fixture .activeCrit2,#fixture .activeCrit3{stroke:#ff8888;fill:#bfc7ff;stroke-width:2;}#fixture .doneCrit0,#fixture .doneCrit1