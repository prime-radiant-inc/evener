<svg id="fixture" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 450" style="max-width: 512px;" role="graphics-document document" aria-roledescription="pie"><style>#fixture{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture .error-icon{fill:#552222;}#fixture .error-text{fill:#552222;stroke:#552222;}#fixture .edge-thickness-normal{stroke-width:1px;}#fixture .edge-thickness-thick{stroke-width:3.5px;}#fixture .edge-pattern-solid{stroke-dasharray:0;}#fixture .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture .edge-pattern-dashed{stroke-dasharray:3;}#fixture .edge-pattern-dotted{stroke-dasharray:2;}#fixture .marker{fill:#333333;stroke:#333333;}#fixture .marker.cross{stroke:#333333;}#fixture svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture p{margin:0;}#fixture .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#fixture .pieCircle.highlighted{scale:1.05;opacity:1;}#fixture .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#fixture .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#fixture .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#fixture .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#fixture .node .neo-node{stroke:#9370DB;}#fixture [data-look="neo"].node rect,#fixture [data-look="neo"].cluster rect,#fixture [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].swimlane.cluster rect{filter:none;}#fixture [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].node circle .state-start{fill:#000000;}#fixture [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,108.74,149.668L0,0Z" fill="#ECECFF" class="pieCircle"></path><path d="M108.74,149.668A185,185,0,0,1,-175.945,57.168L0,0Z" fill="#ffffde" class="pieCircle"></path><path d="M-175.945,57.168A185,185,0,0,1,0,-185L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"></path><text transform="translate(131.95909163595255,-42.87610796952395)" style="text-anchor: middle;" class="slice">40%</text><text transform="translate(-42.87610796952394,131.95909163595257)" style="text-anchor: middle;" class="slice">30%</text><text transform="translate(-112.25110796952396,-81.55520375558064)" style="text-anchor: middle;" class="slice">30%</text></g><text x="0" y="-200" class="pieTitleText">Sample Pie</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"></rect><text x="22" y="14">Rent</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);"></rect><text x="22" y="14">Food</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(181, 255, 32); stroke: rgb(181, 255, 32);"></rect><text x="22" y="14">Other</text></g></g></svg>