<svg id="fixture" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 66px;" viewBox="-8 -8 66 36" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#fixture{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture .error-icon{fill:#552222;}#fixture .error-text{fill:#552222;stroke:#552222;}#fixture .edge-thickness-normal{stroke-width:1px;}#fixture .edge-thickness-thick{stroke-width:3.5px;}#fixture .edge-pattern-solid{stroke-dasharray:0;}#fixture .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture .edge-pattern-dashed{stroke-dasharray:3;}#fixture .edge-pattern-dotted{stroke-dasharray:2;}#fixture .marker{fill:#333333;stroke:#333333;}#fixture .marker.cross{stroke:#333333;}#fixture svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture p{margin:0;}#fixture .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#fixture .cluster-label text{fill:#333;}#fixture .cluster-label span{color:#333;}#fixture .cluster-label span p{background-color:transparent;}#fixture .label text,#fixture span{fill:#333;color:#333;}#fixture .node rect,#fixture .node circle,#fixture .node ellipse,#fixture .node polygon,#fixture .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#fixture .rough-node .label text,#fixture .node .label text,#fixture .image-shape .label,#fixture .icon-shape .label{text-anchor:middle;}#fixture .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#fixture .rough-node .label,#fixture .node .label,#fixture .image-shape .label,#fixture .icon-shape .label{text-align:center;}#fixture .node.clickable{cursor:pointer;}#fixture .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#fixture .arrowheadPath{fill:#333333;}#fixture .edgePaths .path{stroke:#333333;stroke-width:1px;}#fixture .flowchart-link{stroke:#333333;fill:none;}#fixture .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#fixture .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#fixture .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#fixture .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#fixture .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#fixture .cluster text{fill:#333;}#fixture .cluster span{color:#333;}#fixture .node .collapsed-indicator{fill:#aaaa33;stroke:none;opacity:0.6;}#fixture .node .collapsed-separator{stroke:#aaaa33;stroke-width:0.75px;}#fixture div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#fixture .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#fixture rect.text{fill:none;stroke-width:0;}#fixture .icon-shape,#fixture .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#fixture .icon-shape p,#fixture .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#fixture .icon-shape .label rect,#fixture .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#fixture .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#fixture .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#fixture .node .neo-node{stroke:#9370DB;}#fixture [data-look="neo"].node rect,#fixture [data-look="neo"].cluster rect,#fixture [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].swimlane.cluster rect{filter:none;}#fixture [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].node circle .state-start{fill:#000000;}#fixture [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="fixture_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1,0;"></path></marker><marker id="fixture_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1,0;"></path></marker><marker id="fixture_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1,0;"></path></marker><marker id="fixture_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto"><polygon poin