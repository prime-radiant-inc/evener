     against the REAL imagegallery.module.css class names. Three fixtures,

     (400x1200) by max-height alone - so neither declaration can cover for
     the other - and SMALL (100x50, under the cap on both axes) proves "up
     to": a fixed 600x600 box would upscale it, which the ask ("up to 600px
     square") forbids. All three are non-square so a square-box regression
     (a fixed-size box with object-fit:cover, like the 96px thumbnail)
     changes the measured aspect ratio and fails. -->
