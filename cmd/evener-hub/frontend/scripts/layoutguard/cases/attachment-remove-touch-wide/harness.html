<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>attachment-remove-touch-wide layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  body {
    margin: 0;
    /* Room above the clipping wrapper, so a control hanging out of the row
       is lost to that wrapper's clip rather than to the viewport edge. */
    padding: 48px 16px;
    background: var(--surface-1);
    font-family: var(--font-sans);
  }
  /* .removeSlot ramps its opacity over --motion-duration-overlay; the case
     asserts where the cascade settles, not a frame of the ramp. */
  * {
    transition: none !important;
  }
</style>
</head>
<body>
<!-- The same two settled tiles as attachment-remove-touch-phone's harness, in
     the composer's real .attachments row against the REAL composer.module.css
     ZoomableMedia (the open button) and IconButton class names; only the viewport differs. The clipping
     wrapper stands in for PaneScaffold, which clips its own overflow. -->
<div style="overflow: hidden">
<div class="attachments" id="row">
  <div class="imageTile" id="first-tile">
    <button type="button" class="zoomableMedia" data-fill="true" id="first-open" aria-label="View first.png"><img class="imageThumbnail" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP4z/AfjhhQOEhsVA4ANSkf4Z/pjskAAAAASUVORK5CYII=" alt=""></button>
    <div class="dimensionsOverlay">4×4</div>
    <span class="removeSlot" id="first-slot">
      <button type="button" class="button secondary squareSm" id="first-remove" aria-label="Remove first.png"><span class="icon"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span></button>
    </span>
  </div>

  <div class="imageTile" id="second-tile">
    <button type="button" class="zoomableMedia" data-fill="true" id="second-open" aria-label="View second.png"><img class="imageThumbnail" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP4z/AfjhhQOEhsVA4ANSkf4Z/pjskAAAAASUVORK5CYII=" alt=""></button>
    <div class="dimensionsOverlay">4×4</div>
    <span class="removeSlot" id="second-slot">
      <button type="button" class="button secondary squareSm" id="second-remove" aria-label="Remove second.png"><span class="icon"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span></button>
    </span>
  </div>
</div>
</div>
<script>
window.measure = () => {
  // The id of the button a tap at (x, y) would land on - elementFromPoint
  // hit-tests regardless of opacity, which is exactly the hazard: an
  // invisible control still takes the tap.
  const hit = (x, y) => {
    const element = document.elementFromPoint(x, y);
    return element?.closest("button")?.id ?? `${element?.tagName ?? "nothing"}#${element?.id ?? ""} at ${x},${y}`;
  };
  const read = (prefix) => {
    const tile = document.getElementById(`${prefix}-tile`).getBoundingClientRect();
    const remove = document.getElementById(`${prefix}-remove`).getBoundingClientRect();
    const centre = { x: tile.left + tile.width / 2, y: tile.top + tile.height / 2 };
    // Just inside the middle of each edge of the remove control (edge
    // midpoints, because the button's border-radius rightly excludes its
    // corners from hit-testing).
    const inset = 2;
    const midX = remove.left + remove.width / 2;
    const midY = remove.top + remove.height / 2;
    const edges = [
      hit(midX, remove.top + inset),
      hit(remove.right - inset, midY),
      hit(midX, remove.bottom - inset),
      hit(remove.left + inset, midY),
    ];
    return {
      centreHit: hit(centre.x, centre.y),
      removeCentreHit: hit(midX, midY),
      edges,
      removeWidth: remove.width,
      removeHeight: remove.height,
      slotOpacity: Number(getComputedStyle(document.getElementById(`${prefix}-slot`)).opacity),
    };
  };
  return {
    viewportWidth: window.innerWidth,
    anyPointerCoarse: matchMedia("(any-pointer: coarse)").matches,
    first: read("first"),
    second: read("second"),
  };
};
</script>
</body>
</html>
