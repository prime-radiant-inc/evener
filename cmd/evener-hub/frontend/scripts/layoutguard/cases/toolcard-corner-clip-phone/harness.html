<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toolcard-corner-clip-phone layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  *, *::before, *::after { transition: none !important; animation: none !important; }
  body {
    margin: 0;
    background: var(--surface-0);
    font-family: var(--font-sans);
    color: var(--ink-hi);
  }
  .fixtures { display: flex; flex-direction: column; gap: 32px; padding: 24px 12px; }
</style>
</head>
<body data-font-size="m">
<!-- TurnBlock's intent group gives each member its own wrapper. A descriptor
     that suppresses its row leaves that wrapper empty after the evidence band. -->
<main class="fixtures">
  <div class="intentGroupRows" id="group-open">
    <div><div class="call" data-testid="tool-call-item" data-row-fixture="collapsed"></div></div>
  </div>
  <div class="intentGroupRows" id="group-band">
    <div><div class="call" data-testid="tool-call-item" data-row-fixture="expanded"></div></div>
    <div id="empty-member"></div>
  </div>
</main>
<script type="module">
import { mountToolRows, measureToolRows } from "/scripts/layoutguard/cases/toolcard-corner-clip-phone/row-contracts.mjs";
mountToolRows();
window.measure = () => ({
  ...measureToolRows(),
  groupBottom: document.getElementById("group-band").getBoundingClientRect().bottom,
});
</script>
</body>
</html>
