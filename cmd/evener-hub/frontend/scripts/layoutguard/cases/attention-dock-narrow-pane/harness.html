<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>attention-dock-narrow-pane layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  body {
    margin: 0;
    background: var(--surface-1);
    font-family: var(--font-sans);
  }
  /* A narrow dockview column, the shape a two-column cascade leaves beside the
     rail on a laptop. overflow: hidden is the scaffold's own clip: the dock's
     overflow is measured off its rects, but the clip is what makes the part
     past this edge unreachable for a person. */
  .pane {
    width: 300px;
    height: 700px;
    overflow: hidden;
    background: var(--surface-2);
  }
</style>
</head>
<body>
<div class="pane" id="pane" data-pane-scaffold="session:local:frame" data-has-edge-footer="true">
  <!-- The dormant surface: conversation body's content column, no transcript,
       with the attention dock at its trailing bottom corner. Markup mirrors
       ConversationBody's attentionDock plus NextNeedsYou's own root/nextSlot. -->
  <div class="contentColumn" style="--floating-chrome-height: 60px; --dock-clearance: 16px">
    <div class="transcriptEndInset"></div>
    <div class="attentionDock" data-testid="attention-dock">
      <div class="root" data-testid="next-needs-you">
        <div class="nextSlot">
          <button class="button secondary md wrap" type="button" data-testid="next">
            <span class="nextStack">
              <span class="nextLead"><span class="nextDot"></span>Needs you</span>
              <span class="nextLabel" data-label
                >Merging the release branch, re-running the browser guard, and refreshing the evidence for the next
                session</span
              >
            </span>
          </button>
        </div>
        <button class="button secondary squareMd" type="button" aria-label="More needs-you sessions">
          <span class="ellipsis" aria-hidden="true">…</span>
        </button>
      </div>
    </div>
  </div>
</div>
<script>
function rectOf(element) {
  const rect = element.getBoundingClientRect();
  return { top: rect.top, right: rect.right, bottom: rect.bottom, left: rect.left, width: rect.width, height: rect.height };
}

window.measure = () => {
  const label = document.querySelector("[data-label]");
  const pane = document.getElementById("pane");
  const end = document.querySelector(".transcriptEndInset");
  const dock = document.querySelector('[data-testid="attention-dock"]');
  const dockedEnd = end.getBoundingClientRect().height;
  const dockedBottom = dock.getBoundingClientRect().bottom;
  // A wide Home Screen window can have a narrow reader beside the system area.
  // The mobile session has no edge footer and floats its composer over this reader.
  pane.removeAttribute("data-has-edge-footer");
  const floatingEnd = end.getBoundingClientRect().height;
  const attentionLift = dockedBottom - dock.getBoundingClientRect().bottom;
  pane.setAttribute("data-has-edge-footer", "true");
  return {
    dockedEnd, floatingEnd, attentionLift,
    pane: rectOf(document.getElementById("pane")),
    dock: rectOf(document.querySelector('[data-testid="attention-dock"]')),
    control: rectOf(document.querySelector('[data-testid="next-needs-you"]')),
    next: rectOf(document.querySelector('[data-testid="next"]')),
    label: {
      rect: rectOf(label),
      scrollWidth: label.scrollWidth,
      clientWidth: label.clientWidth,
      scrollHeight: label.scrollHeight,
      clientHeight: label.clientHeight,
      lineHeight: parseFloat(getComputedStyle(label).lineHeight),
    },
  };
};
</script>
</body>
</html>
