<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dirpicker-mobile-recents-crush layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--ink-hi);
    font-family: var(--font-sans);
    font-size: var(--font-size-body);
    line-height: var(--line-height-body);
  }
  /* Local mirror of dialog.module.css's .footer: the picker's own .footer
     class would otherwise collide with the wrapper's de-scoped name in the
     harness (the module CSS loads de-scoped here, so class="footer" on the
     wrapper would also apply the picker's flex: 1 to it and let the footer
     row take half the panel). The inner .footer below keeps the picker's
     own class name, exactly as the component renders it, and additionally
     picks up dialog.module.css's de-scoped .footer (padding, border-top,
     background, flex-wrap, justify-content): that makes the footer row
     taller and the body shorter than production's, a stricter-not-looser
     direction for the containment assertions below. */
  .panelFooter {
    padding: var(--space-3) var(--space-4);
    background: var(--surface-inset);
    border-top: 1px solid var(--edge);
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: var(--space-2);
  }
</style>
</head>
<body>
<div class="scrim">
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="t">
    <header class="header">
      <h2 id="t" class="title">Choose directory</h2>
    </header>
    <div class="body" id="body">
      <div class="browser" id="browser">
        <aside class="recents" id="recents" aria-label="Recent directories">
          <h3>Recent</h3>
          <!-- 15 recents rows, seeded from the reported phone screenshot's
               list, each mirroring the component's row: ListRow's plain
               interactive row, with the basename as the label and the parent
               directory as the truncated meta line. -->
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">evener</span></span><span class="meta">/home/jesse/git/prime-radiant-inc</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">sigma-fp</span></span><span class="meta">/home/jesse/git</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">chao</span></span><span class="meta">/home/jesse/git/prime-radiant-inc</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">cat-test</span></span><span class="meta">/home/jesse</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">frop</span></span><span class="meta">/home/jesse/git/prime-radiant-inc</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">jesse</span></span><span class="meta">/home</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">tmp</span></span><span class="meta">/</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">alltheagents.org</span></span><span class="meta">/home/jesse/git/prime-radiant-inc</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">easy-writing</span></span><span class="meta">/home/jesse/git/prime-radiant-inc</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">msgvault</span></span><span class="meta">/home/jesse/git</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">obsidian</span></span><span class="meta">/fast</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">cdp-probe</span></span><span class="meta">/home/jesse/git</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">browser-cache</span></span><span class="meta">/home/jesse/git</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">par-notes</span></span><span class="meta">/home/jesse/git</span></button>
          <button class="row plain interactive" type="button"><span class="heading"><span class="label">quorum</span></span><span class="meta">/home/jesse/git/prime-radiant-inc</span></button>
          <h3>Locations</h3>
          <button type="button" class="button quiet md">Home</button>
        </aside>
        <div class="browse" id="browse">
          <div class="navigation">
            <button type="button" class="button secondary md" aria-label="Parent directory">↑</button>
            <nav class="crumbs" aria-label="Directory breadcrumbs">
              <button type="button" class="button quiet md">/</button>
              <button type="button" class="button quiet md">home</button>
              <button type="button" class="button quiet md">jesse</button>
            </nav>
          </div>
          <form class="pathForm">
            <input id="path-input" class="input" aria-label="Path" value="/home/jesse" spellcheck="false">
            <button type="submit" class="button secondary md">Go</button>
          </form>
          <div class="listHeading">
            <span>Folders</span>
            <button type="button" id="new-folder" class="button quiet sm">New folder</button>
          </div>
          <section class="folders" aria-label="Folders" id="folders">
            <button class="row plain withLeading interactive" type="button"><span class="leading"><span class="rowGlyph">▸</span></span><span class="heading"><span class="label"><span class="rowLabel">.config</span></span><span class="value" aria-hidden="true">›</span></span></button>
            <button class="row plain withLeading interactive" type="button"><span class="leading"><span class="rowGlyph">▸</span></span><span class="heading"><span class="label"><span class="rowLabel">Documents</span></span><span class="value" aria-hidden="true">›</span></span></button>
            <button class="row plain withLeading interactive" type="button"><span class="leading"><span class="rowGlyph">▸</span></span><span class="heading"><span class="label"><span class="rowLabel">Downloads</span></span><span class="value" aria-hidden="true">›</span></span></button>
            <button class="row plain withLeading interactive" type="button"><span class="leading"><span class="rowGlyph">▸</span></span><span class="heading"><span class="label"><span class="rowLabel">git</span></span><span class="value" aria-hidden="true">›</span></span></button>
            <button class="row plain withLeading interactive" type="button"><span class="leading"><span class="rowGlyph">▸</span></span><span class="heading"><span class="label"><span class="rowLabel">.local</span></span><span class="value" aria-hidden="true">›</span></span></button>
          </section>
        </div>
      </div>
    </div>
    <div class="panelFooter" id="panel-footer">
      <div class="footer">
        <div class="destination">
          <span>Use this directory</span>
          <strong>jesse</strong>
          <span class="path">/home/jesse</span>
        </div>
        <div class="actions">
          <button type="button" id="cancel" class="button quiet md">Cancel</button>
          <button type="button" id="use-folder" class="button primary md">Use this folder</button>
        </div>
      </div>
    </div>
    <button type="button" class="closeButton" aria-label="Close">✕</button>
  </div>
</div>
<script>
function rectOf(el) {
  const r = el.getBoundingClientRect();
  return { top: r.top, bottom: r.bottom, left: r.left, right: r.right, width: r.width, height: r.height };
}

function scrollable(el) {
  return { ...rectOf(el), scrollHeight: el.scrollHeight, clientHeight: el.clientHeight, overflowY: getComputedStyle(el).overflowY };
}

window.measure = () => {
  const panel = document.getElementById("panel");
  const body = document.getElementById("body");
  const browser = document.getElementById("browser");
  const recents = document.getElementById("recents");
  const browse = document.getElementById("browse");
  const pathInput = document.getElementById("path-input");
  const newFolder = document.getElementById("new-folder");
  const useFolder = document.getElementById("use-folder");
  const cancel = document.getElementById("cancel");

  return {
    viewport: { w: window.innerWidth, h: window.innerHeight },
    panel: rectOf(panel),
    body: scrollable(body),
    browser: rectOf(browser),
    recents: scrollable(recents),
    browse: scrollable(browse),
    pathInput: rectOf(pathInput),
    newFolder: rectOf(newFolder),
    useFolder: rectOf(useFolder),
    cancel: rectOf(cancel),
  };
};
</script>
</body>
</html>
