<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>rail-row-chevron-actions-overlap layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  /* Transitions OFF (docs/testing.md: "switch transitions off in the
     harness"): these assertions read elementFromPoint hit-testing, which
     follows visibility - and the production swap delays visibility flips
     behind a 120ms opacity fade. With transitions on, a measure taken right
     after the runner forces :hover would read the MID-FLIP state; with them
     off, every state the cascade can produce is measured settled. (The
     geometry assertions wouldn't care - opacity is paint-only - but the
     hit-testing ones do.) */
  *, *::before, *::after { transition: none !important; }
  body {
    margin: 0;
    background: var(--surface-1);
    font-family: var(--font-sans);
  }
  .fixtures { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 12px; }
  .fixtureLabel { color: var(--ink-low); font: var(--font-size-caption) var(--font-mono); }
  /* The rail's own column width at the sidebar's SIDEBAR_WIDTH_MIN (200px)
     and SIDEBAR_WIDTH_DEFAULT (280px, stores/prefs.ts) - direct-wrapping
     `.railRow` at this width, same simplification rail-row-text-align's own
     harness uses (see that case's own comment): the treeitem/section
     padding chain .railRow actually sits inside in production insets every
     row equally, so it doesn't change whether the chevron and the actions
     menu overlap - only the row's own content width does. */
  .railBox { box-sizing: border-box; }
</style>
</head>
<body data-font-size="m">
<!-- Reproduces RailRow.tsx's SessionRow and ProjectRow anatomy against the
     REAL classes from RailRow.module.css, widgets/menu/menu.module.css
     (Menu's trigger, quiet variant), widgets/button + widgets/iconbutton
     (ProjectRow's "+" IconButton), and widgets/badge (the rollup Badge) -
     and the real Chevron widget's SVG markup (widgets/chevron/index.tsx,
     size=12, viewBox 0 0 16 16), not a text-glyph stand-in: this case's
     whole point is the chevron's actual 12x12 hit box against the actions
     menu's actual hit box, so a narrower glyph proxy would under-measure
     the overlap.

     The anatomy is the 2026-08 shared right slot: the slot's occupant
     (timestamp / "Not started" / Badge) and .actions are the TWO CHILDREN
     OF ONE .rightSlot grid cell - the menu borrows the occupant's space and
     covers it while revealed, instead of reserving its own width beside it.
     The chevron lives in .textCol, left of the slot.

     9 configs = 2 widths (200/280) x 2 row kinds (session: 1 action button
     / project: 2) x right-slot occupants (present / absent - the absent
     case is the title column's unbounded-growth worst case), plus a 280px
     "Not started" session whose occupant is WIDER than the menu (the one
     config where the menu does not fill the shared cell). Each config is
     rendered twice - a resting copy and a copy case.json forces :hover on
     (docs/testing.md: each state gets its own copy of the markup, so one
     measurement covers both with a resting control). The title is long
     enough to ellipsize at both widths. -->
<div class="fixtures"></div>
<script>
const TITLE = "Fix the flaky retry backoff timing test";
const CHEVRON_SVG = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false" style="display:block"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>';

function chevronHtml(id) {
  return `<button type="button" class="chevronButton" id="chev-${id}" aria-hidden="true" tabindex="-1">${CHEVRON_SVG}</button>`;
}

function kebabHtml(id, label) {
  return `<div class="root"><button type="button" class="trigger triggerQuiet" id="kebab-${id}" aria-haspopup="menu" aria-expanded="false" tabindex="-1"><span aria-hidden="true">&#8943;</span><span class="srOnly">Actions for ${label}</span></button></div>`;
}

// SessionRow anatomy (RailRow.tsx): textCol(titleLine(label, chevron)), then
// the shared .rightSlot cell: the occupant (.time / .notStarted / nothing)
// and .actions holding SessionMenuRow's single Menu trigger.
function sessionRowHtml(id, occupant) {
  const occ =
    occupant === "time"
      ? `<span class="time" id="occ-${id}">2h</span>`
      : occupant === "notStarted"
        ? `<span class="notStarted" id="occ-${id}">Not started</span>`
        : "";
  return `
    <span class="railRow" id="row-${id}">
      <span class="textCol">
        <span class="titleLine">
          <span class="label" id="label-${id}">${TITLE}</span>
          ${chevronHtml(id)}
        </span>
      </span>
      <span class="rightSlot" id="slot-${id}">
        ${occ}
        <span class="actions" id="actions-${id}">
          ${kebabHtml(id, TITLE)}
        </span>
      </span>
    </span>`;
}

// ProjectRow anatomy (RailRow.tsx): textCol(titleLine(label, chevron)), then
// the shared .rightSlot cell: the rollup Badge (or nothing) and .actions
// holding the "+" IconButton (button quiet sm = button.module.css's base +
// quiet with iconbutton.module.css's sm square, exactly the classes the real
// IconButton computes) and the Menu trigger - a project row's menu is WIDER
// than a session row's (two buttons instead of one), so it's the wider
// danger zone for the shared cell.
function projectRowHtml(id, withBadge) {
  const badge = withBadge ? `<span class="badge attention" id="occ-${id}">3</span>` : "";
  return `
    <span class="railRow" id="row-${id}">
      <span class="textCol">
        <span class="titleLine">
          <span class="label" id="label-${id}">${TITLE}</span>
          ${chevronHtml(id)}
        </span>
      </span>
      <span class="rightSlot" id="slot-${id}">
        ${badge}
        <span class="actions" id="actions-${id}">
          <button type="button" class="button quiet sm" id="plus-${id}" aria-label="New session in ${TITLE}">
            <span class="icon" aria-hidden="true">+</span>
          </button>
          ${kebabHtml(id, TITLE)}
        </span>
      </span>
    </span>`;
}

const CONFIGS = [
  { key: "s200ts", width: 200, kind: "session", occupant: "time", label: "200px session, timestamp" },
  { key: "s200nt", width: 200, kind: "session", occupant: null, label: "200px session, no occupant (worst case)" },
  { key: "s280ts", width: 280, kind: "session", occupant: "time", label: "280px session, timestamp" },
  { key: "s280nt", width: 280, kind: "session", occupant: null, label: "280px session, no occupant (worst case)" },
  { key: "s280ns", width: 280, kind: "session", occupant: "notStarted", label: "280px session, Not started (occupant wider than the menu)" },
  { key: "p200b", width: 200, kind: "project", badge: true, label: "200px project, with badge" },
  { key: "p200nb", width: 200, kind: "project", badge: false, label: "200px project, no badge (worst case)" },
  { key: "p280b", width: 280, kind: "project", badge: true, label: "280px project, with badge" },
  { key: "p280nb", width: 280, kind: "project", badge: false, label: "280px project, no badge (worst case)" },
];

// One copy per state: -r is measured at rest, -h has :hover forced by
// case.json's forcePseudoStates.
const FIXTURES = CONFIGS.flatMap((c) => [
  { ...c, id: `${c.key}-r`, state: "rest" },
  { ...c, id: `${c.key}-h`, state: "hover" },
]);

const root = document.querySelector(".fixtures");
for (const f of FIXTURES) {
  const section = document.createElement("div");
  section.className = "fixture";
  const label = document.createElement("div");
  label.className = "fixtureLabel";
  label.textContent = `${f.label} - ${f.state} (#${f.id})`;
  const box = document.createElement("div");
  box.className = "railBox";
  box.style.width = `${f.width}px`;
  box.innerHTML = f.kind === "session" ? sessionRowHtml(f.id, f.occupant) : projectRowHtml(f.id, f.badge);
  section.append(label, box);
  root.append(section);
}

// Horizontal+vertical intersection of two DOMRects, or null if they don't
// overlap. Both callers only care whether two *sibling* controls' hit boxes
// share pixels, so this is a plain rectangle intersection, not a containment
// or ordering check.
function intersect(a, b) {
  const left = Math.max(a.left, b.left);
  const right = Math.min(a.right, b.right);
  const top = Math.max(a.top, b.top);
  const bottom = Math.min(a.bottom, b.bottom);
  if (right <= left || bottom <= top) return null;
  return { left, right, top, bottom, width: right - left, height: bottom - top };
}

// Who ACTUALLY receives a click at a rect's center - not inferred from
// z-index arithmetic, but asked of the browser's own hit-testing
// (elementFromPoint, sampled at the rect's center - away from any rounded
// corners on the trigger button). Returns "chevron", "kebab", "plus",
// "occupant" (the slot's timestamp/"Not started"/Badge), or "other" (the
// .rightSlot/.railRow background, etc). Note what this proves in each state:
// at rest a HIDDEN menu button must not win its own pixels (visibility:
// hidden removes it from hit-testing - opacity alone never would); revealed,
// it must.
function winnerAt(rect) {
  const cx = (rect.left + rect.right) / 2;
  const cy = (rect.top + rect.bottom) / 2;
  const el = document.elementFromPoint(cx, cy);
  if (!el) return "none";
  if (el.closest(".chevronButton")) return "chevron";
  if (el.closest(".trigger")) return "kebab";
  if (el.closest("[id^='plus-']")) return "plus";
  if (el.closest(".time") || el.closest(".notStarted") || el.closest(".badge")) return "occupant";
  return "other";
}

function box(el) {
  const r = el.getBoundingClientRect();
  return { left: r.left, right: r.right, top: r.top, bottom: r.bottom, width: r.width, height: r.height };
}

window.measure = () => {
  return FIXTURES.map((f) => {
    const chevron = box(document.getElementById(`chev-${f.id}`));
    const kebab = box(document.getElementById(`kebab-${f.id}`));
    const plusEl = document.getElementById(`plus-${f.id}`);
    const plus = plusEl ? box(plusEl) : null;
    const occEl = document.getElementById(`occ-${f.id}`);
    const occupant = occEl ? box(occEl) : null;
    const slot = box(document.getElementById(`slot-${f.id}`));
    const actions = box(document.getElementById(`actions-${f.id}`));

    const kebabOverlap = intersect(chevron, kebab);
    const plusOverlap = plus ? intersect(chevron, plus) : null;

    return {
      id: f.id,
      label: f.label,
      state: f.state,
      width: f.width,
      chevron,
      kebab,
      plus,
      occupant,
      slot,
      actions,
      kebabOverlap,
      plusOverlap,
      // Each control's OWN center must resolve as the state demands - see
      // winnerAt's comment for the per-state contract. The chevron's center
      // must resolve to the chevron in BOTH states (it is never covered);
      // the occupant's must resolve to the occupant at rest and to
      // NOT-the-occupant revealed (the menu covers it).
      chevronSelfWinner: winnerAt(chevron),
      kebabSelfWinner: winnerAt(kebab),
      plusSelfWinner: plus ? winnerAt(plus) : null,
      occupantSelfWinner: occupant ? winnerAt(occupant) : null,
    };
  });
};
</script>
</body>
</html>
