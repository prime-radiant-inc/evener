<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pane-body-composer-gap layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  *, *::before, *::after { transition: none !important; animation: none !important; box-sizing: border-box; }
  /* overflow: hidden keeps the document unscrollable, so a clipped fixture
     cannot fake a shorter page; the assertion below rejects a page whose
     content does not fit the viewport either way. */
  html, body { margin: 0; overflow: hidden; background: var(--surface-0); font-family: var(--font-sans); color: var(--ink-hi); }
  .fixtures { display: flex; flex-direction: column; gap: 8px; }
  .fixtureLabel { color: var(--ink-low); font: var(--font-size-caption) var(--font-mono); }

  /* A real PaneScaffold column: fixed header, flexing .body, docked .footer -
     the same sibling shape PaneScaffold.tsx renders. */
  .pane {
    display: flex;
    flex-direction: column;
    height: 260px;
    overflow: hidden;
    background: var(--surface-0);
  }

  /* The transcript's essential contract inside the body: PaneScaffold's .body
     is a plain block and the transcript fills it by height, then scrolls its
     own rows (session.module.css .transcriptBody). Whatever the body adds or
     loses below the last row shows up as a band above the docked footer. */
  .scrollport { height: 100%; overflow-y: auto; }
  .row { height: 40px; border-bottom: 1px solid var(--edge); }
  .lastRow { height: 24px; display: flex; align-items: center; color: var(--ink-mid); font-size: var(--font-size-caption); }

  /* Stand-in for the docked composer: only its top edge is measured. */
  .composerStandIn { height: 64px; }
</style>
</head>
<body data-font-size="m">
<!-- Two fixtures per width: one docks a footer below the body (the session
     pane: composer + status row), the other has none (welcome, settings,
     spawn, doc) - the case the body's end-of-scroll inset exists for. -->
<main class="fixtures"></main>
<script>
const fixtures = __LAYOUTGUARD_WIDTH_MATRIX__;

function paneHtml(docked) {
  const rows = '<div class="row"></div>'.repeat(40);
  const footer = docked ? '<div class="footer" data-footer><div class="composerStandIn"></div></div>' : "";
  return `
    <div class="pane" data-pane="${docked ? "docked" : "footerless"}">
      <div class="header"><h2 class="title">Session</h2></div>
      <div class="body" data-pane-scaffold="session:local:frame">
        <div class="scrollport" data-scrollport>
          ${rows}
          <div class="lastRow" data-lastrow>Done in 27s</div>
        </div>
      </div>
      ${footer}
    </div>`;
}

const root = document.querySelector(".fixtures");
for (const spec of fixtures) {
  const section = document.createElement("section");
  section.className = "fixture";
  section.style.width = `${spec.width}px`;
  const label = document.createElement("div");
  label.className = "fixtureLabel";
  label.textContent = `${spec.width}px`;
  section.append(label);
  section.insertAdjacentHTML("beforeend", paneHtml(true));
  section.insertAdjacentHTML("beforeend", paneHtml(false));
  root.append(section);
}

// Enough rows that every scroll port overflows several times over, so each one
// settles at a true bottom rather than trivially at a 0px gap.
for (const port of document.querySelectorAll("[data-scrollport]")) port.scrollTop = port.scrollHeight;

window.measure = () => {
  const pane = (selector) => {
    const root = document.querySelector(selector);
    const scrollport = root.querySelector("[data-scrollport]");
    const body = root.querySelector("[data-pane-scaffold]");
    const footer = root.querySelector("[data-footer]");
    const lastRow = root.querySelector("[data-lastrow]");
    return {
      // The band a reader sees: empty space below the last row, up to the
      // surface that follows the body - the docked footer's top hairline, or
      // the body's own bottom edge when nothing docks below it.
      gapToFollowing:
        (footer ? footer.getBoundingClientRect().top : body.getBoundingClientRect().bottom) -
        lastRow.getBoundingClientRect().bottom,
      bodyPaddingBottom: Number.parseFloat(getComputedStyle(body).paddingBottom),
      atBottom: Math.abs(scrollport.scrollHeight - scrollport.clientHeight - scrollport.scrollTop) < 2,
    };
  };
  return {
    viewportHeight: document.documentElement.clientHeight,
    // A clipped fixture would make every reading below meaningless.
    documentHeight: document.documentElement.scrollHeight,
    // The clearance the tokens declare for this breakpoint: --space-5 on
    // desktop, --space-4 below 900px (panescaffold.module.css's mobile .body).
    // Read from tokens.css, never from the scaffold rule under test.
    expectedInset: Number.parseFloat(
      getComputedStyle(document.body).getPropertyValue(
        matchMedia("(max-width: 899px)").matches ? "--space-4" : "--space-5",
      ),
    ),
    docked: pane('[data-pane="docked"]'),
    footerless: pane('[data-pane="footerless"]'),
  };
};
</script>
</body>
</html>
