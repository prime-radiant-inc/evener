<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>button-label-nowrap layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  body {
    margin: 0;
    background: var(--surface-1);
    font-family: var(--font-sans);
  }
  /* Reproduces the squeeze that broke the credentials settings header: a
     space-between flex row whose max-width narrative sibling left the button
     narrower than its label, so "+ Add provider instance" wrapped onto three
     lines and spilled out of the fixed 32px .md box. The row/paragraph styles
     are scaffolding kept HERE (the real section no longer has the narrative);
     the declaration under test is button.module.css's
     .button { white-space: nowrap }. */
  .page {
    width: 700px;
    box-sizing: border-box;
    padding: var(--space-4);
  }
  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
  }
  .sibling {
    margin: 0;
    max-width: 640px;
    color: var(--ink-mid);
    font-size: var(--font-size-ui);
  }
</style>
</head>
<body data-font-size="m">
<div class="page">
  <div class="row">
    <p class="sibling">
      Provider instances and their credentials. Keys are stored in
      <code>~/.serf/credentials.toml</code> (chmod 600). Env vars in the hub
      process take precedence only when no file entry exists. The UI never
      displays stored values.
    </p>
    <button id="add-instance" class="button primary md" type="button">+ Add provider instance</button>
  </div>
</div>
<script>
window.measure = () => {
  const btn = document.querySelector('#add-instance');
  const rect = btn.getBoundingClientRect();
  return {
    box: { width: rect.width, height: rect.height },
    clientHeight: btn.clientHeight,
    scrollHeight: btn.scrollHeight,
    // Positive = the label wrapped onto multiple lines and now overflows the
    // fixed-height box vertically - the exact symptom from the screenshot.
    verticalOverflow: btn.scrollHeight - btn.clientHeight,
    // Secondary, informational: horizontal spill would mean the button was
    // shrink-wrapped below its label instead of the sibling yielding.
    horizontalOverflow: btn.scrollWidth - btn.clientWidth,
  };
};
</script>
</body>
</html>
