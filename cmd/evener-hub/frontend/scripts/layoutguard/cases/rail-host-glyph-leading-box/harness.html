<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>rail-host-glyph-leading-box layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  body { margin: 0; background: var(--surface-1); font-family: var(--font-sans); }
  #root { width: 280px; box-sizing: border-box; }
</style>
</head>
<body data-font-size="m">
<div id="root"></div>
<script type="module">
// Compare the real host rail row and the real activity watch row. Their CSS
// modules keep distinct row classes while the drawn glyphs share a 13px box.
window.measure = async () => {
  const [{ createElement }, { createRoot }, { flushSync }, { Tree }, { RailRow }, { WatchRow }, { buildWatchRows }] = await Promise.all([
    import("react"),
    import("react-dom/client"),
    import("react-dom"),
    import("/src/widgets/tree/index.tsx"),
    import("/src/shell/rail/RailRow.tsx"),
    import("/src/shell/activitybar/activityRows.tsx"),
    import("@evener/appwire-client"),
  ]);
  const host = { id: "host:devbox", kind: "host", host: { id: "devbox", label: "devbox", online: true }, children: [] };
  const watch = {
    ownerRef: "local:session", receiverRef: "local:session", state: "armed",
    watch: { id: "clock", source: "job:refresh", active: true, deliveries: 0, createdAt: "2026-09-30T12:00:00Z" },
  };
  const [watchRow] = buildWatchRows([watch]);
  const root = createRoot(document.getElementById("root"));
  flushSync(() => root.render(createElement("div", null,
    createElement(Tree, {
      nodes: [host], onActivate: () => {}, onToggle: () => {},
      renderRow: (node, info) => createElement(RailRow, { node, info, actions: {} }),
    }),
    createElement(WatchRow, { row: watchRow, now: Date.parse("2026-09-30T12:01:00Z") }),
  )));
  await document.fonts.ready;
  const box = (testId) => {
    const element = document.querySelector(`[data-testid="${testId}"]`);
    if (!element) throw new Error(`glyph harness missing actual ${testId}`);
    const r = element.getBoundingClientRect();
    return { left: r.left, right: r.right, top: r.top, bottom: r.bottom, width: r.width, height: r.height };
  };
  return { watchGlyph: box("sidebar-watch-clock"), hostGlyph: box("rail-row-host-glyph") };
};
</script>
</body>
</html>
