<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>delegate-open-widget-inline layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  /* Transitions OFF (docs/testing.md): the assertion reads line placement via
     top-edge equality, which a chevron rotation transition does not move - but
     a hover fade on the trigger's ink wash could repaint mid-measure. Settled
     is what we want. */
  *, *::before, *::after { transition: none !important; }
  body {
    margin: 0;
    background: var(--surface-1);
    font-family: var(--font-sans);
    color: var(--ink-hi);
  }
  .fixtures { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 12px; }
  .fixtureLabel { color: var(--ink-low); font: var(--font-size-caption) var(--font-mono); margin-bottom: 2px; }
  /* The row sits inside runContent's --speaker-gutter padding in production;
     a transcript column is what bounds it. Reproduce both a narrow
     transcript column (420px) and a comfortable desktop width (880px) by
     wrapping .row in a box of that width. The row's own .rowIcon negative
     margin (pulling into the gutter) is irrelevant to whether the trigger
     and the trailing control share a line, so the icon is omitted for
     clarity - its slot is not a flex item that affects the wrap decision. */
  .railBox { box-sizing: border-box; padding-left: var(--speaker-gutter); }
</style>
</head>
<body data-font-size="m">
<!-- Reproduces ToolRow.tsx's intent-only expandable branch (the delegate /
     subagent card) against the REAL classes from
     panes/session/transcript/toolcallitem.module.css and
     widgets/button/button.module.css,
     widgets/iconbutton/iconbutton.module.css, and
     widgets/openbutton/openbutton.module.css:

       <div class="row" data-intent="true" data-intent-trailing="true">
         <button class="trigger intentOverlayTrigger"></button>
         <span class="intentTriggerContent"><span class="intent">{statedIntent}</span></span>
         <span class="intentTrailing">{trailing open control}</span>
         <span class="chevron"><Chevron/></span>
       </div>

     The trailing control is the icon-only OpenButton the delegate row renders
     (OpenTranscriptButton -> OpenButton -> span.inline shell around an
     IconButton variant="quiet" size="sm" - 28px square, box-arrow OpenIcon,
     no visible word), reproduced with the widgets' real classes. The .inline
     shell is the full hit size; its negative margin-block hands exactly 1em
     back to layout, so the row stays one text line tall. iconbutton.module.css
     must follow button.module.css in cssFiles: both define a plain .sm, and
     the icon-only square sizing (padding:0) only wins the cascade second.

     The visible sibling order is text → Open → chevron. The empty trigger is
     absolutely overlaid across the line, so it remains the one keyboard/click
     disclosure target while the nested Open button stays a valid sibling and
     opts back into pointer input. Two intent lengths x two column widths:
       short intent - already fits beside the control, so it is inline
         regardless of the trigger's flex-basis (it is not the binding case,
         but it must not regress either) AND the control hugs the intent's
         end (adjacency: the guard against flex-grow springing it to the
         line's far end);
       long intent  - the binding case: with flex-basis:auto it claims its
         max-content width and pushes the control to line 2; with flex-basis:0
         it wraps INSIDE the trigger and the control stays on line 1 - the
         max-width reservation is what clamps the base size so the wrap
         happens inside the trigger rather than ahead of the control.

     The measure reports each fixture's trigger and control top edges (and
     whether they share a line) so the assert is font- and platform-independent:
     line membership is decided against the trigger's first line box (a Range
     over the intent text), not a pixel-position snapshot. -->
<div class="fixtures"></div>
<script>
// The real Chevron widget's "right" path (widgets/chevron/index.tsx), 14px box.
const CHEVRON_SVG = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" style="display:block"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>';

// The real OpenIcon (widgets/openbutton/index.tsx), 14px box, currentColor so
// the quiet Button's ink is what it inherits in production.
const OPEN_SVG = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" style="display:block"><path d="M12.5 8.5V12.5H3.5V3.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path><path d="M8 8L13 3M9.5 3H13V6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>';

// ToolRow.tsx's intent-only expandable branch: one overlay trigger owns the
// disclosure while visible trigger content, Open, and chevron are siblings.
// `combined` adds the two-level body trigger (bodyTriggerOnIntentLine): the
// row marks itself data-body-trigger-intent and the body chevron rides LAST,
// after the decorative chevron - and must be raised above the overlay or its
// clicks toggle the wrong disclosure.
function delegateRowHtml(id, intent, combined) {
  return `
    <div class="row" id="row-${id}" data-intent="true" data-intent-trailing="true"${combined ? ' data-body-trigger-intent="true"' : ""}>
      <button type="button" class="trigger intentOverlayTrigger" id="trigger-${id}" aria-expanded="false" aria-label="${intent}"></button>
      <span class="intentTriggerContent" id="trigger-content-${id}">
        <span class="intent" id="intent-${id}">
          ${intent}
        </span>
      </span>
      <span class="intentTrailing" id="trailing-${id}">
        <span class="inline" data-open-shell>
          <button type="button" class="button quiet sm" id="open-${id}" aria-label="Open transcript" title="Open">
            <span class="icon" aria-hidden="true">${OPEN_SVG}</span>
          </button>
        </span>
      </span>
      <span class="chevron" id="chevron-${id}" aria-hidden="true" data-open="false">${CHEVRON_SVG}</span>
      ${combined ? `<button type="button" class="bodyTrigger" id="bodytrigger-${id}" aria-expanded="true" aria-label="${intent}"><span class="chevron" aria-hidden="true" data-open="true">${CHEVRON_SVG}</span></button>` : ""}
    </div>`;
}

const SHORT_INTENT = "Scout the frontend for the open-widget renderer.";
// Long enough that at a 420px transcript column the intent alone is wider
// than (column - control): the binding case where flex-basis decides the wrap.
const LONG_INTENT = "Locate the delegate row renderer in the transcript pane, trace how its trailing open-transcript control is composed against the disclosure trigger, and confirm the inline placement holds when the stated intent wraps across more than one line inside the row.";

const CONFIGS = [
  { key: "narrow-short",  width: 420, intent: SHORT_INTENT, shortIntent: true,  label: "420px column, short intent (fits beside the control)" },
  { key: "narrow-long",  width: 420, intent: LONG_INTENT,  shortIntent: false, label: "420px column, long intent (binding: must wrap inside the trigger)" },
  { key: "wide-short",   width: 880, intent: SHORT_INTENT, shortIntent: true,  label: "880px column, short intent" },
  { key: "wide-long",    width: 880, intent: LONG_INTENT,  shortIntent: false, label: "880px column, long intent (binding)" },
  { key: "narrow-combined", width: 420, intent: LONG_INTENT, shortIntent: false, combined: true, label: "420px column, long intent + body trigger on the intent line (combined)" },
  { key: "wide-combined",   width: 880, intent: SHORT_INTENT, shortIntent: true, combined: true, label: "880px column, short intent + body trigger on the intent line (combined)" },
];

const root = document.querySelector(".fixtures");
for (const c of CONFIGS) {
  const section = document.createElement("div");
  section.className = "fixture";
  const label = document.createElement("div");
  label.className = "fixtureLabel";
  label.textContent = `${c.label} (#${c.key})`;
  const box = document.createElement("div");
  box.className = "railBox";
  box.style.width = `${c.width}px`;
  box.innerHTML = delegateRowHtml(c.key, c.intent, c.combined === true);
  section.append(label, box);
  root.append(section);
}

function box(el) {
  const r = el.getBoundingClientRect();
  return { left: r.left, right: r.right, top: r.top, bottom: r.bottom, width: r.width, height: r.height };
}

// The trigger's FIRST line box. The row uses align-items:baseline, so two
// siblings on the SAME flex line have different top edges (a 28px-tall
// button baseline-aligns above an italic text line -> its top is HIGHER,
// not lower). A naive top-equality test misreads that baseline offset as a
// wrap. Line membership is decided instead against the trigger's own first
// line: a Range over the intent text yields that line's fragments (their
// union is line 1 - see firstLineBox). The control shares line 1 iff it
// starts WITHIN or ABOVE
// that line (its top is below the line-1 bottom by only sub-pixel noise);
// once it wraps to line 2 its top sits at the line-1 bottom (the row's
// row-gap is 0, so flex line 2 begins exactly where line 1 ends). Font- and
// platform-independent: no line-height constant, no pixel snapshot.
function firstLineBox(intentEl) {
  const range = document.createRange();
  range.selectNodeContents(intentEl);
  const rects = range.getClientRects();
  // An intent with no text would return nothing; the harness always has one.
  const first = rects[0];
  // getClientRects returns one rect PER TEXT FRAGMENT. Union only text
  // fragments on line 1: the chevron is deliberately a sibling after Open,
  // and including it here was the old guard bug that blessed text → chevron →
  // Open while claiming to measure adjacency from the intent text.
  let right = first.right;
  for (const r of rects) {
    if (r.top < first.bottom && r.bottom > first.top) right = Math.max(right, r.right);
  }
  return { top: first.top, bottom: first.bottom, left: first.left, right };
}

window.measure = () => {
  return CONFIGS.map((c) => {
    const row      = document.getElementById(`row-${c.key}`);
    const trigger  = box(document.getElementById(`trigger-${c.key}`));
    const triggerContent = box(document.getElementById(`trigger-content-${c.key}`));
    const trailing = box(document.getElementById(`trailing-${c.key}`));
    const open     = box(document.getElementById(`open-${c.key}`));
    const chevron  = box(document.getElementById(`chevron-${c.key}`));
    const intentEl = document.getElementById(`intent-${c.key}`);
    const intent   = box(intentEl);
    const line1    = firstLineBox(intentEl);
    // Same line: the control's top is within line 1 (allowing baseline
    // alignment to pull it ABOVE line1.top, and sub-pixel noise). Wrapped:
    // the control's top reaches line 1's bottom (it starts on line 2). The
    // 1px tolerance absorbs rounding where line 2 meets line 1's bottom.
    const sameLine = open.top < line1.bottom - 1;
    // Adjacency: how far the control's left edge sits past the trigger's
    // line-1 TEXT right edge (a Range rect; never the chevron). flex:0 1 auto
    // keeps the visible trigger content hugging its text, so the
    // gap is exactly the row's column-gap; a growing trigger would spring
    // the control to the line's far end (a gap far larger than the
    // column-gap). The row's computed column-gap is measured, not assumed.
    const columnGap = parseFloat(getComputedStyle(row).columnGap);
    const controlLeftGap = open.left - line1.right;
    const chevronHit = document.elementFromPoint(chevron.left + chevron.width / 2, chevron.top + chevron.height / 2);
    const openElement = document.getElementById(`open-${c.key}`);
    const openHit = document.elementFromPoint(open.left + open.width / 2, open.top + open.height / 2);
    // Combined fixtures only: the body chevron shares the line with the
    // overlay trigger and must be raised above it, or its clicks toggle the
    // wrong disclosure.
    const bodyTriggerElement = document.getElementById(`bodytrigger-${c.key}`);
    let bodyTriggerHitIsBodyTrigger;
    if (bodyTriggerElement) {
      const bt = box(bodyTriggerElement);
      const bodyHit = document.elementFromPoint(bt.left + bt.width / 2, bt.top + bt.height / 2);
      bodyTriggerHitIsBodyTrigger = Boolean(bodyHit && bodyTriggerElement.contains(bodyHit));
    }
    return {
      id: c.key,
      label: c.label,
      width: c.width,
      shortIntent: c.shortIntent,
      trigger,
      triggerContent,
      trailing,
      open,
      chevron,
      intent,
      line1,
      sameLine,
      // How far the control's top sits below line 1's bottom, for the assert's
      // reason: 0 (or negative) = inline; >0 = dropped to a later line.
      dropBelowLine1: open.top - line1.bottom,
      columnGap,
      controlLeftGap,
      controlPrecedesChevron: open.right <= chevron.left + 1,
      chevronLeftGap: chevron.left - open.right,
      chevronHitIsTrigger: Boolean(chevronHit && document.getElementById(`trigger-${c.key}`).contains(chevronHit)),
      openHitIsOpen: Boolean(openHit && openElement.contains(openHit)),
      bodyTriggerHitIsBodyTrigger,
    };
  });
};
</script>
</body>
</html>
