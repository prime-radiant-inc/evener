<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toolrun-corner-clip-phone layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  *, *::before, *::after { transition: none !important; animation: none !important; }
  body {
    margin: 0;
    background: var(--surface-0);
    font-family: var(--font-sans);
    color: var(--ink-hi);
  }
  .fixtures { display: flex; flex-direction: column; gap: 32px; padding: 24px 12px; }
</style>
</head>
<body data-font-size="m">
<!-- A ToolRunGroup is a Disclosure inside TurnBlock's standalone run segment.
     case.json prefixes the Disclosure and ToolRow classes so their summary,
     body and chevron rules stay independent as they do in the product. -->
<main class="fixtures">
  <div class="toolRunSegment" data-tool-card="only">
    <details class="disclosure-details" id="open" data-testid="tool-run" data-variant="default" open>
      <summary class="disclosure-summary summary" id="open-summary"><span class="disclosure-chevron" aria-hidden="true"><svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" data-open="true" style="display: block;"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg></span><span class="label">Wrote 2 files</span></summary>
      <div class="disclosure-body">
        <div class="body">
          <div class="toolcall-call" data-testid="tool-call-item" data-row-fixture="collapsed"></div>
        </div>
      </div>
    </details>
  </div>
  <div class="toolRunSegment" data-tool-card="only">
    <details class="disclosure-details" id="banded" data-testid="tool-run" data-variant="default" open>
      <summary class="disclosure-summary summary"><span class="disclosure-chevron" aria-hidden="true"><svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" data-open="true" style="display: block;"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg></span><span class="label">Wrote 2 files</span></summary>
      <div class="disclosure-body">
        <div class="body">
          <div class="toolcall-call" data-testid="tool-call-item" data-row-fixture="expanded"></div>
        </div>
      </div>
    </details>
  </div>
</main>
<script type="module">
import { mountToolRows, measureToolRows } from "/scripts/layoutguard/cases/toolcard-corner-clip-phone/row-contracts.mjs";
mountToolRows("toolcall-");
window.measure = () => ({
  ...measureToolRows(),
  firstRowGap: document.querySelector('#open [data-testid="tool-call-item"]').getBoundingClientRect().top -
    document.getElementById("open-summary").getBoundingClientRect().bottom,
});
</script>
</body>
</html>
