<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>transcript rail icon seats layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  *, *::before, *::after { box-sizing: border-box; transition:none !important; animation:none !important; }
  html, body { margin:0; background:var(--surface-0); color:var(--ink-hi); }
  body { padding:20px; font-family:var(--font-sans); font-size:var(--font-size-body); line-height:var(--line-height-body); }
  .fixtures { display:flex; flex-direction:column; gap:16px; }
  iframe { border:0; height:520px; }
</style>
</head>
<body data-font-size="m">
<div class="fixtures"></div>
<script>
const BULB_SVG = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" style="display:block"><path d="M8 2.5 A3.8 3.8 0 0 0 5.8 9.1 C6.4 9.8 6.6 10.4 6.6 11 L6.6 11.6 H9.4 L9.4 11 C9.4 10.4 9.6 9.8 10.2 9.1 A3.8 3.8 0 0 0 8 2.5 Z M6.6 13.2 H9.4 M7.1 14.7 H8.9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>';
const CHECK_SVG = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" style="display:block"><path d="M3.2 8.6 L6.5 11.9 L12.8 4.4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>';
const TERM_SVG = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" style="display:block"><path d="M2.5 3.5 H13.5 V12.5 H2.5 Z M5 6.8 L7.5 8.8 L5 10.8 M8.6 10.8 H11.2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>';
const STEER_SVG = '<svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false" style="display:block"><path d="M5 1 L9 5 L5 9 L1 5 Z" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg>';
const CROSS_SVG = '<svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true" focusable="false" style="display:block"><path d="M1.5 1.5 L8.5 8.5 M8.5 1.5 L1.5 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>';
const CHEVRON_SVG = '<svg class="chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false" style="display:block"><path d="M6 3.5 L10.5 8 L6 12.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></svg>';

// Every railed transcript row, rendered with the REAL production CSS modules
// (de-scoped and collision-prefixed in resolved.css via case.json).
function rows() {
  return `
    <div class="turn" data-turn>
      <div class="runContent">
        <div data-content-probe style="height:0"></div>

        <!-- 1. Live thought -->
        <div class="think-block">
          <div class="think-live">
            <span class="think-label">
              <span class="think-icon" data-slot="think-live">${BULB_SVG}</span>
              <span data-text="think-live">Thinking…</span>
            </span>
          </div>
        </div>

        <!-- 2. Compact settled thought (CSS Modules emits both composed .label and .compactSummary) -->
        <div class="think-block">
          <details class="disclosure-details" data-variant="quiet">
            <summary class="disclosure-summary">
              <span class="think-label think-compactSummary">
                <span class="think-icon" data-slot="think-compact">${BULB_SVG}</span>
                <span class="think-summaryText" data-text="think-compact">Thought · ~17 tokens</span>
              </span>
              <span class="disclosure-chevron" aria-hidden="true">${CHEVRON_SVG}</span>
            </summary>
          </details>
        </div>

        <!-- 3. Full settled thought -->
        <div class="think-block">
          <details class="disclosure-details" data-variant="quiet">
            <summary class="disclosure-summary">
              <span class="think-summaryIcon" data-slot="think-settled">${BULB_SVG}</span>
              <span class="think-summaryText" data-text="think-settled">Thought · 3s · Checking alignment</span>
              <span class="disclosure-chevron" aria-hidden="true">${CHEVRON_SVG}</span>
            </summary>
          </details>
        </div>

        <!-- 4. Compact live thought (Loader rail) -->
        <div class="think-block">
          <span class="loader-loader loader-rail" role="status" aria-label="Thinking…">
            <span class="loader-grid" data-slot="loader">${'<span class="loader-cell"></span>'.repeat(9)}</span>
            <span class="loader-label" data-text="loader">Thinking… · ~679 tokens</span>
          </span>
        </div>

        <!-- 5. Static notification head -->
        <div class="notif-staticHead">
          <span class="notif-statusIcon" data-slot="notif-static">${CHECK_SVG}</span>
          <span class="notif-headingText"><span class="notif-title" data-text="notif-static">Job completed</span></span>
        </div>

        <!-- 6. Collapsible notification (container-type: inline-size + open expanded body) -->
        <div class="notif-collapsible">
          <div class="notif-disclosure">
            <details class="disclosure-details" data-variant="quiet" open>
              <summary class="disclosure-summary">
                <span class="notif-statusIcon" data-slot="notif-collapsible">${CHECK_SVG}</span>
                <span class="notif-headingText"><span class="notif-title" data-text="notif-collapsible">Delegate completed</span></span>
                <span class="disclosure-chevron" aria-hidden="true">${CHEVRON_SVG}</span>
              </summary>
              <div class="disclosure-body">
                <div class="notif-expanded" data-notif-expanded>Expanded notification body</div>
              </div>
            </details>
          </div>
        </div>

        <!-- 7. Steering divider -->
        <details class="disclosure-details" data-variant="quiet">
          <summary class="disclosure-summary">
            <span class="steer-railIcon" data-slot="steering">${STEER_SVG}</span>
            <span class="steer-label" data-text="steering">System steered: context</span>
            <span class="disclosure-chevron" aria-hidden="true">${CHEVRON_SVG}</span>
          </summary>
        </details>

        <!-- 8. Tool call row (intent + demoted summary line) -->
        <div class="toolcall-call">
          <div class="toolcall-row" data-intent="true">
            <span class="toolcall-rowIconSlot">
              <span class="toolcall-rowIcon" data-slot="tool-call" aria-hidden="true">${TERM_SVG}</span>
            </span>
            <span class="toolcall-intent" data-text="tool-call">Checking layout alignment</span>
            <div class="toolcall-summaryLine">
              <span class="toolcall-summary toolcall-demoted" data-tool-demoted>Ran npm run layoutguard</span>
            </div>
          </div>
        </div>

        <!-- 9. Folded tool run summary -->
        <details class="disclosure-details" data-variant="default">
          <summary class="disclosure-summary toolrun-summary">
            <span class="toolrun-railChevron" data-slot="tool-run" aria-hidden="true">${CHEVRON_SVG}</span>
            <span class="toolrun-label" data-text="tool-run">3 actions — Read, Edit, Shell</span>
          </summary>
        </details>

        <!-- 10. Turn failure notice -->
        <div class="sys-failure">
          <span class="sys-failureIcon" data-slot="turn-failure">${CROSS_SVG}</span>
          <span class="sys-failureText" data-text="turn-failure">Provider rejected the request</span>
        </div>
      </div>
    </div>`;
}

const ROW_KEYS = [
  "think-live",
  "think-compact",
  "think-settled",
  "loader",
  "notif-static",
  "notif-collapsible",
  "steering",
  "tool-call",
  "tool-run",
  "turn-failure",
];

function frameDocument(mode) {
  const width = mode === "phone" ? 390 : 920;
  const turnWidth = mode === "phone" ? 320 : 560;
  return `<!doctype html><html lang="en" data-theme="dark"><head>
    <meta charset="utf-8"><meta name="viewport" content="width=${width}, initial-scale=1"><base href="${location.href}">
    <link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="resolved.css">
    <style>
      *, *::before, *::after { box-sizing: border-box; transition:none !important; animation:none !important; }
      html, body { margin:0; background:var(--surface-0); color:var(--ink-hi); }
      body { padding:16px; font-family:var(--font-sans); font-size:var(--font-size-body); line-height:var(--line-height-body); }
      .turn { width:${turnWidth}px; }
    </style></head><body data-font-size="m">
    ${rows()}
    </body></html>`;
}

const specs = [{ mode:"desktop", width:920 }, { mode:"phone", width:390 }];
const frames = specs.map((spec) => {
  const frame = document.createElement("iframe");
  frame.style.width = `${spec.width}px`;
  frame.srcdoc = frameDocument(spec.mode);
  document.querySelector(".fixtures").append(frame);
  return { ...spec, frame };
});

function ready({ frame }) {
  return new Promise((resolve) => {
    const finish = () => frame.contentWindow.requestAnimationFrame(() => frame.contentWindow.requestAnimationFrame(resolve));
    if (frame.contentDocument?.readyState === "complete") finish();
    else frame.addEventListener("load", finish, { once: true });
  });
}

function box(el) { const r = el.getBoundingClientRect(); return { left:r.left, right:r.right, top:r.top, bottom:r.bottom, width:r.width, height:r.height }; }

window.measure = async () => {
  await Promise.all(frames.map(ready));
  return frames.map(({ mode, frame }) => {
    const doc = frame.contentDocument;
    const turn = box(doc.querySelector("[data-turn]"));
    const probe = box(doc.querySelector("[data-content-probe]"));
    const rowsMeasured = ROW_KEYS.map((row) => ({
      row,
      slot: box(doc.querySelector(`[data-slot="${row}"]`)),
      text: box(doc.querySelector(`[data-text="${row}"]`)),
    }));
    const toolDemoted = box(doc.querySelector("[data-tool-demoted]"));
    const notifExpanded = box(doc.querySelector("[data-notif-expanded]"));
    return {
      mode,
      viewportWidth: frame.contentWindow.innerWidth,
      turn,
      probe,
      rows: rowsMeasured,
      toolDemoted,
      notifExpanded,
    };
  });
};
</script>
</body>
</html>
