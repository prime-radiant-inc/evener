<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>askuser-history-long-label layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    padding: var(--space-4);
    background: var(--surface-0);
    color: var(--ink-hi);
    font-family: var(--font-sans);
    font-size: var(--font-size-body);
    line-height: var(--line-height-body);
  }
  .fixture { width: 320px; }
</style>
</head>
<body>
<main class="fixture">
  <!-- Mirrors askUser.tsx's read-only QuestionCard, including the flex label
       line and block detail inside the neutral outlined Card. -->
  <div class="card outlined" data-testid="ask-user-question">
    <div class="content">
      <div class="question" data-slot="question">Which recorded command range should we inspect?</div>
      <ul class="options">
        <li class="option" data-recommended="true">
          <span class="optionCopy">
            <span class="optionLead">
              <span class="optionName">cherry-pick-a323417b7c9d2e4f6a8b0c1d3e5f7a9b1c3d5e7f9-onto-release/1.4</span>
              <span class="optionRecommended">Recommended</span>
            </span>
            <span class="optionDetail">The complete unbroken label must wrap inside the historical card.</span>
          </span>
        </li>
      </ul>
    </div>
  </div>
</main>
<script>
function rectOf(element) {
  const rect = element.getBoundingClientRect();
  return { left: rect.left, right: rect.right, width: rect.width };
}

window.measure = function () {
  const card = document.querySelector('[data-testid="ask-user-question"]');
  const label = document.querySelector('.optionName');
  const range = document.createRange();
  range.selectNodeContents(label);
  return {
    card: rectOf(card),
    label: rectOf(label),
    labelLines: Array.from(range.getClientRects()).map((rect) => ({ left: rect.left, right: rect.right, width: rect.width })),
  };
};
</script>
</body>
</html>
