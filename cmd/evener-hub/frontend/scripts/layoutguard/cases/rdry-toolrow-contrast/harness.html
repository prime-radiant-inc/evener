<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rdry layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  /* Mirrors PaneScaffold's .pane background - the real surface a transcript
     row sits on (widgets/panescaffold/panescaffold.module.css). */
  body {
    margin: 0;
    background: var(--surface-1);
    font-family: var(--font-sans);
  }
</style>
</head>
<body>
<!-- The purpose-bearing row keeps the original contrast fixture. -->
<div class="row" data-testid="tool-row">
  <span class="purpose" data-testid="tool-row-purpose">Write fizzbuzz.py to disk</span>
  <span class="summary demoted" data-testid="tool-row-summary" id="demoted-line">Wrote fizzbuzz.py</span>
  <span class="chevron" aria-hidden="true">&#9656;</span>
</div>
<!-- The existing case also exercises the ordinary purpose-less disclosure
     geometry: the native trigger is a sibling of the visible summary and
     inline action controls, while its rectangle covers the whole row. -->
<div class="row" data-testid="geometry-row">
  <div class="summaryLine">
    <span class="summary" id="summary-line">Fetched <a id="summary-link" href="https://example.com/page">https://example.com/page</a></span>
    <span class="summaryTrailing"><button id="action" type="button">Open beside</button></span>
  </div>
  <button class="trigger" id="trigger" type="button" aria-expanded="false" aria-controls="disclosure-body" aria-label="Fetched https://example.com/page">
    <span class="chevron" aria-hidden="true">&#9656;</span>
  </button>
</div>
<div id="disclosure-body" hidden>Body</div>
<script>
const trigger = document.getElementById("trigger");
const action = document.getElementById("action");
let toggles = 0;
let actions = 0;
trigger.addEventListener("click", () => {
  toggles += 1;
  trigger.setAttribute("aria-expanded", String(toggles % 2 === 1));
});
action.addEventListener("click", () => {
  actions += 1;
});

window.measure = () => {
  const root = document.documentElement;
  function readTheme(themeAttr) {
    if (themeAttr === null) {
      root.removeAttribute("data-theme");
    } else {
      root.setAttribute("data-theme", themeAttr);
    }
    const demoted = getComputedStyle(document.getElementById("demoted-line"));
    const bg = getComputedStyle(document.body);
    return { fg: demoted.color, bg: bg.backgroundColor };
  }
  // No data-theme attribute at all resolves via :root's own declarations
  // (tokens.css's dark values) - the same "unset = dark" default the real
  // app ships. data-theme="light" is the explicit flip kata rdry measured.
  const dark = readTheme(null);
  const light = readTheme("light");
  const summary = document.getElementById("summary-line");
  const triggerRect = trigger.getBoundingClientRect();
  const summaryRect = summary.getBoundingClientRect();
  const actionRect = action.getBoundingClientRect();
  const summaryPoint = document.elementFromPoint(summaryRect.left + summaryRect.width / 2, summaryRect.top + summaryRect.height / 2);
  const actionPoint = document.elementFromPoint(actionRect.left + actionRect.width / 2, actionRect.top + actionRect.height / 2);
  return {
    dark,
    light,
    geometry: {
      triggerContainsSummary:
        triggerRect.left <= summaryRect.left &&
        triggerRect.right >= summaryRect.right &&
        triggerRect.top <= summaryRect.top &&
        triggerRect.bottom >= summaryRect.bottom,
      summaryHitTrigger: summaryPoint === trigger,
      actionHitAction: actionPoint === action || action.contains(actionPoint),
      toggles,
      actions,
    },
  };
};
</script>
</body>
</html>
