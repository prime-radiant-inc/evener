<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>hk8v layoutguard harness</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="resolved.css">
<style>
  body {
    margin: 0;
    padding: 16px;
    background: var(--surface-1);
    font-family: var(--font-sans);
  }
  /* .removeSlot ramps its opacity over --motion-duration-overlay
     (120ms). getComputedStyle reads the value at THIS instant, so a measure
     taken right after the pseudo-state is pinned reads the start of the ramp
     (0), not where the cascade settles. What this case asserts is which value
     the cascade settles on, so the ramp is switched off rather than waited
     out - a wait would hang forever in exactly the regression the case exists
     to catch (no rule, so no transition, so no transitionend). */
  * {
    transition: none !important;
  }
</style>
</head>
<body>
<!-- Three copies of AttachmentTile.tsx's staged-attachment tile against the
     REAL composer.module.css and IconButton (button/iconbutton.module.css)
     class names. One is left alone; CSS.forcePseudoState
     pins :hover on the second and :focus-visible on the third's remove button
     (case.json), so one page and one measurement cover all three states with
     the resting copy as the control. The image is a 4x4 two-colour PNG so the
     thumbnail has real intrinsic dimensions rather than a broken-image box. -->
<div class="chips">
  <div class="imageTile" id="resting-tile">
    <img class="imageThumbnail" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP4z/AfjhhQOEhsVA4ANSkf4Z/pjskAAAAASUVORK5CYII=" alt="shot.png">
    <div class="dimensionsOverlay">4×4</div>
    <span class="removeSlot" id="resting-slot">
      <button type="button" class="button secondary sm" id="resting-remove" aria-label="Remove shot.png"><span class="icon"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span></button>
    </span>
  </div>

  <div class="imageTile" id="hovered-tile">
    <img class="imageThumbnail" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP4z/AfjhhQOEhsVA4ANSkf4Z/pjskAAAAASUVORK5CYII=" alt="shot.png">
    <div class="dimensionsOverlay">4×4</div>
    <span class="removeSlot" id="hovered-slot">
      <button type="button" class="button secondary sm" id="hovered-remove" aria-label="Remove shot.png"><span class="icon"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span></button>
    </span>
  </div>

  <div class="imageTile" id="focused-tile">
    <img class="imageThumbnail" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAFElEQVR4nGP4z/AfjhhQOEhsVA4ANSkf4Z/pjskAAAAASUVORK5CYII=" alt="shot.png">
    <div class="dimensionsOverlay">4×4</div>
    <span class="removeSlot" id="focused-slot">
      <button type="button" class="button secondary sm" id="focused-remove" aria-label="Remove shot.png"><span class="icon"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span></button>
    </span>
  </div>
</div>
<script>
window.measure = () => {
  // The slot carries the reveal (opacity); the IconButton inside it carries
  // the focus ring.
  const read = (prefix) => {
    const slot = getComputedStyle(document.getElementById(`${prefix}-slot`));
    const button = getComputedStyle(document.getElementById(`${prefix}-remove`));
    return {
      opacity: Number(slot.opacity),
      outlineStyle: button.outlineStyle,
      outlineWidth: button.outlineWidth,
      outlineColor: button.outlineColor,
    };
  };
  // The accent the focus ring is supposed to be drawn in, resolved from the
  // real tokens.css to the same rgb() form outlineColor computes to, rather
  // than restated as a hex literal here.
  const probe = document.createElement("span");
  probe.style.color = "var(--accent)";
  document.body.appendChild(probe);
  const accent = getComputedStyle(probe).color;
  probe.remove();
  return {
    resting: read("resting"),
    hovered: read("hovered"),
    focused: read("focused"),
    accent,
  };
};
</script>
</body>
</html>
