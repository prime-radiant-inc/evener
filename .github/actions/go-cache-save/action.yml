name: Save Go caches
description: >-
  On a push to main, save the Go build cache under the key go-cache-restore
  chose, and with `modules` the shared module cache too. Everywhere else it
  does nothing: a pull request's saves are readable only by that pull
  request's branch and would crowd main's entries out of the repository's
  10GB limit. A re-run whose restore hit this commit's key exactly also skips
  that save. Put it after the job's last Go build or test step, with
  `if: ${{ !cancelled() }}` and `job-status: ${{ job.status }}`, so a failing
  step cannot leave the lane building cold on every later run.
inputs:
  job-status:
    description: >-
      The job's status when the save runs (`job.status`). Only a successful
      job trims its build cache: a job that failed partway used only part of
      what it restored, so it saves everything it restored plus what it built.
    required: true
  modules:
    description: >-
      "true" in the one job that saves the module cache every kind restores,
      static-build, whose build and vet of every GO_MODULES module download
      what nearly every kind needs. A job that needs a module the entry lacks
      downloads it on each run.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Every condition starts with !cancelled() so none carries the implicit
    # success(): the caller already runs this after a failed step on
    # purpose.
    #
    # go-cache-restore dated every restored entry two hours back, and Go
    # refreshes an entry's mtime whenever it uses one that is over an hour
    # old, so everything this job used or built is newer than an hour before
    # the restore. Deleting the rest, the same per-file removal Go's own 5-day
    # trim does, keeps a saved entry the size of one job's build instead of
    # every main commit's leftovers.
    - name: Drop build cache entries this job did not use
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GO_CACHE_EXACT_HIT != 'true' && inputs.job-status == 'success' }}
      shell: bash
      run: |
        find "$GO_BUILD_CACHE_DIR" -type f -name '*-[ad]' ! -newermt "@$((GO_CACHE_RESTORED_AT - 3600))" -delete
        du -sh "$GO_BUILD_CACHE_DIR"

    - name: Save Go build cache
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GO_CACHE_EXACT_HIT != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ env.GO_BUILD_CACHE_DIR }}
        key: ${{ env.GO_CACHE_KEY }}

    - name: Save Go module cache
      if: ${{ !cancelled() && inputs.modules == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GO_MODULES_EXACT_HIT != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ env.GO_MOD_CACHE_DIR }}
        key: ${{ env.GO_MODULES_CACHE_KEY }}
