name: Save Go caches
description: >-
  On a push to main, delete the entry each save supersedes and then save the
  Go build cache under the key go-cache-restore chose, and with `modules` the
  shared module cache too. Everywhere else it does nothing: a pull request's
  saves are readable only by that pull request's branch and would crowd
  main's entries out of the repository's 10GB limit. A re-run whose restore
  hit this commit's key exactly also skips that save. Put it after the job's
  last Go build or test step, conditioned on !cancelled() and given the job's
  status as job-status, so a failing step cannot leave the lane building cold
  on every later run. Deleting needs the calling job's actions: write
  permission; the delete is skipped wherever the save is.
inputs:
  job-status:
    description: >-
      The job's status when the save runs (`job.status`). Only a successful
      job trims its build cache: a job that failed partway used only part of
      what it restored, so it saves everything it restored plus what it built.
    required: true
  modules:
    description: >-
      "true" in the one job that saves the module cache every kind restores,
      static-build, whose build and vet of every GO_MODULES module download
      what nearly every kind needs. A job that needs a module the entry lacks
      downloads it on each run.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Every condition starts with !cancelled() so none carries the implicit
    # success(): the caller already runs this after a failed step on
    # purpose.
    #
    # go-cache-restore dated every restored entry two hours back, and Go
    # refreshes an entry's mtime whenever it uses one that is over an hour
    # old, so everything this job used or built is newer than an hour before
    # the restore. Deleting the rest, the same per-file removal Go's own 5-day
    # trim does, keeps a saved entry the size of one job's build instead of
    # every main commit's leftovers.
    - name: Drop build cache entries this job did not use
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GO_CACHE_EXACT_HIT != 'true' && inputs.job-status == 'success' }}
      shell: bash
      run: |
        find "$GO_BUILD_CACHE_DIR" -type f -name '*-[ad]' ! -newermt "@$((GO_CACHE_RESTORED_AT - 3600))" -delete
        du -sh "$GO_BUILD_CACHE_DIR"

    # Two live generations do not fit the repository's 10GB cache budget. This
    # fleet is ~8.3GB per generation plus ~0.6GB of iOS DerivedData, so a main
    # push that saved beside the previous generation peaked at 16.02GB, and
    # GitHub then evicted least recently accessed entries: the ones no run had
    # restored yet, the iOS tree among them, before it was ever restored
    # (issue #7025). A restore only ever takes the newest entry of a prefix, so
    # the predecessor is dead weight the moment this run saves, and deleting it
    # first keeps the peak at the steady state. Deleting it after the save
    # would not: race-agent alone is ~1.7GiB, which puts the line over.
    #
    # The cost is that a save failing after the delete leaves this kind cold
    # for one run. The delete itself never fails the lane: when the cache API
    # will not answer, the save still runs and the next main push's
    # cache-prune collects the predecessor.
    - name: Delete the cache entries these saves supersede
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MODULES: ${{ inputs.modules }}
        BUILD_PREFIX: ${{ env.GO_CACHE_PREFIX }}
        BUILD_KEY: ${{ env.GO_CACHE_KEY }}
        MODULES_PREFIX: ${{ env.GO_MODULES_PREFIX }}
        MODULES_KEY: ${{ env.GO_MODULES_CACHE_KEY }}
      run: |
        supersede() { # prefix, the key this run saves
          local prefix="$1" kept="$2" listing
          if ! listing="$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main \
            --key "$prefix" --limit 100 --json id,key --jq '.[] | "\(.id) \(.key)"')"; then
            echo "::warning::Could not list the $prefix entries; cache-prune will delete the predecessor."
            return
          fi
          while read -r id key; do
            if [ -n "$id" ] && [ "$key" != "$kept" ]; then
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY" \
                || echo "Cache entry $id was not deleted; another main run may have deleted it first."
            fi
          done <<< "$listing"
        }
        # The guards mirror the save steps below, so an exact-hit re-run never
        # deletes the entry it is itself restoring.
        if [ "$GO_CACHE_EXACT_HIT" != "true" ]; then
          supersede "$BUILD_PREFIX" "$BUILD_KEY"
        fi
        if [ "$MODULES" = "true" ] && [ "$GO_MODULES_EXACT_HIT" != "true" ]; then
          supersede "$MODULES_PREFIX" "$MODULES_KEY"
        fi

    - name: Save Go build cache
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GO_CACHE_EXACT_HIT != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ env.GO_BUILD_CACHE_DIR }}
        key: ${{ env.GO_CACHE_KEY }}

    - name: Save Go module cache
      if: ${{ !cancelled() && inputs.modules == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GO_MODULES_EXACT_HIT != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ env.GO_MOD_CACHE_DIR }}
        key: ${{ env.GO_MODULES_CACHE_KEY }}
