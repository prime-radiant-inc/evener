name: Save Go caches
description: >-
  On a push to main, save the Go build cache under the key go-cache-restore
  chose, and the module cache when go.sum changed. Everywhere else it does
  nothing: a pull request's saves are readable only by that pull request's
  branch and would crowd main's entries out of the repository's 10GB limit.
  Make it the job's last step.
runs:
  using: composite
  steps:
    # Go refreshes a cache entry's mtime whenever it uses one that is over an
    # hour old, so everything this job used is newer than an hour before the
    # restore. Deleting the rest, the same per-file removal Go's own 5-day
    # trim does, keeps a saved entry the size of one job's build instead of
    # every main commit's leftovers.
    - name: Drop build cache entries this job did not use
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        find "$GO_BUILD_CACHE_DIR" -type f -name '*-[ad]' ! -newermt "@$((GO_BUILD_CACHE_RESTORED_AT - 3600))" -delete
        du -sh "$GO_BUILD_CACHE_DIR"

    - name: Save Go build cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.GO_BUILD_CACHE_DIR }}
        key: ${{ env.GO_BUILD_CACHE_KEY }}

    - name: Save Go module cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GO_MOD_CACHE_HIT != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.GO_MOD_CACHE_DIR }}
        key: ${{ env.GO_MOD_CACHE_KEY }}
