name: Restore Go caches
description: >-
  Restore this job kind's newest Go build cache and the newest shared Go
  module cache, and record the keys and paths .github/actions/go-cache-save
  needs. Run it after Go is installed; run go-cache-save after the job's last
  Go build or test step.
inputs:
  kind:
    description: >-
      Which build this job does. Jobs whose compiled output differs (race and
      non-race tests, lint, vet) must use different kinds so each restores a
      cache full of the entries it actually uses.
    required: true
runs:
  using: composite
  steps:
    # The keys end in the commit, so every save on main is a new entry and
    # every run restores the newest entry by prefix. The Go version is in the
    # prefix because a toolchain bump makes every older entry dead weight.
    # The build cache is per kind; the module cache is one entry every kind
    # shares, saved by static-build alone (go-cache-save's `modules`), so the
    # repository's cache budget holds one copy of it instead of one per kind.
    - name: Resolve Go cache keys
      id: keys
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
      run: |
        suffix="${ImageOS}-$(go env GOARCH)-$(go env GOVERSION)-"
        prefix="go-${KIND}-${suffix}"
        modules_prefix="gomod-${suffix}"
        {
          echo "build-dir=$(go env GOCACHE)"
          echo "mod-dir=$(go env GOMODCACHE)"
          echo "prefix=$prefix"
          echo "modules-prefix=$modules_prefix"
        } >> "$GITHUB_OUTPUT"
        {
          echo "GO_BUILD_CACHE_DIR=$(go env GOCACHE)"
          echo "GO_MOD_CACHE_DIR=$(go env GOMODCACHE)"
          echo "GO_CACHE_KEY=${prefix}${GITHUB_SHA}"
          echo "GO_MODULES_CACHE_KEY=${modules_prefix}${GITHUB_SHA}"
          echo "GO_CACHE_RESTORED_AT=$(date +%s)"
        } >> "$GITHUB_ENV"

    - name: Restore Go build cache
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.keys.outputs.build-dir }}
        key: ${{ steps.keys.outputs.prefix }}${{ github.sha }}
        restore-keys: ${{ steps.keys.outputs.prefix }}

    - name: Restore Go module cache
      id: restore-modules
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.keys.outputs.mod-dir }}
        key: ${{ steps.keys.outputs.modules-prefix }}${{ github.sha }}
        restore-keys: ${{ steps.keys.outputs.modules-prefix }}

    # A re-run on a main commit whose entry was already saved restores that
    # exact key. go-cache-save then skips that save: actions/cache/save would
    # archive the whole cache only to have the reservation refused and
    # logged, without failing the job.
    - name: Record exact cache hits
      shell: bash
      env:
        HIT: ${{ steps.restore.outputs.cache-hit }}
        MODULES_HIT: ${{ steps.restore-modules.outputs.cache-hit }}
      run: |
        echo "GO_CACHE_EXACT_HIT=$HIT" >> "$GITHUB_ENV"
        echo "GO_MODULES_EXACT_HIT=$MODULES_HIT" >> "$GITHUB_ENV"

    # go-cache-save keeps only the build cache entries this job used, and
    # Go marks an entry used by refreshing its mtime only when the mtime is
    # over an hour old. Restored entries keep the mtime of the run that wrote
    # them, so an entry a main run wrote less than an hour earlier would read
    # as used and ride along unused into every later save. Dating those
    # entries two hours back makes each use visible; older entries already
    # read as unused until Go touches them. A cold restore leaves no
    # directory, and nothing to date.
    - name: Date restored build cache entries before this job
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ -d "$GO_BUILD_CACHE_DIR" ]; then
          find "$GO_BUILD_CACHE_DIR" -type f -name '*-[ad]' -newermt "@$((GO_CACHE_RESTORED_AT - 3600))" -exec touch -m -d "@$((GO_CACHE_RESTORED_AT - 7200))" {} +
        fi
