name: Darwin lint timeout diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/lint-timeout-diagnostic.yml
      - scripts/ci/lint-timeout-diagnostic.sh

permissions:
  contents: read

jobs:
  controlled-lint-diagnostic:
    runs-on: ubuntu-24.04
    # Experiment deadman only. The unchanged linter deadline remains five minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Collect sequential diagnostic arms
        id: collect
        continue-on-error: true
        run: bash scripts/ci/lint-timeout-diagnostic.sh
      - name: Retain evidence even when an arm fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-timeout-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lint-timeout-diagnostic/evidence
          if-no-files-found: error
          retention-days: 7
      - name: Report experiment verdict after evidence upload
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          test "$COLLECTION_OUTCOME" = success
          test "$(cat "$RUNNER_TEMP/lint-timeout-diagnostic/evidence/verdict")" = 0
