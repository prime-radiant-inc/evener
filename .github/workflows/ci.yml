name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/serf-hub/frontend/package-lock.json

      - name: Test and build
        run: make test-web && make build-web

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/serf-hub/frontend/package-lock.json

      - name: Build web frontend (go:embed all:frontend/dist needs real output)
        run: make build-web

      - name: Build
        run: go build ./...

      - name: Vet (all go.work modules)
        run: make vet

      # The aggregate target, never its families one by one: the Makefile's
      # `lint:` rule is the only list, so a family added there runs here too.
      # Both tools install first because a lint family that cannot find its
      # tool does not always fail loudly — secret-scan skips with a warning
      # and a zero exit when gitleaks is missing.
      - name: Lint (make lint — every family of the local gate, all go.work modules)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.8.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint

      - name: Test (race detector — the permanent -race gate, all go.work modules)
        run: make test-race

      - name: Fuzz seed-corpus replay (committed crashers — no search, deterministic)
        run: make fuzz

      - name: Fuzz gap check (every decode/parse package has a target — static, fast)
        run: make fuzz-gap-check

      # The repo-wide scan is a lint family and runs above; this is the
      # corpus-scoped pass, which is not.
      - name: Secret scan (gitleaks — committed fuzz corpora)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make fuzz-corpus-scan
