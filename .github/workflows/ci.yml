name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/evener-hub/frontend/package-lock.json

      - name: Test, build, and browser guards
        run: make test-web && make build-web && make test-web-browser

  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Build runtime pair and all Go workspace packages
        run: make build && make build-go

      - name: Vet (all go.work modules)
        run: make vet

      - name: Fuzz gap check (every decode/parse package has a target — static, fast)
        run: make fuzz-gap-check

  lint-golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Install golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make tools-golangci

      - name: Lint (golangci-lint across all go.work modules)
        run: make lint-golangci

  lint-tagged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Install golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make tools-golangci

      - name: Lint tagged compile floors (evenerfuzz and eval)
        run: make lint-evenerfuzz lint-eval

  lint-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - name: Install gitleaks
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make tools-gitleaks

      - name: Lint repository structure, generated output, formatting, and secrets
        env:
          EVENER_GITLEAKS_REQUIRED: "1"
        run: make lint-generated lint-naming lint-gofmt lint-internal lint-fuzz-registry secret-scan

  static:
    if: always()
    needs: [static-build, lint-golangci, lint-tagged, lint-repository]
    runs-on: ubuntu-latest
    steps:
      - name: Require every static lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$(jq -r '[.[].result] | all(. == "success")' <<<"$RESULTS")" = true

  race-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Test (race detector — root module)
        run: make test-race RACE_SCOPE=root

  race-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Test (race detector — non-root go.work modules)
        run: make test-race RACE_SCOPE=nonroot

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Deterministic tests (full root suite; frontend covered by web job)
        run: ROOT_FULL=1 WEB=0 make test

  dev-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Read golangci-lint version
        id: golangci-version
        run: |
          echo "version=$(awk '$1=="golangci-lint" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install golangci-lint for dev-tooling self-tests
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "v${{ steps.golangci-version.outputs.version }}"

      - name: Dev-tooling self-test wave (scripts/*-selftest.sh — tooling, not the product)
        run: make test-dev-tooling

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Fuzz seed-corpus replay (committed crashers — no search, deterministic)
        run: make fuzz

  # Packaging proof, not artifact production: a PR that breaks the goreleaser
  # config, archive layout, or SPA-embedding before-hook must fail before merge.
  # The build plus this inspection is the whole proof, so the job deliberately
  # uploads nothing — no automated consumer reads a PR-run artifact (the main
  # snapshot channel is fed by the Build Binaries workflow), and the check name
  # is pinned by branch protection.
  snapshot-artifacts:
    name: Build snapshot artifacts
    if: github.event_name == 'pull_request'
    needs: [static, race-root, race-modules, tests, dev-tooling, fuzz, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-toolchain

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          BUILD_CHANNEL: snapshot

      # tar -tzf proves each archive's member list; the checksums assertion
      # carries the existence coverage the dropped upload's if-no-files-found
      # used to provide.
      - name: Inspect archives
        run: |
          for f in dist/*.tar.gz; do echo "== $f"; tar -tzf "$f"; done
          test -s dist/checksums.txt
