name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/serf-hub/frontend/package-lock.json

      - name: Test and build
        run: make test-web && make build-web

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/serf-hub/frontend/package-lock.json

      - name: Build web frontend (go:embed all:frontend/dist needs real output)
        run: make build-web

      - name: Build
        run: go build ./...

      - name: Vet (all go.work modules)
        run: make vet

      - name: Naming check (JSON=snake_case, TOML=snake_case)
        run: go run ./cmd/serf-namingcheck

      - name: Internal-type leak check (no internal/ types in exported agent/llm API)
        run: go run ./cmd/serf-internalcheck

      - name: Library doc-completeness check (exported library API is documented)
        run: go run ./cmd/serf-docscheck

      - name: Lint (golangci-lint, all go.work modules)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.8.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint-golangci

      - name: Test (race detector — the permanent -race gate, all go.work modules)
        run: make test-race

      - name: Fuzz seed-corpus replay (committed crashers — no search, deterministic)
        run: make fuzz

      - name: Fuzz gap check (every decode/parse package has a target — static, fast)
        run: make fuzz-gap-check

      - name: Secret scan (gitleaks — repo + committed fuzz corpora)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          make secret-scan
          make fuzz-corpus-scan
