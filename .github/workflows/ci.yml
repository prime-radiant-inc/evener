name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub sometimes drops a PR's pull_request events entirely (see
  # scripts/ops/pr-ci-watchdog.sh), and a workflow without this trigger cannot
  # be re-dispatched for the pushed head.
  workflow_dispatch:
  # The merge queue tests each queued PR on top of main and the PRs ahead of
  # it, and main requires the same checks on that candidate.
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The verdict of every aggregate job below (web, static, race-root,
  # race-modules, tests), read from toJSON(needs): each lane succeeded, or
  # was skipped because the changes job named it. A skip nothing named (a
  # cancelled run, or any skip in a merge group or on main, where changes
  # names none) fails the aggregate.
  REQUIRE_LANES: >-
    (.changes.outputs.skip // "") as $s
    | (if .changes.result == "success" and $s != "" then $s | fromjson else [] end) as $skipped
    | del(.changes) | to_entries
    | all(.value.result == "success" or (.value.result == "skipped" and (.key as $job | $skipped | any(. == $job))))

jobs:
  # On a pull request, names the lanes the change cannot reach, as
  # cmd/evener-cilanes decides them (docs/developing-evener/testing.md, "Pull
  # Requests Skip Lanes a Change Cannot Reach"). `skip` lists whole jobs, and
  # each exclude_* output lists matrix cells to drop. Every lane runs in a
  # merge group and on main, where this job is skipped, and when it fails:
  # its outputs are then empty, so nothing is skipped. Those runs keep
  # main safe from a wrong skip, which can only bounce a pull request in the
  # merge queue.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      exclude_race_root_parts: ${{ steps.plan.outputs.exclude_race_root_parts }}
      exclude_race_module_shards: ${{ steps.plan.outputs.exclude_race_module_shards }}
      exclude_tests_parts: ${{ steps.plan.outputs.exclude_tests_parts }}
    steps:
      # The pull request's merge commit and its first parent, the base it
      # merges onto: HEAD^1...HEAD is exactly what the merge changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - id: plan
        run: go run ./cmd/evener-cilanes/bin --base HEAD^1 >> "$GITHUB_OUTPUT"

  # Every job carries a timeout-minutes of about three times its slowest green
  # run, never under 20, so a hang ends in tens of minutes instead of at the
  # hosted runner's six-hour limit. They are backstops, not budgets: the timing
  # ratchet polices speed, and a hung Go test is named by its test binary's own
  # timeout, which each lane's bound leaves room for. A lane that grows past
  # a third of its bound needs the bound raised with it.
  #
  # The frontend gate runs on separate runners, because its halves share
  # nothing: the unit/type/lint checks in one lane, and the production build
  # plus the real-browser guards in web-browser, which is itself split into
  # shards, one runner each. `web`, the required check, passes only when every
  # lane does.
  #
  # Each lane the changes job can name runs unless it names it, and runs
  # when the changes job fails (!cancelled() instead of the implicit
  # success()).
  web-unit:
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'web-unit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      # The gate itself is Go: make test-web builds and runs evener-dev.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - uses: ./.github/actions/go-cache-restore
        with:
          kind: web-unit

      - name: Typecheck, unit tests, and lint
        env:
          EVENER_WEB_VITEST_JSON: /tmp/gate-web-vitest.json
        run: make test-web

      # The vitest JSON report carries each test file's duration, which the
      # timing budget rolls up into one "web" row. Kept on every run, pass or
      # fail, so slow files can be ranked across runs. A gate that stopped
      # before vitest ran leaves no report, which is not a second failure.
      - name: Keep the vitest timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-vitest-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/gate-web-vitest.json
          retention-days: 7
          if-no-files-found: ignore

      # The cache save precedes the timing gate: the gate fails on wall time
      # while the cache this run warmed is good, and a save after a failed
      # step keeps everything it restored instead of trimming to this job's
      # build, so a budget breach on main would grow the entry.
      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}

      # The frontend's durations come from the same vitest run above (issue
      # #144): the JSON reporter it wrote is turned into the ratchet's rows and
      # the "web" budget entry is enforced. This lane owns the frontend scope,
      # so it enforces exactly the duration its own run measured.
      #
      # In a merge group the check is warn-only: a breach is reported and a
      # broken measurement still fails. Every member's own pull-request run
      # already enforced the budget, and a wall-time breach here removes the
      # whole group from the queue, bystanders included, for what is most
      # often the runner's load.
      - name: Timing budget (web row from the same vitest run)
        env:
          BUDGET_POLICY: ${{ github.event_name == 'merge_group' && '--local' || '--strict' }}
        run: |
          . scripts/lib/timing-tsv-lib.sh
          vitest_json_to_tsv /tmp/gate-web-vitest.json > /tmp/gate-web-timing.tsv
          scripts/gate/test-timing-budget.sh --check "$BUDGET_POLICY" --measured /tmp/gate-web-timing.tsv

  # One runner per shard of the browser gate (browserGuardShards in
  # cmd/evener-dev/webbrowser.go); together the shards run every guard.
  web-browser:
    name: web-browser / ${{ matrix.shard }}
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'web-browser') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [overflow, skill, cascade]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      # The retirement, skill, cascade and background guards run go test
      # against cmd/evener-hub, with and without the browserguard tag.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      # The shards compile the same dependencies; only the overflow shard's
      # retirement guard builds cmd/evener-hub without the browserguard tag.
      # So they share one kind, saved by the cascade shard, the slowest, and
      # the overflow shard alone recompiles its untagged hub test.
      - uses: ./.github/actions/go-cache-restore
        with:
          kind: web-browser

      # Two guards at a time, whatever the load average: the one-minute
      # average still carries the frontend build when the gate sizes its
      # slots, which left the unsharded lane at one slot or two by chance.
      # Two is the contention the guards already pass at, a long guard beside
      # a short one.
      - name: Build and browser guards (${{ matrix.shard }})
        env:
          BROWSER_GUARD_SHARD: ${{ matrix.shard }}
          BROWSER_GUARD_CONCURRENCY: 2
        run: make test-web-browser

      - name: Install native and shared journey dependencies
        if: matrix.shard == 'cascade'
        run: |
          npm ci --prefix mobile-native
          npm ci --prefix appwire-client/typescript

      - name: Failed-turn continuation in both clients
        if: matrix.shard == 'cascade'
        run: go test -tags browserguard ./cmd/evener-hub -run '^TestRetryContinuation' -count=1 -v

      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() && matrix.shard == 'cascade' }}
        with:
          job-status: ${{ job.status }}

      # The skill guard keeps its driver log, screenshots and helper logs under
      # a temporary directory when it fails, deliberately, so a failing run can
      # be read afterwards. On a runner nobody reads it: the directory goes
      # with the machine, and the failure arrives as one line naming a path
      # that no longer exists. This is the only copy that outlives the job.
      # Named for the shard and the run so two failures on the same PR do not
      # collide.
      # The cascade guard keeps its evidence the same way (its temp dir is
      # KeptTempDir, which on a runner is /tmp), so its path is collected too.
      # So are the background Jobs and job output paging guards'.
      - name: Keep the browser guards' artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: browser-guards-artifacts-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/skillguard-browser-*/artifacts/**
            /tmp/cascadeguard-browser-*/**
            /tmp/backgroundjobsguard-*/**
            /tmp/joboutputpagingguard-*/**
          retention-days: 7
          # The step also fires when make build-web is what failed, and then
          # there is nothing to collect: say so quietly instead of adding a
          # warning that reads like a second failure.
          if-no-files-found: ignore

  web:
    if: always()
    needs: [changes, web-unit, web-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require both frontend lanes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$(jq -r "$REQUIRE_LANES" <<<"$RESULTS")" = true

  native:
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'native') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install native dependencies
        run: npm ci --prefix mobile-native

      - name: Podfile.lock locks every autolinked iOS module
        run: make check-podfile-lock

      - name: Bundle, test native app and shared session core
        timeout-minutes: 30
        run: make test-native check-mermaid-freshness

  api-package:
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'api-package') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install protocol development dependencies
        run: npm ci --prefix appwire-client/typescript

      - name: Qualify installed AppWire package
        run: make test-api-package

  static-build:
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'static-build') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          go-cache-kind: static-build

      - name: Build runtime pair and all Go workspace packages
        run: make build && make build-go

      - name: Vet (all go.work modules)
        run: make vet

      # Nothing ships for Windows (.goreleaser.yml builds linux and darwin
      # only). This cross-vet is a build-tag discipline check: a source or test
      # file that reaches for Mkfifo, Stat_t, or an fd-based sandbox seam has to
      # say so in a constraint instead of compiling by accident (issue #897).
      - name: Vet (GOOS=windows — Unix-only sources must carry a build tag)
        run: GOOS=windows make vet

      # Building and vetting every GO_MODULES module downloads the modules
      # nearly every kind needs, so this lane saves the shared module cache.
      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}
          modules: "true"

  lint-golangci:
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'lint-golangci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - uses: ./.github/actions/go-cache-restore
        with:
          kind: lint-golangci

      # The analysis cache lives where the Makefile's GOLANGCI_LINT_CACHE
      # points. That path hashes the checkout path, which is the same on every
      # hosted runner, so a restored cache lands where make lint looks. The
      # key carries the linter version, its config, and the Go version; like
      # the Go build cache it restores the newest entry by prefix, saves only
      # on main, and saves after a failed lint too: a cold run that times out
      # has still filled it, and skipping the save would leave every later
      # run as cold.
      - name: Resolve golangci-lint cache
        id: golangci-cache
        env:
          CONFIG_HASH: ${{ hashFiles('.tool-versions', '.golangci.yml', '.golangci-appwire.yml') }}
        run: |
          echo "dir=$(scripts/lib/golangci-lint-cache.sh)" >> "$GITHUB_OUTPUT"
          echo "prefix=golangci-lint-${ImageOS}-$(go env GOVERSION)-${CONFIG_HASH}-" >> "$GITHUB_OUTPUT"

      - id: golangci-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.golangci-cache.outputs.dir }}
          key: ${{ steps.golangci-cache.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.golangci-cache.outputs.prefix }}

      - name: Install golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make tools-golangci

      - name: Lint (golangci-lint across all go.work modules)
        # Bound simultaneous cold package loads on the four-CPU hosted runner.
        env:
          LINT_PARALLEL: "2"
        run: make lint-golangci

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.golangci-restore.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.golangci-cache.outputs.dir }}
          key: ${{ steps.golangci-cache.outputs.prefix }}${{ github.sha }}

      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}

  # The tagged compile floors take minutes of their own, compiling and linting
  # every module under the evenerfuzz and eval tags, so they run on a runner
  # beside the golangci sweep rather than after it. Their compile output and
  # golangci analysis differ from the untagged sweep's, so both caches are
  # this lane's own kind. `static` requires this lane too.
  lint-tagged:
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'lint-tagged') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - uses: ./.github/actions/go-cache-restore
        with:
          kind: lint-tagged

      # Resolved as in lint-golangci, under a prefix of this lane's own.
      - name: Resolve golangci-lint cache
        id: golangci-cache
        env:
          CONFIG_HASH: ${{ hashFiles('.tool-versions', '.golangci.yml', '.golangci-appwire.yml') }}
        run: |
          echo "dir=$(scripts/lib/golangci-lint-cache.sh)" >> "$GITHUB_OUTPUT"
          echo "prefix=golangci-lint-tagged-${ImageOS}-$(go env GOVERSION)-${CONFIG_HASH}-" >> "$GITHUB_OUTPUT"

      - id: golangci-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.golangci-cache.outputs.dir }}
          key: ${{ steps.golangci-cache.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.golangci-cache.outputs.prefix }}

      - name: Install golangci-lint
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make tools-golangci

      - name: Lint tagged compile floors (evenerfuzz and eval)
        run: make lint-evenerfuzz lint-eval

      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.golangci-restore.outputs.cache-hit != 'true' }}
        with:
          path: ${{ steps.golangci-cache.outputs.dir }}
          key: ${{ steps.golangci-cache.outputs.prefix }}${{ github.sha }}

      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}

  lint-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - uses: ./.github/actions/go-cache-restore
        with:
          kind: lint-repository

      - name: Install gitleaks
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          make tools-gitleaks

      - name: Lint repository structure, source audits, generated output, formatting, and secrets
        env:
          EVENER_GITLEAKS_REQUIRED: "1"
        run: make lint-generated lint-naming lint-gofmt lint-internal lint-package-imports lint-js-toolchain-pins lint-tracked-file-size lint-repo-audit secret-scan

      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}

  # Both fuzz consistency checks are fast, static AST analyses over the same
  # target manifest and registry inputs; running them in one lane pays a
  # single checkout and toolchain setup instead of two. Each make target runs
  # its own script directly and fails the lane on its own verdict, so both
  # gates keep their teeth.
  fuzz-checks:
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'fuzz-checks') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - uses: ./.github/actions/go-cache-restore
        with:
          kind: fuzz-checks

      - name: Fuzz gap check (every decode/parse package has a target — static, fast)
        run: make fuzz-gap-check

      - name: Fuzz registry check (manifest matches AST-discovered targets)
        run: make fuzz-registry-check

      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}

  static:
    if: always()
    needs: [changes, static-build, lint-golangci, lint-tagged, lint-repository, fuzz-checks, api-package, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require every static lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$(jq -r "$REQUIRE_LANES" <<<"$RESULTS")" = true

  # The root module's race run is two lanes on separate runners: cmd/evener-hub
  # (its ~2100 mostly serial tests, as 12 shards) and everything else. On one
  # 4-core runner the two competed for the same cores under -race's slowdown.
  # `race-root`, the required check, passes only when both lanes do.
  race-root-parts:
    name: race-root / ${{ matrix.part }}
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'race-root-parts') }}
    strategy:
      fail-fast: false
      matrix:
        part: [hub, rest]
        exclude: ${{ fromJSON(needs.changes.outputs.exclude_race_root_parts || '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record pull request candidate identity
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          echo "PR_HEAD_SHA=$PR_HEAD_SHA"
          echo "PR_BASE_SHA=$PR_BASE_SHA"
          echo "PR_MERGE_SHA=$PR_MERGE_SHA"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          go-cache-kind: race-root-${{ matrix.part }}

      # A dedicated runner's cores are all this job's, but the gate's
      # load-aware budgets read the one-minute load average, which on a fresh
      # runner still carries checkout and cache restore; they would start a
      # fraction of the shards (and too few root packages) at once. Size them
      # to the runner instead.
      - name: Test (race detector — root module, ${{ matrix.part }})
        env:
          ROOT_P: 4
          HUB_SHARD_CONCURRENCY: 4
          HUB_SHARD_PARALLEL: 2
          CLI_SHARD_CONCURRENCY: 4
          CLI_SHARD_PARALLEL: 2
        run: make test-race RACE_SCOPE=root RACE_ROOT_PART=${{ matrix.part }}

      # Race skips the survey and timing capture, so raw hub output stays here.
      - name: Keep failed hub race logs
        if: (failure() || cancelled()) && matrix.part == 'hub'
        uses: actions/upload-artifact@v7
        with:
          name: failed-go-race-root-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            /dev/shm/evener-module-tests.*/tmp/_/hub-test-shards.*/shard[0-9]*.log
            /tmp/evener-module-tests.*/tmp/_/hub-test-shards.*/shard[0-9]*.log

      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}

  race-root:
    if: always()
    needs: [changes, race-root-parts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require both root race lanes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$(jq -r "$REQUIRE_LANES" <<<"$RESULTS")" = true

  # The agent module's race run is split across two runners, agent-1 and
  # agent-2, each running half of its eight equally weighted shards
  # (RACE_AGENT_PART); as one unsharded -race binary it was the longest lane.
  # nonagent runs every other non-root module. `race-modules`, the required
  # check, passes only when every lane does.
  race-module-shards:
    name: race-modules / ${{ matrix.scope }}
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'race-module-shards') }}
    strategy:
      fail-fast: false
      matrix:
        scope: [agent-1, agent-2, nonagent]
        exclude: ${{ fromJSON(needs.changes.outputs.exclude_race_module_shards || '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          go-cache-kind: race-${{ matrix.scope }}

      # Sized to the runner, as race-root's hub lane is: the load-aware
      # budgets would read a fresh runner's checkout load and start too few.
      - name: Test (race detector — ${{ matrix.scope }})
        env:
          SCOPE: ${{ matrix.scope }}
          AGENT_SHARD_CONCURRENCY: 4
          AGENT_SHARD_PARALLEL: 3
        run: |
          case "$SCOPE" in
          agent-*) make test-race RACE_SCOPE=agent RACE_AGENT_PART="${SCOPE#agent-}/2" ;;
          *) make test-race RACE_SCOPE="$SCOPE" ;;
          esac

      # Race skips timing capture, so a failed shard's log stays in the
      # scratch directory the runner keeps; the module log replays it.
      - name: Keep failed agent race logs
        if: (failure() || cancelled()) && startsWith(matrix.scope, 'agent-')
        uses: actions/upload-artifact@v7
        with:
          name: failed-go-race-modules-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            /dev/shm/evener-module-tests.*/agent.log
            /tmp/evener-module-tests.*/agent.log
            /dev/shm/evener-module-tests.*/tmp/agent/agent-test-shards.*/shard[0-9]*.log
            /tmp/evener-module-tests.*/tmp/agent/agent-test-shards.*/shard[0-9]*.log

      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}

  race-modules:
    if: always()
    needs: [changes, race-module-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require every non-root race lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$(jq -r "$REQUIRE_LANES" <<<"$RESULTS")" = true

  # The gate's two waves, the root module (full suite) and every other module,
  # took 131s and 142s one after the other on a single runner; each part runs
  # on its own runner instead. `tests` below keeps the required check name.
  tests-parts:
    name: tests / ${{ matrix.scope }}
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'tests-parts') }}
    strategy:
      fail-fast: false
      matrix:
        scope: [root, nonroot]
        exclude: ${{ fromJSON(needs.changes.outputs.exclude_tests_parts || '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          go-cache-kind: tests-${{ matrix.scope }}

      - name: Prepare enforcing sandbox for root tests
        if: matrix.scope == 'root'
        uses: ./.github/actions/enforcing-sandbox
      - name: Retirement timing environment
        if: ${{ matrix.scope == 'root' }}
        run: |
          uname -r
          nproc
          lscpu
          findmnt -T /dev/shm -o TARGET,FSTYPE,OPTIONS
          findmnt -T /tmp -o TARGET,FSTYPE,OPTIONS
          df -Pk /dev/shm /tmp

      # The runner is this job's alone, but its checkout and cache restore are
      # still in the load average when the gate sizes its budgets; at 1.85
      # every Go budget came out as 2 of the 4 cores. Size them to the runner.
      - name: Deterministic tests (full root suite; frontend covered by web job)
        env:
          LOAD_AWARE_LOAD1: "0"
          EVENER_GATE_TIMING_TSV: /tmp/gate-timing-${{ matrix.scope }}.tsv
        run: ROOT_FULL=1 WEB=0 make test TEST_SCOPE=${{ matrix.scope }}


      # Same ordering rule as web-unit above: the cache save precedes the
      # timing gate so a budget failure still saves a trimmed entry.
      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}

      # The timing ratchet's rows come from the test run above (issue #144), so
      # the budget is enforced without a second full pass. Each lane checks its
      # own scope: the rows name only the packages this lane measured, and a
      # missing file fails the check rather than passing silently. A merge
      # group is warn-only, for the reason given in web-unit.
      - name: Timing budget (rows from the same test run)
        env:
          BUDGET_POLICY: ${{ github.event_name == 'merge_group' && '--local' || '--strict' }}
        run: scripts/gate/test-timing-budget.sh --check "$BUDGET_POLICY" --measured /tmp/gate-timing-${{ matrix.scope }}.tsv

      # Survey failure replay is abbreviated. Keep the full surveys and raw
      # timing-capture shard text, never the surrounding homes or test binaries.
      # After the timing check so a timing-only failure still collects them.
      # A job stopped at its time limit can end cancelled rather than failed,
      # and a hang's logs are the ones most worth keeping, so a cancelled job
      # keeps them too. The same holds for every failed-log step in this workflow.
      - name: Keep failed hub and agent test logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: failed-go-tests-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            /dev/shm/evener-module-tests.*/tmp/_/hub-test-shards.*/survey.log
            /dev/shm/evener-module-tests.*/tmp/agent/agent-test-shards.*/survey.log
            /dev/shm/evener-module-tests.*/json/shards/hub/hub-shard[0-9]*.v
            /dev/shm/evener-module-tests.*/json/shards/agent/agent-shard[0-9]*.v
            /tmp/evener-module-tests.*/tmp/_/hub-test-shards.*/survey.log
            /tmp/evener-module-tests.*/tmp/agent/agent-test-shards.*/survey.log
            /tmp/evener-module-tests.*/json/shards/hub/hub-shard[0-9]*.v
            /tmp/evener-module-tests.*/json/shards/agent/agent-shard[0-9]*.v

  # The hub's runner-bound integration tests: daemon retirement, host deploy,
  # live-stack E2E, and the remote-hub source-budget cases. The default gate
  # skips this exact set so the timing ratchet measures the stable suite; this
  # lane runs it without a timing budget because its wall time tracks the runner.
  hub-integration:
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'hub-integration') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          go-cache-kind: tests-root

      - name: Prepare enforcing sandbox
        uses: ./.github/actions/enforcing-sandbox

      - name: Hub integration tests
        run: make test-hub-integration

  tests:
    if: always()
    needs: [changes, tests-parts, hub-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require every test lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$(jq -r "$REQUIRE_LANES" <<<"$RESULTS")" = true

  # fuzz is a required check with no aggregate of its own, and a skip
  # reports as passing. It skips when the changes job names it, or when the
  # run is cancelled first; a cancelled run fails the aggregates, so it
  # cannot pass the required checks either way.
  fuzz:
    needs: [changes]
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.skip || '[]'), 'fuzz') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          go-cache-kind: fuzz

      - name: Fuzz seed-corpus replay (committed crashers — no search, deterministic)
        run: make fuzz

      - uses: ./.github/actions/go-cache-save
        if: ${{ !cancelled() }}
        with:
          job-status: ${{ job.status }}

  # The repository's Actions cache holds 10GB and evicts the least recently
  # accessed entries beyond it. Every main push saves a new entry for each Go
  # cache kind, the golangci-lint analysis caches and the shared module cache,
  # all keyed by commit, and runs restore only the newest entry per key
  # prefix. This job keeps main at that one generation: once every lane has
  # finished it deletes each such entry on main that a newer entry with the
  # same prefix supersedes. It never deletes the newest entry of a prefix, so
  # a lane that saved nothing this run keeps its last entry; an entry another
  # main run deleted first is already gone, which is not a failure.
  cache-prune:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [web, tests, static, race-root, race-modules, fuzz]
    runs-on: ubuntu-24.04
    permissions:
      # Lists and deletes cache entries. No other job in this workflow gets
      # write access to Actions.
      actions: write
    steps:
      - name: Delete superseded cache entries on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          entries="$(gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main \
            --sort created_at --order desc --limit 1000 --json id,key \
            --jq '.[] | select(.key | test("^(go|gomod|golangci-lint)-.*-[0-9a-f]{40}$")) | "\(.id) \(.key | sub("[0-9a-f]{40}$"; ""))"')"
          # Newest first, so the first entry of each prefix is the one kept.
          superseded="$(printf '%s\n' "$entries" | awk 'NF == 2 && seen[$2]++ { print $1 }')"
          deleted=0
          for id in $superseded; do
            if gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; then
              deleted=$((deleted + 1))
            else
              echo "Cache entry $id was not deleted; another main run may have deleted it first."
            fi
          done
          echo "Deleted $deleted superseded cache entries."
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" \
            --jq '"Cache usage: \(.active_caches_count) entries, \(.active_caches_size_in_bytes / 1e9 * 100 | round / 100) GB"'

  # A merge-group run reports its results on the group's read-only queue
  # branch, never on the member PRs. When the group fails a required check —
  # lately on one of main's load-flaky tests — the queue removes every PR in
  # the group, and a green bystander is dropped with no failed check to read:
  # the only trace is a `removed_from_merge_queue` timeline event (issue
  # #5470).
  # This job posts the missing record. It runs only in a merge-group run that
  # failed a required check, and comments on every member PR with the lanes
  # that failed and a link to the group run, so a bystander is distinguishable
  # from the PR that broke the group without archaeology. Only members of the
  # failed group hear from it: groups stacked on a failing group keep their
  # queue place and are rebuilt and re-run automatically.
  merge-group-report:
    if: always() && github.event_name == 'merge_group' && failure()
    needs: [web, tests, static, race-root, race-modules, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Reads the group's commits and this run's failed jobs, and writes one
      # comment on each member PR. No other job in this workflow gets these.
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Post the group failure on every dropped PR
        env:
          GH_TOKEN: ${{ github.token }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MG_HEAD_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: |
          set -eu

          # The queue squashes every queued PR into one commit on top of the
          # group's base, so compare(base...head) walks exactly the members,
          # and every commit title ends "(#N)". The queue branch's own
          # "pr-<N>" anchor names a member whatever the compare returns. gh
          # api prints error bodies on stdout, so every source is filtered
          # down to bare numbers before it is trusted. A failed compare is
          # recorded rather than swallowed: the anchor and head-commit
          # fallbacks can name only one member of a multi-PR group, so a
          # partial report must not read as complete.
          compare_status=0
          members="$(gh api "repos/$GITHUB_REPOSITORY/compare/$MG_BASE...$MG_HEAD" \
            --jq '[.commits[].commit.message | split("\n")[0] | scan("\\(#([0-9]+)\\)$") | .[0]] | unique | .[]')" || compare_status=$?
          anchor="$(printf '%s' "$MG_HEAD_REF" \
            | sed -nE 's#^refs/heads/gh-readonly-queue/.*/pr-([0-9]+)-.*$#\1#p')"
          prs="$(printf '%s\n%s\n' "$members" "$anchor" | sed -nE '/^[0-9]+$/p' | sort -un)"
          if [ -z "$prs" ]; then
            # The queue branch is short-lived, and GitHub can collect its
            # commits once the group is gone; the payload's head commit
            # message still names one member.
            prs="$(printf '%s\n' "$MG_HEAD_MESSAGE" | head -1 \
              | sed -nE 's/^.*\(#([0-9]+)\)$/\1/p')"
          fi
          if [ -z "$prs" ]; then
            echo "No member PR found for the failed group; nothing to comment on." >&2
            exit 1
          fi

          # What failed, for readers deciding what broke the group. The five
          # aggregates only restate their lanes, so they are left out; fuzz
          # runs its own steps, so its failures are reported like any lane's.
          failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")
                   | select(.name as $n | ["web","tests","static","race-root","race-modules"] | index($n) | not)
                   | .name as $job | .steps[]?
                   | select(.conclusion == "failure" or .conclusion == "cancelled")
                   | ($job + " — " + .name)] | unique' || true)"
          if ! printf '%s' "$failed" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
            failed='["a required check"]'
          fi

          members_md="$(printf '#%s, ' $prs | sed 's/, $//')"
          failed_md="$(printf '%s\n' "$failed" | jq -r '.[] | "- `" + . + "`"')"
          body="$(mktemp)"
          {
            echo '**Dropped from the merge queue: the merge group that held this PR failed its shared checks** (#5470).'
            echo
            echo "Every PR in the group ($members_md) was removed from the queue. Merge-group checks run against the group's combined snapshot and report only on the group queue branch, never on member PRs, so the drop leaves no failed check to read here — and the failures below name tests, not PRs. Being green on its own does not clear this PR: green PRs can also fail in combination. Read the failures below and confirm they are transient or unrelated to this PR before re-enqueueing it."
            echo
            echo 'Failed in the group run:'
            printf '%s\n' "$failed_md"
            echo
            echo "Group run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Snapshot: ${MG_BASE:0:10} → ${MG_HEAD:0:10}"
          } > "$body"

          posted=0
          failed_posts=0
          for pr in $prs; do
            if gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file "$body"; then
              posted=$((posted + 1))
            else
              failed_posts=$((failed_posts + 1))
              echo "Could not comment on #$pr." >&2
            fi
          done
          # A partially delivered report must not read as success: the job's
          # own failure is the retryable record that a comment is missing.
          # An incomplete membership discovery fails the job too, for the
          # dropped members it could not name.
          if [ "$failed_posts" -gt 0 ] || [ "$compare_status" -ne 0 ]; then
            echo "Report delivery incomplete: $failed_posts comment(s) failed, compare_status=$compare_status." >&2
            exit 1
          fi
          test "$posted" -gt 0
