name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet (all go.work modules)
        run: make vet

      - name: Naming check (JSON=snake_case, TOML=snake_case)
        run: go run ./cmd/serf-namingcheck

      - name: Internal-type leak check (no internal/ types in exported agent/llm API)
        run: go run ./cmd/serf-internalcheck

      - name: Library doc-completeness check (exported library API is documented)
        run: go run ./cmd/serf-docscheck

      - name: Lint (golangci-lint, all go.work modules)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.8.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint-golangci

      - name: Test (race detector — the permanent -race gate, all go.work modules)
        run: make test-race
