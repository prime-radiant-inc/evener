name: Documentation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            cmd/evener-hub/frontend/package-lock.json
      - name: Check documented shell fixtures as root then unprivileged
        run: |
          sudo -n env -u EVENER_SCRATCH_DIR -u TMPDIR "$(command -v node)" --test --test-concurrency=1 docs-site/scripts/documented-shell.test.mjs
          env -u EVENER_SCRATCH_DIR -u TMPDIR node --test --test-concurrency=1 docs-site/scripts/documented-shell.test.mjs
      - run: npm --prefix docs-site ci
      - run: npm --prefix cmd/evener-hub/frontend ci
      - name: Install Chromium for documentation checks
        working-directory: docs-site
        run: npx playwright install --with-deps chromium
      - name: Execute all four CLI and web tutorial scenarios
        run: node docs-site/scripts/tours/refresh.mjs check --surfaces cli,web --out "$RUNNER_TEMP/tutorial-candidate"
      - name: Summarize sanitized web tour failure diagnostics
        if: failure()
        continue-on-error: true
        run: node docs-site/scripts/tours/diagnostics.mjs collect --out "$RUNNER_TEMP/tutorial-diagnostics"
      - name: Retain sanitized web tour failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tutorial-failure-diagnostics
          path: ${{ runner.temp }}/tutorial-diagnostics
          retention-days: 7
          if-no-files-found: ignore
      - name: Validate retained tutorial candidate
        run: node docs-site/scripts/tours/refresh.mjs validate --surfaces cli,web --out "$RUNNER_TEMP/tutorial-candidate"
      - name: Retain sanitized tutorial candidate for review
        uses: actions/upload-artifact@v7
        with:
          name: tutorial-candidate-cli-web
          path: ${{ runner.temp }}/tutorial-candidate
          if-no-files-found: error
      - run: npm --prefix docs-site run build
      - name: Check diagrams, search and navigation in Chromium
        working-directory: docs-site
        run: npx playwright test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/.vitepress/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@v5
