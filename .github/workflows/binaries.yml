name: Build Binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PRs, main pushes, and manual runs prove the release build produces the
  # exact artifacts install.sh consumes; tags publish through the release
  # job instead.
  build:
    name: Build snapshot artifacts
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          BUILD_CHANNEL: snapshot

      - name: Inspect archives
        run: for f in dist/*.tar.gz; do echo "== $f"; tar -tzf "$f"; done

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: evener-snapshot-artifacts
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Publish with goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          BUILD_CHANNEL: release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The snapshot channel is a mutable prerelease tracking main: the tag is
  # force-moved and the artifacts replaced on every green main build.
  snapshot:
    name: Refresh snapshot channel
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The steps below run git (tag/push) and gh (release view/create/upload)
      # against this repository, and both need a checkout: git refuses to run
      # outside a work tree ("fatal: not in a git directory", exit 128) and gh
      # resolves the repo from the origin remote. This job only ever runs on a
      # push to main, so a PR build cannot catch its absence.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: evener-snapshot-artifacts
          path: dist

      - name: Move snapshot tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f snapshot "$GITHUB_SHA"
          git push origin "refs/tags/snapshot" --force

      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "snapshot" >/dev/null 2>&1 || \
            gh release create "snapshot" --title "Evener snapshot" --notes "Latest successful build from main." --prerelease
          gh release upload "snapshot" dist/*.tar.gz dist/checksums.txt --clobber
