name: iOS qualification

on:
  # Main pushes run the lane so simulator-build saves the DerivedData
  # cache every run restores; a pull request's own save would serve
  # only that ref (see "CI Caches" in docs/developing-evener/testing.md).
  push:
    branches: [main]
    paths:
      - "mobile-native/**"
      - "appwire-client/typescript/**"
      - "scripts/native/**"
      - "scripts/lib/scratch-lib.sh"
      - "scripts/lib/e2e-lib.sh"
      - "scripts/ops/build-runtime-pair.sh"
      - "Makefile"
      - "make/**"
      # The lane runs `make build-runtime` on macOS; the required CI lanes run
      # the same recipes only on Linux, so a macOS-only recipe break is
      # otherwise unguarded. Hub and daemon Go sources stay out deliberately:
      # every Go lane builds and gates them, and this lane exists to qualify
      # native and shared-client changes.
      - "test/e2e/fakellm/**"
      - "internal/devtool/procgroup/**"
      - "execsupport/procgroup/**"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ios-qualification.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile-native/**"
      - "appwire-client/typescript/**"
      - "scripts/native/**"
      - "scripts/lib/scratch-lib.sh"
      - "scripts/lib/e2e-lib.sh"
      - "scripts/ops/build-runtime-pair.sh"
      - "Makefile"
      - "make/**"
      # The lane runs `make build-runtime` on macOS; the required CI lanes run
      # the same recipes only on Linux, so a macOS-only recipe break is
      # otherwise unguarded. Hub and daemon Go sources stay out deliberately:
      # every Go lane builds and gates them, and this lane exists to qualify
      # native and shared-client changes.
      - "test/e2e/fakellm/**"
      - "internal/devtool/procgroup/**"
      - "execsupport/procgroup/**"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/ios-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Selected by both jobs and hashed into the DerivedData cache key: a version
  # bump must invalidate a build tree the old Xcode compiled.
  XCODE_VERSION: "26.6"

concurrency:
  # A pull request's newer run supersedes its older one. Every other run gets
  # its own group: a main push saves the cache every later run restores and
  # serves as the post-merge combined-state verification, so two pushes must
  # both run instead of the newer one replacing a pending run in a shared
  # branch group.
  group: ios-qualification-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Set the run-owned output and DerivedData paths
        run: |
          printf 'QUALIFICATION_OUTPUT=%s/ios-qualification-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          # Outside the run-owned output so a cache restored on one run lands
          # where xcodebuild reads it on the next.
          printf 'IOS_DERIVED_DATA=%s/ios-deriveddata\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out the merge ref with the PR head in its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull_request run takes this workflow file from the merge ref.
          # Five commits put the merge commit's two parents (the PR head and
          # the base) on disk for the selector while skipping a full-history
          # download. The launch git snapshot's `git log -n 5`
          # (agent/git_snapshot.go) reads a session's working directory, not
          # this checkout: the UI journeys open theirs in a TMPDIR workspace,
          # and a session opened here would see the PR head's truncated
          # history, not a full five-title window.
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: false
      - name: Choose the tested tree
        id: tree
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE: ${{ github.sha }}
        run: |
          bash scripts/native/ios/qualification/checkout-ref.sh \
            "$PR_HEAD" "$MERGE" \
            scripts/native/ios/build-simulator.sh \
            scripts/native/ios/qualification \
            scripts/native/ios/run-ui-tests.sh \
            scripts/native/ios/run-ui-journeys.sh >> "$GITHUB_OUTPUT"
      - name: Check out the chosen tree
        env:
          CHOSEN_REF: ${{ steps.tree.outputs.ref }}
        run: git checkout --force "$CHOSEN_REF"
      # The key carries everything that changes what xcodebuild compiles: the
      # runner image, the selected Xcode, and both resolved dependency locks.
      # A pull request that changes either lock misses and runs cold; one that
      # leaves them alone restores main's newest entry through Actions'
      # base-branch fallback. The commit suffix makes each main push a new
      # generation, which ci.yml's cache-prune job trims.
      - name: Resolve the DerivedData cache key
        id: deriveddata-cache
        env:
          POD_LOCK_HASH: ${{ hashFiles('mobile-native/Podfile.lock') }}
          PACKAGE_LOCK_HASH: ${{ hashFiles('mobile-native/package-lock.json') }}
        run: |
          echo "prefix=ios-deriveddata-${ImageOS}-xcode-${XCODE_VERSION}-${POD_LOCK_HASH}-${PACKAGE_LOCK_HASH}-" >> "$GITHUB_OUTPUT"
      # Build/ only. ModuleCache.noindex (987MB raw) stays out: it doubles the
      # entry to save a second kind of work, and the budget has no room for
      # that today (see "CI Caches" in docs/developing-evener/testing.md).
      - name: Restore the DerivedData build cache
        id: deriveddata-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.IOS_DERIVED_DATA }}/Build
          key: ${{ steps.deriveddata-cache.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.deriveddata-cache.outputs.prefix }}
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Set up Go from repository policy
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          # No built-in toolchain cache: setup-go's saves from whichever ref
          # first misses its key, pull requests included, and such an entry
          # serves only that ref. This workflow's one documented Actions cache
          # is the build job's DerivedData tree, saved on main pushes only and
          # restored by every run (see "CI Caches" in
          # docs/developing-evener/testing.md).
          cache: false
      - name: Set up Node 22.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.13.1"
      - name: Set up Ruby 3.3.6 and locked gems
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.3.6"
          bundler: "2.7.2"
          working-directory: mobile-native
          bundler-cache: true
      - name: Install committed JavaScript dependencies
        run: |
          npm ci --prefix mobile-native
          npm ci --prefix appwire-client/typescript
      - name: Test qualification policy
        run: go test ./scripts/native/ios/qualification
      # Build mode reads IOS_DERIVED_DATA from the environment. A pull-request
      # head from before the cache change carries this script and ignores the
      # variable: it builds inside its run-owned output, and the products step
      # below falls back to that tree.
      - name: Build, verify and prepare the UI test products
        run: bash scripts/native/ios/build-simulator.sh --output "$QUALIFICATION_OUTPUT"
      # The app bundles must keep their executable bits and the xctestrun its
      # relative product layout; artifact storage does not preserve file modes,
      # so the products travel as one tarball and the journeys job extracts it.
      - name: Package the products the journeys install and run
        run: |
          set -euo pipefail
          # An old pull-request head builds inside its run-owned output; a
          # current one builds in the restored external root. Prefer the
          # run-owned tree when it exists, or a restore on an old head would
          # ship products from the wrong revision.
          derived="$QUALIFICATION_OUTPUT/DerivedData"
          if [ ! -d "$derived/Build/Products" ]; then
            derived="$IOS_DERIVED_DATA"
          fi
          tar -czf "$QUALIFICATION_OUTPUT/ios-build-products.tar.gz" -C "$derived" Build/Products
          du -sh "$QUALIFICATION_OUTPUT/ios-build-products.tar.gz"
      - name: Upload the build products for the journeys job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Run-scoped, not attempt-scoped: re-running the failed jobs retains
          # this job's artifact from the earlier attempt, and the journeys job
          # of the new attempt must find it under the name it asks for.
          name: ios-build-products-${{ github.run_id }}
          path: ${{ env.QUALIFICATION_OUTPUT }}/ios-build-products.tar.gz
          if-no-files-found: error
          overwrite: true
      # Save only on a push to main. A pull request's save is readable only by
      # that ref, so it would crowd main's entry out without serving the next
      # PR. The exact-key guard mirrors the Go caches: a re-run whose restore
      # hit this commit's key has nothing new to archive. A failed build still
      # saves (!cancelled()): a cold run that stopped partway has filled much
      # of the tree, and skipping the save would leave every later run cold.
      - name: Mark the DerivedData build tree ready to save
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # The release build's log exists from the moment xcodebuild starts.
          # A restored tree alone must not save: a run that failed before the
          # build (npm ci, say) would archive the unchanged cache under a new
          # commit key. A build that failed after starting still saves its
          # partial output.
          if [ -d "$IOS_DERIVED_DATA/Build" ] && [ -f "$QUALIFICATION_OUTPUT/xcodebuild-release.log" ]; then
            echo "IOS_DERIVED_DATA_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Save the DerivedData build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deriveddata-restore.outputs.cache-hit != 'true' && env.IOS_DERIVED_DATA_READY == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.IOS_DERIVED_DATA }}/Build
          key: ${{ steps.deriveddata-cache.outputs.prefix }}${{ github.sha }}
      - name: Upload public qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QUALIFICATION_OUTPUT }}/*.log
            ${{ env.QUALIFICATION_OUTPUT }}/*.json
            ${{ env.QUALIFICATION_OUTPUT }}/*.plist
            ${{ env.QUALIFICATION_OUTPUT }}/*.exit
            ${{ env.QUALIFICATION_OUTPUT }}/Podfile.lock.candidate
            ${{ env.QUALIFICATION_OUTPUT }}/Podfile.lock.diff
          retention-days: 7
          if-no-files-found: warn

  # The journeys job's build-independent work: the runtime pair (make
  # build-runtime, the evener binary and the fixture provider). It needs
  # nothing from the build job, so it runs on its own runner while
  # simulator-build compiles, and the journeys job starts when the products
  # land instead of after both. The pair travels with the revision that built
  # it; run-ui-tests.sh refuses a pair whose revision is not the tested tree's.
  journey-setup:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Set the run-owned runtime pair path
        run: |
          printf 'RUNTIME_PAIR_OUTPUT=%s/ios-runtime-pair-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Check out the merge ref with the PR head in its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Same five-commit fetch as the build job: both merge parents for the
          # selector, and the five-title window the launch git snapshot would
          # read from the merge ref. The PR head the selector switches to keeps
          # a truncated history.
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: false
      - name: Choose the tested tree
        id: tree
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE: ${{ github.sha }}
        run: |
          bash scripts/native/ios/qualification/checkout-ref.sh \
            "$PR_HEAD" "$MERGE" \
            scripts/native/ios/build-simulator.sh \
            scripts/native/ios/qualification \
            scripts/native/ios/run-ui-tests.sh \
            scripts/native/ios/run-ui-journeys.sh >> "$GITHUB_OUTPUT"
      - name: Check out the chosen tree
        env:
          CHOSEN_REF: ${{ steps.tree.outputs.ref }}
        run: git checkout --force "$CHOSEN_REF"
      # The recipe below invokes no Xcode tool, but the Go binaries compile
      # cgo (net, os/user), so their clang comes from the selected Xcode; this
      # keeps the pair's toolchain the one the journeys job used before the
      # split.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Set up Go from repository policy
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          # No built-in toolchain cache: setup-go's saves from whichever ref
          # first misses its key, pull requests included, and such an entry
          # serves only that ref (see "CI Caches" in
          # docs/developing-evener/testing.md).
          cache: false
      - name: Set up Node 22.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # The runtime pair embeds the frontend SPA, so this job pins the same
          # Node version the build job uses. No built-in Actions cache, for the
          # same ref-scoped reason.
          node-version: "22.13.1"
      - name: Build the runtime pair
        run: make build-runtime
      - name: Package the runtime pair the journeys job runs
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME_PAIR_OUTPUT"
          # The same two builds run-ui-tests.sh used to run itself, against
          # the frontend dist make build-runtime just produced.
          go build -o "$RUNTIME_PAIR_OUTPUT/evener" ./cmd/evener
          go build -o "$RUNTIME_PAIR_OUTPUT/fixture-provider" ./scripts/native/ios/fixture-provider
          git rev-parse HEAD > "$RUNTIME_PAIR_OUTPUT/revision"
          # The revision names the tree the pair was built from, and the
          # checksums catch a pair whose bytes changed after it was built;
          # run-ui-tests.sh verifies both before running either binary.
          ( cd "$RUNTIME_PAIR_OUTPUT" && shasum -a 256 evener fixture-provider > SHA256SUMS )
          tar -czf "$RUNTIME_PAIR_OUTPUT/ios-runtime-pair.tar.gz" -C "$RUNTIME_PAIR_OUTPUT" evener fixture-provider revision SHA256SUMS
          du -sh "$RUNTIME_PAIR_OUTPUT/ios-runtime-pair.tar.gz"
      - name: Upload the runtime pair for the journeys job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-runtime-pair-${{ github.run_id }}
          path: ${{ env.RUNTIME_PAIR_OUTPUT }}/ios-runtime-pair.tar.gz
          if-no-files-found: error
          overwrite: true

  ui-journeys:
    name: UI journeys
    needs: [simulator-build, journey-setup]
    # !cancelled() keeps this job's red signal: when the build or the setup
    # fails, the first step below fails so the check that chains the lane is
    # red instead of silently skipped.
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # Fail before the prologue rather than downloading artifacts a failed
      # producer may or may not have left.
      - name: Fail when a prerequisite job did not succeed
        if: ${{ needs.simulator-build.result != 'success' || needs.journey-setup.result != 'success' }}
        env:
          BUILD_RESULT: ${{ needs.simulator-build.result }}
          SETUP_RESULT: ${{ needs.journey-setup.result }}
        run: |
          echo "simulator-build=$BUILD_RESULT journey-setup=$SETUP_RESULT" >&2
          exit 1
      - name: Set the run-owned journey output path
        run: |
          printf 'JOURNEY_OUTPUT=%s/ios-journeys-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'JOURNEY_PRODUCTS=%s/ios-journeys-products-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'JOURNEY_RUNTIME_PAIR=%s/ios-journeys-runtime-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Check out the merge ref with the PR head in its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Same five-commit fetch as the build job: both merge parents for the
          # selector, and the five-title window the launch git snapshot would
          # read from the merge ref. The PR head the selector switches to keeps
          # a truncated history, and the journeys open their session outside
          # this checkout.
          ref: ${{ github.sha }}
          fetch-depth: 5
          persist-credentials: false
      - name: Choose the tested tree
        id: tree
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE: ${{ github.sha }}
        run: |
          bash scripts/native/ios/qualification/checkout-ref.sh \
            "$PR_HEAD" "$MERGE" \
            scripts/native/ios/build-simulator.sh \
            scripts/native/ios/qualification \
            scripts/native/ios/run-ui-tests.sh \
            scripts/native/ios/run-ui-journeys.sh >> "$GITHUB_OUTPUT"
      - name: Check out the chosen tree
        env:
          CHOSEN_REF: ${{ steps.tree.outputs.ref }}
        run: git checkout --force "$CHOSEN_REF"
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Set up Go from repository policy
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          # No built-in toolchain cache: setup-go's saves from whichever ref
          # first misses its key, pull requests included, and such an entry
          # serves only that ref (see "CI Caches" in
          # docs/developing-evener/testing.md).
          cache: false
      # A head whose run-ui-tests.sh predates the pair handoff ignores the
      # variable below and runs `make build-runtime` here, which embeds the
      # frontend and needs the build job's Node. Keep the pin so that fallback
      # fails for no version reason; a harness that reads the pair never uses it.
      - name: Set up Node 22.13.1 for a harness that builds its own pair
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.13.1"
      - name: Download the build products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-build-products-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-build-products
      - name: Download the runtime pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ios-runtime-pair-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-runtime-pair-download
      - name: Restore the products layout
        run: |
          set -euo pipefail
          mkdir -p "$JOURNEY_PRODUCTS"
          tar -xzf "$RUNNER_TEMP/ios-build-products/ios-build-products.tar.gz" -C "$JOURNEY_PRODUCTS"
      - name: Restore the runtime pair layout
        run: |
          set -euo pipefail
          mkdir -p "$JOURNEY_RUNTIME_PAIR"
          tar -xzf "$RUNNER_TEMP/ios-runtime-pair-download/ios-runtime-pair.tar.gz" -C "$JOURNEY_RUNTIME_PAIR"
      - name: Run the installed-app journeys
        env:
          # run-ui-tests.sh uses this pair instead of building one: it compares
          # the pair's recorded commit with the build identity's sourceRevision
          # and its binaries' bytes with the manifest shipped beside them.
          EVENER_QUALIFICATION_RUNTIME_BINARIES: ${{ env.JOURNEY_RUNTIME_PAIR }}
        run: bash scripts/native/ios/run-ui-journeys.sh --products "$JOURNEY_PRODUCTS" --output "$JOURNEY_OUTPUT"
      - name: Upload journey diagnostics
        # The prerequisite gate fails before the output path exists; without
        # this condition the paths below would glob from the filesystem root.
        if: ${{ always() && env.JOURNEY_OUTPUT != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.JOURNEY_OUTPUT }}/*.log
            ${{ env.JOURNEY_OUTPUT }}/*.json
            ${{ env.JOURNEY_OUTPUT }}/ui/*.log
            ${{ env.JOURNEY_OUTPUT }}/ui/*.json
            ${{ env.JOURNEY_OUTPUT }}/ui/*.exit
            ${{ env.JOURNEY_OUTPUT }}/ui/ui.xcresult
          retention-days: 7
          if-no-files-found: warn
