version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Go modules are deliberately absent: this repo is a go.work workspace
  # whose modules live under the internal vanity path primeradiant.com/evener,
  # which is not a fetchable module host. Dependabot's gomod updater resolves
  # each go.mod without workspace context and 404s on the sibling imports
  # (#289). Go dependency bumps are a reviewed, manual affair — as are the
  # frontend's npm bumps (owner ruling, 2026-08-19).
