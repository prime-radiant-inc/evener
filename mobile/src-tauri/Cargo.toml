[package]
name = "app"
version = "0.1.0"
description = "Evener mobile client"
edition = "2021"
rust-version = "1.98.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "evener-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-evener-native = { path = "../tauri-plugin-evener-native" }
url = "2.5"
uuid = { version = "1.24", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
base64 = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
parking_lot = "0.12"
log = "0.4"
rustls = "0.23"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
tauri = { version = "=2.11.5", features = ["test"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rcgen = "0.14"
tokio-rustls = "0.26"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
