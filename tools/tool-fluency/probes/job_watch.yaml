schema: 1
id: job_watch.observer_callback
tool: job_watch
prompt: |
  Start an observer delegate with watch_parent=true and max_wait_ms 60000. Its task is:
  "Create a job_watch with source \"parent\" for events [\"assistant.tool\"] and event_filter {\"tool_name\":\"read_file\",\"status\":\"ok\"}. After the watch is installed, communicate with end_turn=true and message OBSERVER_READY. When a later watch frame reports a parent read_file event for watch-trigger.txt with status ok, communicate with end_turn=true and message WATCH_OBSERVED."

  After the observer reports OBSERVER_READY, read watch-trigger.txt. Finish only after the observer callback arrives, with RESULT_JOB_WATCH.
fixture:
  files:
    watch-trigger.txt: "WATCH_TRIGGER_FILE\n"
expect:
  calls:
    - tool: delegate
    - tool: job_watch
    - tool: read_file
    - tool: communicate
  forbidden_calls: [delegate_send, job_list, job_read_output, read_session_transcript]
  final_contains: ["RESULT_JOB_WATCH"]
