version: "2"

run:
  # One process per regime; 4 matches the main config's worker count.
  concurrency: 4

# AppWire and device voice JSON use camelCase inside packages whose other
# surfaces use snake_case. tagliatelle's overrides are per PACKAGE, so the
# main .golangci.yml delegates only the named files/fields to this pass.
#
# This config is the other half: it checks camelCase JSON only in
# server/appwire_*.go and the explicitly listed voice files below. Voice
# realtime provider frames and unrelated hub/agent JSON remain snake_case in
# the main pass. The live presentation test mixes both surfaces, so its three
# tool-result fields stay under the main pass rather than this camelCase one.
#
# `make lint-golangci` runs it after the main sweep.

linters:
  default: none
  enable:
    - tagliatelle
  settings:
    tagliatelle:
      case:
        # Same key set as .golangci.yml: json and toml only, every other tag
        # key disabled so tagliatelle's own defaults (yaml/xml/bson: camel, …)
        # stay out. The overrides apply only to the files retained by the
        # exclusion below, never to their whole mixed-case packages.
        rules:
          json: snake
          toml: snake
          yaml: ""
          xml: ""
          bson: ""
          avro: ""
          header: ""
          env: ""
          envconfig: ""
        overrides:
          - pkg: server
            rules:
              json: camel
          - pkg: agent
            rules:
              json: camel
          - pkg: cmd/evener-hub
            rules:
              json: camel
          - pkg: cmd/evener-hub/internal/hubcore
            rules:
              json: camel
  exclusions:
    generated: lax
    rules:
      # Note the direction: if this anchored pattern ever stops matching — the
      # way golangci's cross-worktree cache can turn reported paths into
      # `../../server/…` (see docs/developing-evener/conventions/naming.md) — this run excludes
      # everything and goes quiet, where the main config's `path:` exclusions
      # go loudly red instead. That asymmetry is only safe because the same
      # cache state reds the main sweep first: server/appwire_*_test.go holds
      # camelCase tags that the main config's snake_case root rule reports the
      # moment its own `^server/appwire_` exclusion stops matching, and
      # lint-golangci runs that sweep before this one and stops on failure.
      # Keep at least one camelCase tag in those files, or restore the guard
      # some other way.
      - path-except: '^(server/appwire_|cmd/evener-hub/(voice_bridge|voice_http(_test)?|e2e_voice_presentation_test|internal/hubcore/voice_journal(_presentation_test)?)\.go$|agent/session_voice_presentation(_test|_live_test)?\.go$)'
        linters:
          - tagliatelle
      # These tool-result fields are not the camelCase presentation payload.
      # Match Go field names, not tag spellings: the main pass must still
      # reject a casing mistake in any of their JSON/TOML tags.
      - path: '^agent/session_voice_presentation_live_test\.go$'
        source: '^\s*(EndTurn|TargetID|CandidateIDs)\s'
        linters:
          - tagliatelle

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
