version: "2"

run:
  concurrency: 2
  timeout: 5m
  tests: true

# golangci truncates its own output by default — max-same-issues 3, and
# max-issues-per-linter 50 — which makes the gate under-report what it
# found. One run printed "22 issues" for a tree that held 55, because 34
# perfsprint findings with identical message text collapsed to 3. A kata
# was written from that count, and clearing all 22 would have left the
# gate red with the hidden duplicates resurfacing three at a time. A gate
# that hides its own findings costs more than a noisy one.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - misspell
    # modernize rewrites loops and stdlib calls into their current forms.
    # Enabled deliberately rather than swept once: a one-time cleanup drifts
    # straight back, so the value is in the gate, not the diff. It also
    # carries one non-cosmetic check - omitempty on a struct value, which Go
    # never omits, so the tag misdescribes the wire (kata mams).
    - modernize
    - nakedret
    - nilerr
    - noctx
    - perfsprint
    - predeclared
    - revive
    - tagliatelle
    - unconvert
    - usestdlibvars
  settings:
    govet:
      disable:
        - inline
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        # exported gates doc comments on the published libraries' exported
        # package-level surface (formerly cmd/evener-docscheck). Scoped to
        # the library dirs by the path-except exclusion below.
        - name: exported
          arguments:
            - "disable-stuttering-check"
    tagliatelle:
      case:
        rules:
          json: snake
          toml: snake
          # tagliatelle applies its own defaults (yaml/xml/bson: camel, …)
          # for any tag key left unset. Empty string disables a key, so the
          # gate checks exactly the two casings namingcheck enforced.
          yaml: ""
          xml: ""
          bson: ""
          avro: ""
          header: ""
          env: ""
          envconfig: ""
        # The codex/appwire wire protocol forces camelCase JSON tags in these
        # packages (formerly evener-namingcheck's path carve-outs).
        # pkg values are module-relative package paths, not import paths
        # (verified empirically against golangci-lint v2.12.2).
        overrides:
          - pkg: appwire
            rules:
              json: camel
          - pkg: cmd/evener-hub/internal/appsource
            rules:
              json: camel
          - pkg: internal/appserver
            rules:
              json: camel
          - pkg: internal/appprojector
            rules:
              json: camel
          - pkg: cmd/evener-hub/internal/launchconfig
            rules:
              json: camel
          # Google's REST API wire format is camelCase; these structs mirror
          # its ListModels response verbatim.
          - pkg: providers/google
            rules:
              json: camel
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # hugeParam/rangeValCopy/rangeExprCopy fight this codebase's deliberate
      # value-semantics (interface method sets, public APIs, value receivers,
      # MarshalJSON, bubbletea models) — micro-perf noise, not bug-catching.
      # The rest of the performance tag (equalFold, appendCombine, …) and all
      # of diagnostic stay enabled.
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy
        - rangeExprCopy
  exclusions:
    generated: lax
    rules:
      # Tests routinely ignore these intentionally.
      - path: _test\.go
        linters:
          - bodyclose
          - noctx
          - errcheck
      # SA5011 in tests is a staticcheck blind spot, not a defect: it does not
      # infer that t.Fatal terminates, so the near-universal
      #   if got == nil { t.Fatal(...) }
      #   got.Field ...
      # shape reads to it as a possible nil dereference. 251 sites across 80
      # files, none of them bugs - and a genuine nil deref in a test fails that
      # test loudly anyway, so the rule buys nothing here that running the
      # suite does not.
      #
      # They were invisible until `modernize` was enabled: adding it changes
      # how golangci runs the analysis pass, and staticcheck then reports on
      # files modernize itself never touches. Verified by removing modernize
      # on a cold cache, which takes the count to zero.
      - path: _test\.go
        text: SA5011

      # llm/providers/ speaks each upstream provider's wire format; tag
      # casing belongs to upstream, not to this repo's snake_case default.
      # (Paths are relative to this config file, so this matches the llm
      # module's run from the repo root.)
      - path: ^llm/providers/
        linters:
          - tagliatelle
      # server/appwire_*.go mirrors the camelCase appwire wire format inside
      # a package that is otherwise snake_case. tagliatelle's overrides are
      # per-package, so this per-file regime is expressed as an exclusion.
      - path: ^server/appwire_
        linters:
          - tagliatelle

      # revive's exported rule gates only the published library packages
      # (the old cmd/evener-docscheck scope); everywhere else its findings
      # are excluded. The text pattern matches the message as golangci
      # reports it — "exported: exported method/function/… " or "exported:
      # comment on exported …" — and the rule-name prefix keeps it clear of
      # unexported-return's "unexported-return: exported func …" wording.
      - path-except: '^(llm/[^/]+|agent/[^/]+|agent/(diagnostic|events|execenv|mcpconfig|plugin|provider|schema|skill|task|transcript)/[^/]+|auth/openai/[^/]+)\.go$'
        text: '^exported: (exported (method|function|type|const|var)|comment on exported)'
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports
