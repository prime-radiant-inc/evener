version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - misspell
    # modernize rewrites loops and stdlib calls into their current forms.
    # Enabled deliberately rather than swept once: a one-time cleanup drifts
    # straight back, so the value is in the gate, not the diff. It also
    # carries one non-cosmetic check - omitempty on a struct value, which Go
    # never omits, so the tag misdescribes the wire (kata mams).
    - modernize
    - nakedret
    - nilerr
    - noctx
    - perfsprint
    - predeclared
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # hugeParam/rangeValCopy/rangeExprCopy fight this codebase's deliberate
      # value-semantics (interface method sets, public APIs, value receivers,
      # MarshalJSON, bubbletea models) — micro-perf noise, not bug-catching.
      # The rest of the performance tag (equalFold, appendCombine, …) and all
      # of diagnostic stay enabled.
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy
        - rangeExprCopy
  exclusions:
    generated: lax
    rules:
      # Tests routinely ignore these intentionally.
      - path: _test\.go
        linters:
          - bodyclose
          - noctx
          - errcheck
      # SA5011 in tests is a staticcheck blind spot, not a defect: it does not
      # infer that t.Fatal terminates, so the near-universal
      #   if got == nil { t.Fatal(...) }
      #   got.Field ...
      # shape reads to it as a possible nil dereference. 251 sites across 80
      # files, none of them bugs - and a genuine nil deref in a test fails that
      # test loudly anyway, so the rule buys nothing here that running the
      # suite does not.
      #
      # They were invisible until `modernize` was enabled: adding it changes
      # how golangci runs the analysis pass, and staticcheck then reports on
      # files modernize itself never touches. Verified by removing modernize
      # on a cold cache, which takes the count to zero.
      - path: _test\.go
        text: SA5011

formatters:
  enable:
    - gofmt
    - goimports
